function rdCarStandingsCard() {
  const myTeamId = S.player.teamId;
  const myTeam = playerTeam();
  const sorted = [...S.teams].sort((a, b) => b.car - a.car || a.name.localeCompare(b.name));
  const myRank = sorted.findIndex(t => t.id === myTeamId) + 1;
  const gapToLeader = round1(sorted[0].car - myTeam.car);
  const teamBehind = myRank < sorted.length ? sorted[myRank] : null;
  const gapToBehind = teamBehind ? round1(myTeam.car - teamBehind.car) : 0;

  const SCALE_MIN = 45, SCALE_MAX = 99, span = SCALE_MAX - SCALE_MIN;

  let summary;
  if (myRank === 1) {
    summary = `<span class="text-gold font-bold">${esc(t('rd.tech_leader'))}</span>`;
  } else if (teamBehind) {
    summary = `<span class="text-racing">${esc(t('rd.tech_from_leader'))} <b>-${gapToLeader}</b></span>
             · <span class="text-emerald-400">${esc(t('rd.tech_from_next'))} <b>+${gapToBehind}</b></span>`;
  } else {
    summary = `<span class="text-racing">${esc(t('rd.tech_from_leader'))} <b>-${gapToLeader}</b></span>`;
  }

  return `
  <div class="card overflow-hidden mb-4">
    <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between gap-2 flex-wrap">
      <span class="text-[11px] uppercase tracking-wider text-slate-400">${esc(t('rd.tech_grid'))}</span>
      <span class="text-[11px] text-slate-400">
        <b class="text-white">P${myRank}</b>/${sorted.length} · ${summary}
      </span>
    </div>
    <div class="p-2">
      ${sorted.map((team, i) => {
        const isMe = team.id === myTeamId;
        const isLeader = i === 0;
        const pct = clamp(((team.car - SCALE_MIN) / span) * 100, 3, 100);
        return `
        <div class="flex items-center gap-2 px-2 py-1.5 rounded-lg ${isMe ? 'bg-racing/15' : ''}">
          <span class="w-4 text-center text-[10px] font-black ${isLeader ? 'text-gold' : 'text-slate-500'}">${i + 1}</span>
          <span class="w-1.5 h-4 rounded-sm shrink-0" style="background:${safeColor(team.color)}"></span>
          <span class="flex-1 min-w-0 truncate text-[11px] ${isMe ? 'font-black text-white' : 'text-slate-300'}">
            ${esc(team.name)}
          </span>
          <div class="w-20 sm:w-28 h-2 rounded-full bg-carbon3 overflow-hidden shrink-0">
            <div class="h-full rounded-full transition-all duration-500"
              style="width:${pct}%;background:${safeColor(team.color)}"></div>
          </div>
          <span class="w-7 text-right text-[11px] font-black text-slate-200">${Math.round(team.car)}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function circuitStatsCard() {
  const entries = Object.entries(S.circuitStats || {}).filter(([, v]) => v.races > 0);
  if (!entries.length) return '';
  const rows = entries.map(([gp, v]) => {
    const cal = CALENDAR.find(c => c.gp === gp);
    return { gp, flag: cal ? cal.flag : '🏁', ...v, avg: v.finishes ? v.posSum / v.finishes : null };
  }).sort((a, b) => b.races - a.races || (a.avg ?? 99) - (b.avg ?? 99));
  const fav = rows.filter(r => r.finishes >= 2).sort((a, b) => a.avg - b.avg)[0];
  return `
   <div class="card overflow-hidden">
    <div class="px-4 py-3 border-b border-slate-800 font-black text-sm uppercase tracking-wider">${esc(t('career.circuit_stats'))}</div>

    <div class="divide-y divide-slate-800/60 max-h-72 overflow-y-auto">
      ${rows.map(r => `
        <div class="flex items-center gap-2 px-4 py-2 text-sm">

          <span class="text-[11px] text-slate-400 w-20 text-right">🥇${r.wins} 🍾${r.podiums} ⏱️${r.poles}</span>

}

/* ---------- SETUP ---------- */
function goSetup() {
  S.forecast = rollForecast();
  S.forecast.hidden = drawWeatherFromForecast(S.forecast);   // persistito
  S.asphaltTemp = rollAsphaltTemp();
  S.screen = 'setup';
  scheduleSave(0); render();
}
function chooseSetup(id) {
  if (S.screen !== 'setup') return;
  const r = CALENDAR[S.round];
  const s = SETUPS.find(x => x.id === id);
  if (!s) return;
  S.weather = (S.forecast && S.forecast.hidden) || drawWeatherFromForecast(S.forecast);
  if (S.forecast) S.forecast.hidden = null;
  S.asphaltTemp = applyWeatherToAsphalt(S.asphaltTemp, S.weather.name);  // ← correzione QUI
S.setupBonus = setupBonusFor(id, r.type, S.weather.name) + facilitySetupBonus(playerTeam());
  S.setupId = id;
  S.setupLabel = s.name;
  save();
  goQualifying();
}

/* ---------- QUALIFICHE ---------- */
function goQualifying() { startQualifying({ keepWeather: true }); }

function startQualifying(opts = {}) {
  if (!opts.keepWeather) S.weather = pickWeather();
  S.reviewingFromStrategy = false;
  S.quali = {
    session: 0, sessions: {}, playerPos: {}, commentary: {},
    status: 'running', eliminatedIn: null, finalPos: null,
    savedTyres: false
  };
  runQualiSession(1);
  S.screen = 'quali';
  save(); render();
}
// v32: rendimento decrescente della speed oltre 90 in qualifica
// speed 90 → 90; speed 95 → 91.5; speed 99 → 92.7
function qualiSpeedContribution(speed) {
  if (!Number.isFinite(speed)) return 50;
  if (speed <= 90) return speed;
  return 90 + (speed - 90) * 0.30;
}
function simulateQualiTimes(participantIds, sessionNum) {
  const cfg = QUALI_SESSIONS[sessionNum];
  const circuit = CALENDAR[S.round];
  const baseLap = (circuit && Number.isFinite(circuit.lapTimeBase))
    ? circuit.lapTimeBase : QUALI_DEFAULT_LAP_BASE;

  const rows = participantIds.map(id => {
    const d = driverById(id);
    let sc = basePace(d);

   if (d.isPlayer) {
  // v32: la speed oltre 90 ha rendimento decrescente in qualifica
  const effSpeed = qualiSpeedContribution(d.speed);
  sc += (effSpeed - 50) * SIM_TUNING.qualiPlayerSpeedBoost;
  const negScale = clamp(
    1 - (d.consistency - 50) * SIM_TUNING.qualiNegScaleConsistency * cfg.consMult,
    SIM_TUNING.qualiNegScaleMin,
    SIM_TUNING.qualiNegScaleMax
  );
  let q = rnd(-cfg.noise, cfg.noise);
  if (q < 0) q *= negScale;
  sc += q * (1 + (S.weather.chaos - 1) * SIM_TUNING.qualiWeatherChaosScale);
} else {
      sc += rnd(-cfg.noise, cfg.noise) * (1 + (S.weather.chaos - 1) * SIM_TUNING.qualiWeatherChaosScale);
    }
    return { id, sc };
  });

  rows.sort((a, b) => b.sc - a.sc);

  // v32: converti sc in tempo sul giro + gap dal più veloce della sessione
  const fastestSc = rows[0].sc;
  rows.forEach(r => {
    r.time = baseLap + (fastestSc - r.sc) * QUALI_TIME_PER_SC;
    r.gap  = r.time - rows[0].time;
  });

  return rows;
}

function getQualiParticipants(sessionNum) {
  if (sessionNum === 1) return S.drivers.map(d => d.id);
  if (sessionNum === 2) return S.quali.sessions[1].slice(0, 15).map(r => r.id);
  if (sessionNum === 3) {
    const q2Top10 = S.quali.sessions[2].slice(0, 10);
    if (S.quali.status === 'retired') return q2Top10.filter(r => r.id !== 'PLAYER').map(r => r.id);
    return q2Top10.map(r => r.id);
  }
  return [];
}

function awardPole(driverId) {
  const d = driverById(driverId);
  if (!d) return;
  d.poles++;
  if (d.isPlayer) {
    S.totals.poles++;
    const race = CALENDAR[S.round];
    if (race) circuitStatFor(race.gp).poles++;
  }
}

function circuitStatFor(gp) {
  if (!S.circuitStats) S.circuitStats = {};
  if (!S.circuitStats[gp]) {
    S.circuitStats[gp] = { races:0, wins:0, podiums:0, poles:0, points:0, dnf:0, bestPos:null, posSum:0, finishes:0 };
  }
  return S.circuitStats[gp];
}

function runQualiSession(sessionNum) {
  const cfg = QUALI_SESSIONS[sessionNum];
  const participants = getQualiParticipants(sessionNum);
  const rows = simulateQualiTimes(participants, sessionNum);

  S.quali.sessions[sessionNum] = rows;
  S.quali.session = sessionNum;

  const pIdx = rows.findIndex(r => r.id === 'PLAYER');
  const playerPos = pIdx >= 0 ? pIdx + 1 : null;
  S.quali.playerPos[sessionNum] = playerPos;

  const prevPos = sessionNum > 1 ? S.quali.playerPos[sessionNum - 1] : null;
  S.quali.commentary[sessionNum] = generateQualiCommentary(sessionNum, playerPos, prevPos);

  if (sessionNum < 3) {
    if (pIdx < 0 || pIdx >= cfg.advance) {
      S.quali.status = 'eliminated';
      S.quali.eliminatedIn = sessionNum;
      S.quali.finalPos = playerPos;
      runRemainingQualiSessions(sessionNum);
    }
  } else {
    if (rows[0]) awardPole(rows[0].id);
    S.quali.status = 'done';
  }
}

function generateQualiCommentary(sessionNum, playerPos, prevPos) {
  const msgs = [];
  const cfg = QUALI_SESSIONS[sessionNum];
  if (playerPos == null) return msgs;

  if (sessionNum === 3) {
    if (playerPos === 1) msgs.push({ type: 'good', text: t('quali.radio.pole') });
    else if (playerPos <= 3) msgs.push({ type: 'good', text: t('quali.radio.q3_top3', { n: playerPos }) });
    else msgs.push({ type: 'info', text: t('quali.radio.q3_pos', { n: playerPos }) });
  } else if (playerPos === 1) {
    msgs.push({ type: 'good', text: t('quali.radio.fastest') });
  } else if (playerPos <= cfg.advance) {
    msgs.push({ type: 'info', text: t('quali.radio.in_zone', { name: cfg.name, pos: playerPos }) });
  } else {
    msgs.push({ type: 'bad', text: t('quali.radio.out_zone', { name: cfg.name, pos: playerPos }) });
  }

  if (prevPos != null) {
    if (playerPos < prevPos) msgs.push({ type: 'good', text: t('quali.radio.gain', { n: prevPos - playerPos }) });
    else if (playerPos > prevPos) msgs.push({ type: 'warn', text: t('quali.radio.lose', { n: playerPos - prevPos }) });
  } else if (playerPos <= 3) {
    msgs.push({ type: 'good', text: t('quali.radio.good_start') });
  } else if (playerPos >= 18) {
    msgs.push({ type: 'warn', text: t('quali.radio.insufficient') });
  }

  if (S.weather.name === 'Pioggia') msgs.push({ type: 'warn', text: t('quali.radio.rain') });
  else if (S.weather.name === 'Variabile') msgs.push({ type: 'info', text: t('quali.radio.var') });

  return msgs.slice(0, QUALI_COMMENTARY_CAP);
}

function runRemainingQualiSessions(fromSession) {
  for (let s = fromSession + 1; s <= 3; s++) {
    if (S.quali.sessions[s]) continue;
    const participants = getQualiParticipants(s);
    const rows = simulateQualiTimes(participants, s);
    S.quali.sessions[s] = rows;
    if (s === 3) {
      const prevPos = S.quali.playerPos[2] ?? null;
      S.quali.commentary[3] = generateQualiCommentary(3, S.quali.playerPos[3] ?? null, prevPos);
    }
  }
  const q3Rows = S.quali.sessions[3];
  if (q3Rows && q3Rows[0]) awardPole(q3Rows[0].id);
}

function advanceQuali() {
  if (S.quali.status === 'eliminated' || S.quali.status === 'retired') return completeQualifying();
  if (S.quali.session >= 3) return completeQualifying();
  runQualiSession(S.quali.session + 1);
  save(); render();
}

function skipQ3() {
  if (S.quali.session !== 2) return;
  const pPos = S.quali.playerPos[2];
  if (!pPos || pPos > 10) return;

  S.quali.status = 'retired';
  S.quali.finalPos = 10;
  S.quali.savedTyres = true;

  const q2Top10 = S.quali.sessions[2].slice(0, 10);
  const others = q2Top10.filter(r => r.id !== 'PLAYER').map(r => r.id);
  const q3Rows = simulateQualiTimes(others, 3);
  S.quali.sessions[3] = q3Rows;
  S.quali.session = 3;

  if (q3Rows[0]) awardPole(q3Rows[0].id);

  save(); render();
}

function buildGridFromQuali() {
  const grid = [];
  if (S.quali.sessions[3]) S.quali.sessions[3].forEach(r => grid.push(r.id));
  if (S.quali.status === 'retired') grid.push('PLAYER');
  if (S.quali.sessions[2] && S.quali.sessions[2].length >= 15) S.quali.sessions[2].slice(10, 15).forEach(r => grid.push(r.id));
  if (S.quali.sessions[1]) S.quali.sessions[1].slice(15, 22).forEach(r => grid.push(r.id));
  const seen = new Set();
  S.grid = grid.filter(id => { if (seen.has(id)) return false; seen.add(id); return true; });

  S.grid = applyGridPenalties(S.grid);
  applySessionTempShift();
}

function isSprintWeekend() {
  return !!CALENDAR[S.round] && SPRINT_GPS.has(CALENDAR[S.round].gp);
}

function completeQualifying() {
  if (S.reviewingFromStrategy) {
    S.reviewingFromStrategy = false;
    S.screen = 'strategy';
    save(); render();
    return;
  }
  buildGridFromQuali();
  if (isSprintWeekend() && !S.sprintDone) {
    simSprint();
    S.screen = 'sprint';
  } else {
    S.screen = 'strategy';
  }
  save(); render();
}

function simQualifying(opts = {}) {
  if (!opts.keepWeather) {
    S.weather = pickWeather();
    S.asphaltTemp = rollAsphaltTemp();
    S.asphaltTemp = applyWeatherToAsphalt(S.asphaltTemp, S.weather.name);
  }
  S.quali = {
    session: 0, sessions: {}, playerPos: {}, commentary: {},
    status: 'running', eliminatedIn: null, finalPos: null,
    savedTyres: false
  };
  runQualiSession(1);
  if (S.quali.status === 'running') runQualiSession(2);
  if (S.quali.status === 'running') runQualiSession(3);
  buildGridFromQuali();
}
/* v24: correzione clima → temperatura asfalto (meteo reale del weekend) */
function applyWeatherToAsphalt(temp, weatherName) {
  if (!Number.isFinite(temp)) return temp;
  if (weatherName === 'Variabile') return Math.max(8, Math.round(temp - rnd(4, 9)));
  if (weatherName === 'Pioggia')   return Math.max(8, Math.round(temp - rnd(10, 16)));
  return temp;
}

/* ---------- SPRINT ---------- */
function simSprint() {
  const w = S.weather, circuit = CALENDAR[S.round];
  const amp = SIM_TUNING.raceNoise * 0.6;
  const rows = S.grid.map((id, gridPos) => {
    const d = driverById(id);
    const car = teamById(d.teamId).car;
    let sc = car * SIM_TUNING.raceCarWeight + d.ovr * SIM_TUNING.raceOvrWeight
           - gridPos * SIM_TUNING.raceGridPenalty * 1.25
           + traitBonus(d.trait, 'race', w.name, circuit.type) + (ROLE_PACE[d.role] || 0);
    let roll = rnd(-amp, amp);
    if (d.isPlayer) {
      sc += diff().paceBonus * 0.5;
      const negScale = clamp(1 - (d.consistency - 50) * SIM_TUNING.raceNegScaleConsistency,
                             SIM_TUNING.raceNegScaleMin, SIM_TUNING.raceNegScaleMax);
      if (roll < 0) roll *= negScale;
    }
    sc += roll * w.chaos;
    let dnfChance = clamp(SIM_TUNING.dnfBase + (100 - car) * SIM_TUNING.dnfCarSlope, 0.02, 0.08) * 0.5;
    if (d.isPlayer) dnfChance *= diff().dnfMult;
    return { id, sc, dnf: rng() < dnfChance, grid: gridPos + 1 };
  });
  const order = [...rows.filter(r => !r.dnf).sort((a, b) => b.sc - a.sc), ...rows.filter(r => r.dnf)];
  order.forEach((r, i) => {
    r.pos = r.dnf ? null : i + 1;
    r.points = (!r.dnf && i < SPRINT_POINTS.length) ? SPRINT_POINTS[i] : 0;
    driverById(r.id).pts += r.points;
  });
  const me = order.find(r => r.id === 'PLAYER');
  S.totals.points += me.points;
  S.totals.sprintPoints = (S.totals.sprintPoints || 0) + me.points;
  S.lastSprint = order.map(({ id, dnf, grid, pos, points }) => ({ id, dnf, grid, pos, points }));
    S.sprintDone = true;

  /* v23: gli sprint contano nello storico stagionale */
  const rival = rivalDriver();
  S.seasonLog.push({
    gp: circuit.gp, flag: circuit.flag, isSprint: true,
    grid: me.grid, pos: me.pos, points: me.points,
    dnf: me.dnf, weather: w.name, sc: false, strat: null, fl: false,
    cum: S.player.pts,
    leader: Math.max(...S.drivers.map(d => d.pts)),
    rival: rival ? rival.pts : null
  });
  if (!me.dnf && me.pos) {
    const cs = circuitStatFor(circuit.gp);
    cs.sprints = (cs.sprints || 0) + 1;
  }
}

const RADIO_STYLES = {
  info:  { color: 'text-slate-200',  bg: '', icon: '📻' },
  good:  { color: 'text-emerald-300', bg: 'bg-emerald-600/10', icon: '✅' },
  warn:  { color: 'text-gold',       bg: 'bg-gold/10',        icon: '⚠️' },
  bad:   { color: 'text-racing',     bg: 'bg-racing/10',      icon: '🚨' }
};

/* Messaggi radio pre-gara: partenza, temperatura, snowball, gomme risparmiate, assetto */
function generateRadioPreRace() {
  const msgs = [];

  msgs.push({
    lap: 1, type: 'info',
    text: rng() < 0.5 ? t('rrace.start_1') : t('rrace.start_2')
  });

  if (S._snowballActive && S._snowballActive > 0) {
    msgs.push({
      lap: 2, type: 'warn',
      text: t('rrace.snowball', { n: S._snowballActive.toFixed(1) })
    });
  }

  if (S.quali && S.quali.savedTyres) {
    msgs.push({ lap: 1, type: 'info', text: t('rrace.saved_tyres') });
  }

  if (Number.isFinite(S.asphaltTemp) && S.asphaltTemp >= 45) {
    msgs.push({ lap: irnd(3, 8), type: 'warn', text: t('rrace.hot_1', { n: S.asphaltTemp }) });
  } else if (Number.isFinite(S.asphaltTemp) && S.asphaltTemp <= 18) {
    msgs.push({ lap: irnd(3, 8), type: 'info', text: t('rrace.cold', { n: S.asphaltTemp }) });
  } else if (Number.isFinite(S.asphaltTemp) && S.asphaltTemp >= 38) {
    msgs.push({ lap: irnd(3, 8), type: 'info', text: t('rrace.hot_2', { n: S.asphaltTemp }) });
  }

  if ((S.setupBonus || 0) < 0) {
    msgs.push({
      lap: irnd(3, 8), type: 'warn',
      text: rng() < 0.5 ? t('rrace.setup_bad_1') : t('rrace.setup_bad_2')
    });
  }
  /* v29 Step 7: penalty PU in griglia */
  const myPenalty = computeGridPenalties()['PLAYER'];
  if (myPenalty > 0) {
    msgs.push({
      lap: 1, type: 'bad',
      text: t('rrace.pu_penalty', { n: myPenalty })
    });
  }
  msgs.sort((a, b) => a.lap - b.lap);
  return msgs;
}
/* Messaggi radio finali: rivalità, guadagno posizioni, messaggio conclusivo */
function generateRadioFinal(me, safetyCar) {
  const msgs = [];
  const totalLaps = (CALENDAR[S.round] && CALENDAR[S.round].laps) || 57;
  const rival = rivalDriver();

  if (rival && !me.dnf) {
    const rivalResult = S.lastRace ? S.lastRace.find(r => r.id === S.rivalId) : null;
    if (rivalResult && !rivalResult.dnf && me.pos && rivalResult.pos) {
      if (me.pos < rivalResult.pos) {
        msgs.push({ lap: irnd(22, 42), type: 'good',
          text: t('rrace.rival_beating', { name: rival.name.split(' ')[0], pos: me.pos, rpos: rivalResult.pos }) });
      } else if (me.pos > rivalResult.pos) {
        msgs.push({ lap: irnd(22, 42), type: 'warn',
          text: t('rrace.rival_ahead', { name: rival.name.split(' ')[0] }) });
      }
    }
  }

  const gained = me.grid - (me.pos || 22);
  if (!me.dnf) {
    if (gained >= 6) {
      msgs.push({ lap: irnd(22, 42), type: 'good', text: t('rrace.comeback', { n: gained }) });
    } else if (gained >= 2) {
      msgs.push({ lap: irnd(22, 42), type: 'good', text: t('rrace.gaining') });
    } else if (gained <= -4) {
      msgs.push({ lap: irnd(22, 42), type: 'bad', text: t('rrace.losing') });
    }
  }

  if (me.dnf) {
    msgs.push({
      lap: irnd(8, 45), type: 'bad',
      text: rng() < 0.5 ? t('rrace.dnf_1') : t('rrace.dnf_2')
    });
  } else {
    let finalText, finalType;
    if (me.pos === 1) { finalText = t('radio.win'); finalType = 'good'; }
    else if (me.pos <= 3) { finalText = t('radio.podium'); finalType = 'good'; }
    else if (me.pos <= 10) { finalText = t('radio.points'); finalType = 'info'; }
    else if (me.pos <= 15) { finalText = t('radio.no_points'); finalType = 'info'; }
    else { finalText = t('radio.bad_race'); finalType = 'bad'; }
    msgs.push({ lap: totalLaps, type: finalType, text: finalText });
  }

  msgs.sort((a, b) => a.lap - b.lap);
  return msgs;
}

/* Wrapper di retrocompatibilità (usato dai test) */
function generateRadio(ctx) {
  const { me, safetyCar } = ctx;
  const all = [
    ...generateRadioPreRace(),
    ...generateRadioFinal(me, safetyCar)
  ];
  all.sort((a, b) => a.lap - b.lap);
  return all.slice(0, RADIO_LOG_CAP);
}
 

/* =========================================================================
   ============================ GARA A STINT ===============================
   ========================================================================= */

const wearMultFor = d => d.isPlayer ? clamp(1 - (d.tyres - 55) / 100, 0.6, 1.3) : 1;
const aiPaceMode = () => { const r = rng(); return r < 0.20 ? 'push' : r < 0.85 ? 'normal' : 'save'; };
const liveStandings = L => L.rows.filter(r => !r.dnf).sort((a, b) => (b.sc - a.sc) || (a.grid - b.grid));
/* ===== v29 Step 7: PU wear & grid penalty ===== */

/* Fattore circuito per il consumo PU */
function puCircuitFactor(circuit, asphaltTemp) {
  if (!circuit) return 1;
  let m = 1;
  if (circuit.type === 'power')  m += 0.30;
  if (circuit.type === 'twisty') m += 0.10;
  if (Number.isFinite(asphaltTemp) && asphaltTemp > 40) m += 0.20;
  if (NIGHT_GPS.has(circuit.gp)) m -= 0.10;
  return m;
}

/* Consuma PU per ogni pilota dopo ogni gara.
   Chiamata da finalizeRace con race = la gara appena disputata. */
function advancePUWear(race) {
  if (!S.powerUnits) S.powerUnits = {};
  if (!race) return;

  const temp = Number.isFinite(S.asphaltTemp) ? S.asphaltTemp : REF_ASPHALT_TEMP;
  const mult = puCircuitFactor(race, temp);

S.drivers.forEach(d => {
  const pu = S.powerUnits[d.id] || (S.powerUnits[d.id] = { used: 1, wear: 0 });
  const variance = d.isPlayer ? 1 : rnd(0.90, 1.10);
  const team = teamById(d.teamId);
  const facMult = team ? facilityPUWearMult(team) : 1;      // v32
  pu.wear += PU_BASE_WEAR * mult * variance * facMult;
  if (pu.wear >= PU_WEAR_RESET_AT) {
    pu.used += 1;
    pu.wear = pu.wear - PU_WEAR_RESET_AT;
  }
});
}

/* Calcola le posizioni di penalty per ogni pilota */
function computeGridPenalties() {
  const out = {};
  if (!S.powerUnits) return out;
  S.drivers.forEach(d => {
    const pu = S.powerUnits[d.id];
    if (!pu) return;
    const excess = Math.max(0, pu.used - PU_LIMIT);
    if (excess > 0) out[d.id] = excess * PU_GRID_PENALTY;
  });
  return out;
}

/* Applica le penalty alla griglia ordinata (posizione 0-based) */
function applyGridPenalties(grid) {
  const penalties = computeGridPenalties();
  if (Object.keys(penalties).length === 0) return grid;

  let result = [...grid];

  /* v33 fix #7: le penalità sono applicate in modo coerente.
     Ogni pilota penalizzato viene valutato sulla propria posizione
     ORIGINALE (non su quella shiftata dai piloti già spostati),
     poi i penalizzati sono reinseriti dalla severità maggiore alla minore. */
  const penalized = Object.entries(penalties)
    .filter(([id]) => result.includes(id))
    .map(([id, p]) => ({ id, p, origIdx: grid.indexOf(id) }))
    .sort((a, b) => b.p - a.p || a.origIdx - b.origIdx);

  for (const { id, p, origIdx } of penalized) {
    const curIdx = result.indexOf(id);
    if (curIdx < 0) continue;

    // Rimuovi temporaneamente il pilota
    result.splice(curIdx, 1);

    // Target calcolato dall'indice ORIGINALE + penalità (clampato in fondo)
    const targetIdx = Math.min(result.length, origIdx + p);
    result.splice(targetIdx, 0, id);
  }

  return result;
}
function buildRaceLive() {

    const d = driverById(id);
    const car = teamById(d.teamId).car;
    const stratId = d.isPlayer
      ? (S.playerStrategy || pickRandomStrategy(w.name))
      : pickAIStrategy(w.name, circuit.type);
    const stintCompounds = STRATEGY_TO_COMPOUNDS[stratId] || ['medium', 'medium', null];
    const compound = stintCompounds[0];
    const strat = compoundEffect(compound, w.name);
    const pace = car * SIM_TUNING.raceCarWeight + d.ovr * SIM_TUNING.raceOvrWeight;

    const tEffect = asphaltTempEffect(stratId, S.asphaltTemp);

    let base = pace - gridPos * SIM_TUNING.raceGridPenalty + tEffect.paceMod
             + traitBonus(d.trait, 'race', w.name, circuit.type) + (ROLE_PACE[d.role] || 0);
    if (d.isPlayer) {
      base += (S.setupBonus || 0) + diff().paceBonus;
      base += aeroPaceMod(S.setupId, circuit.type);
      if (S.quali && S.quali.savedTyres) base += 1.8;
      const expectedPace = TITLE_THRESHOLD_PER_RACE * S.round;
      if (S.player.pts > expectedPace * SIM_TUNING.snowballThreshold + 5) {
        const penalty = Math.min(SIM_TUNING.snowballMax, (S.player.pts - expectedPace) * SIM_TUNING.snowballSlope);
        base -= penalty;
        S._snowballActive = round1(penalty);
      }
    } else {
      base += rnd(-SIM_TUNING.raceAiFlavorNoise, SIM_TUNING.raceAiFlavorNoise);
    }
    if (d.isPlayer) {
      const usedSofts = !!(S.quali && S.quali.status !== 'retired' && !S.quali.savedTyres);
      if (usedSofts && (stratId === '1stop_soft_hard' || stratId === '2stop_soft_med_soft')) {
        base -= 0.5;
      }
    }

    const ambient = Number.isFinite(S.asphaltTemp) ? S.asphaltTemp : REF_ASPHALT_TEMP;
    return {
      id, teamId: d.teamId, base, pace, chaosScale: strat.chaosScale,
      sc: 0, wear: 0, dnf: false, dnfStint: null, grid: gridPos + 1, strat: stratId,
      stintCompounds,                                    // ← v33
      tempWearMult: tEffect.wearMult,
      tempTyre: clamp(Math.round(ambient * TYRE_TEMP_START_FACTOR + rnd(-3, 3)), TYRE_TEMP_MIN, TYRE_TEMP_MAX),
      fuelKg: FUEL_START_KG,
      danno: 0

  // v33: forecast meteo — pre-rolliamo quali stint potrebbero cambiare
  const weatherForecast = [];
  let currentWeather = w.name;
  for (let i = 0; i < getRaceStints().length; i++) {
    const change = WEATHER_CHANGE_CHANCE[currentWeather];
    const willChange = change && rng() < change.p;
    weatherForecast.push({
      stint: i, willChange, from: currentWeather,
      to: willChange ? change.to : currentWeather
    });
    if (willChange) currentWeather = change.to;
  }

   return {
    stint: 0, rows,
    sc: { happened: false, stint: null, resolved: true },
    pending: 'pace', log: generateRadioPreRace(),
    ordersDone: false, ordersMateId: null,

    lastWeatherChangeStint: -1 // v33

/* v34 fix: evaluatePitMove basata su simulazione del gap.
   Niente più RNG mascherato da tattica: il bonus riflette
   il differenziale di passo atteso tra me e il rivale davanti,
   moltiplicato per i giri rimanenti nello stint, meno il costo
   del pit (crew bias incluso), più un contributo di posizione. */
function evaluatePitMove(L, choice) {
  const me = L.rows.find(r => r.id === 'PLAYER');
  if (!me || me.dnf) return { bonus: 0, reason: 'no_player' };

  const order = liveStandings(L);
  const myIdx = order.findIndex(r => r.id === 'PLAYER');
  const ahead = myIdx > 0 ? order[myIdx - 1] : null;
  if (!ahead) return { bonus: 0, reason: 'leader' };

  const circuit = CALENDAR[S.round];
  const team = teamById(S.player.teamId);
  const st = getRaceStints()[L.stint];
  const lapsRemaining = Math.max(1, st.lapTo - st.lapFrom + 1);

  /* Gap attuale in secondi (positivo se il rivale è davanti) */
  const gapSec = (ahead.sc - me.sc) * SIM_TUNING.gapFactor;

  /* Pit loss del mio team in sc (con crew bias) */
  /* Pit loss stimato in modo deterministico (stesso valore mostrato = applicato) */
  const pitRange = (circuit && Array.isArray(circuit.pitLoss))
    ? circuit.pitLoss : [PIT_TIME_LOSS_MIN, PIT_TIME_LOSS_MAX];
  const pitLossMid  = (pitRange[0] + pitRange[1]) / 2;
  const biasBase    = (team && Number.isFinite(team.pitCrewBias)) ? team.pitCrewBias : 0;
  const biasDelta   = team ? facilityPitBiasDelta(team) : 0;
  const myPitSc     = (pitLossMid + biasBase + biasDelta) / SIM_TUNING.gapFactor;

  /* Differenza di wear: quanto il rivale è più consumato di me */
  const wearDelta = ahead.wear - me.wear;

  /* Costante di calibrazione: 1 unità di wear ≈ 0.06 sc/gap di svantaggio */
  const WEAR_DELTA_SLOPE = 0.06;
  /* Fattore di "orizzonte": dopo N giri il vantaggio gomme si esaurisce */
  const horizon = Math.min(lapsRemaining, 12);

if (choice === 'pit') {
    const wearAdvantage = Math.max(0, wearDelta) * WEAR_DELTA_SLOPE * horizon * 0.7;

    // ✔️ usa myPitSc (destrutturata sopra) e chiama la variabile pitCostSc
    const pitCostSc = myPitSc * 0.40;

    const positionBonus = -gapSec * 0.20;

    const bonus = round1(wearAdvantage - pitCostSc + positionBonus);

    /* Diagnostica */
    let reason = 'undercut';
    if (wearDelta <= 0) reason = 'undercut_no_wear_advantage';
    else if (gapSec < -8) reason = 'undercut_unsafe_gap';

    return { bonus, reason };
  } else {
    /* OVERCUT: resto fuori e allungo.
       - Guardo se il rivale pitterà presto (se ha wear alto, sì)
       - Non pago il pit adesso
       - Ma accumulo wear, che diventa penalità nei giri finali */
    const rivalWillPitSoon = ahead.wear > 55;
    const rivalPitGainSc = rivalWillPitSoon ? myPitSc * 0.30 : 0;

    /* Gap attuale: se il rivale è davanti di Xs, è a mio favore che lui pitti */
    const positionBonus = gapSec > 0 ? gapSec * 0.25 : 0;

    /* Costo del mio wear accumulato */
    const myWearRisk = Math.max(0, me.wear - 40) * 0.15 * Math.min(lapsRemaining, 10);

    const bonus = round1(rivalPitGainSc + positionBonus - myWearRisk);

    let reason = 'overcut';
    if (!rivalWillPitSoon) reason = 'overcut_rival_wont_pit';
    else if (me.wear > 75) reason = 'overcut_tyres_gone';

    return { bonus, reason };
  }
}
/* v27: reazione AI al pit del giocatore.
   - Se il player pita → i rivali davanti possono coprire (pit immediato)
   - Se il player resta fuori → i rivali dietro possono attaccare (pit per undercuttarlo) */
function simulateAIRaceReaction(L, playerChoice) {
  const me = L.rows.find(r => r.id === 'PLAYER');
  if (!me || me.dnf) return { covering: [], attacking: [] };

  const order = liveStandings(L);
  const myIdx = order.findIndex(r => r.id === 'PLAYER');
  if (myIdx < 0) return { covering: [], attacking: [] };

  const covering = [];
  const attacking = [];

  const circuit = CALENDAR[S.round];
const pitRange = (circuit && Array.isArray(circuit.pitLoss))
  ? circuit.pitLoss : [PIT_TIME_LOSS_MIN, PIT_TIME_LOSS_MAX];
const pitLossMid = (pitRange[0] + pitRange[1]) / 2;

  /* Pit loss alto (>24s) → AI meno propensa a reagire */
  const pitLossResistance = clamp(1 - (pitLossMid - 22) * 0.08, 0.6, 1.2);

  /* Distanza massima di reazione in secondi */
  const MAX_REACTION_GAP = 6.0;

  if (playerChoice === 'pit') {
    /* Undercut del player: i rivali DAVANTI possono coprire */
    for (let i = Math.max(0, myIdx - 3); i < myIdx; i++) {
      const rival = order[i];
      if (rival.dnf) continue;
          const d = driverById(rival.id);
           const team = teamById(rival.teamId || d.teamId);
      if (!team) continue;
      const aggression = AI_AGGRESSION[team.id] ?? 0.5;
      const gapSec = Math.abs(rival.sc - me.sc) * SIM_TUNING.gapFactor;
      if (gapSec > MAX_REACTION_GAP) continue;

      /* Wear del rivale: se ha gomme finite, coprire è quasi obbligatorio */
      const wearPressure = rival.wear / 100;
      let coverProb = aggression * (0.30 + wearPressure * 0.70) * pitLossResistance;
      coverProb *= (1 - gapSec / 8);   /* più lontano → meno probabilità */

      if (rng() < coverProb) {
        /* Il rivale copre: pit immediato */
       const { sc: pitLossSc } = computePitLossSc(team, circuit, {});
rival.sc -= pitLossSc;
        rival.wear = Math.max(0, rival.wear * PIT_WEAR_RESET);
        rival.pitStops = (rival.pitStops || 0) + 1;
        covering.push({ id: rival.id, name: d.name, teamName: team.name });
      }
    }
  } else {
    /* Overcut del player: i rivali DIETRO possono attaccare */
    for (let i = myIdx + 1; i <= Math.min(order.length - 1, myIdx + 3); i++) {
      const rival = order[i];
      if (rival.dnf) continue;
           const d = driverById(rival.id);
      const team = teamById(rival.teamId || d.teamId);
      if (!team) continue;
      const aggression = AI_AGGRESSION[team.id] ?? 0.5;
      const gapSec = Math.abs(rival.sc - me.sc) * SIM_TUNING.gapFactor;
      if (gapSec > MAX_REACTION_GAP) continue;

      /* Wear del player: se ha gomme finite, attaccare è conveniente */
      const playerWearPressure = me.wear / 100;
      let attackProb = aggression * (0.20 + playerWearPressure * 0.80) * pitLossResistance;
      attackProb *= (1 - gapSec / 8);

      if (rng() < attackProb) {
       const { sc: pitLossSc } = computePitLossSc(team, circuit, {});
rival.sc -= pitLossSc;
        rival.wear = Math.max(0, rival.wear * PIT_WEAR_RESET);
        rival.pitStops = (rival.pitStops || 0) + 1;
        attacking.push({ id: rival.id, name: d.name, teamName: team.name });
      }
    }
  }

  return { covering, attacking };
}
/* v24: numero di pit stop previsti per strategia */
function strategyPitCount(stratId) {
  if (stratId === '2stop_soft_med_soft') return 2;
  return 1;   /* 1-stop, inter, wet: tutti 1 pit */
}

/* v24: pit stop temporizzato a fine stint.
   stintDoneIdx = indice dello stint appena completato (0,1,2).
   - Dopo stint 1 (idx 0): tutti fanno pit
   - Dopo stint 2 (idx 1): solo i 2-stop fanno pit
   - Dopo stint 3 (idx 2): nessun pit (fine gara) */
function applyPitStop(L, stintDoneIdx) {
  if (stintDoneIdx >= getRaceStints().length - 1) return;

  const circuit = CALENDAR[S.round];

  // v32: tracciamo quali team hanno già pitato in questo stint
  const pittedThisStint = new Set();

  // Ordiniamo per sc decrescente: chi è davanti pita per primo,
  // il compagno dietro "trova la corsia occupata" → doppio stack
  const pitOrder = L.rows.filter(r => !r.dnf).sort((a, b) => b.sc - a.sc);

    pitOrder.forEach(r => {
    const d = driverById(r.id);
    const pitCount = strategyPitCount(r.strat);
    const needsPit = (stintDoneIdx === 0) || (stintDoneIdx === 1 && pitCount === 2);
    if (!needsPit) return;
    /* v33 fix #2: se ha già pitato sotto SC in questo stint, salta il pit programmato */
    if (r.scPitStint === stintDoneIdx) return;

    const team = teamById(d.teamId);
    const isDoubleStack = pittedThisStint.has(d.teamId);

    // v32: traffico in uscita — se sei dietro a chi ha già pitato e non è il tuo compagno
    const trafficAhead = isDoubleStack || (
      r.grid > 5 && rng() < 0.20 + Math.max(0, r.wear - 60) * 0.01
    );

    const { sc: pitLossSc, sec: pitLossSec, breakdown, fumbled } =
      computePitLossSc(team, circuit, { isDoubleStack, trafficAhead });

    r.sc -= pitLossSc;
    r.pitStops = (r.pitStops || 0) + 1;
    r.wear = Math.max(0, r.wear * PIT_WEAR_RESET);
    r.lastPitBreakdown = breakdown;

    // v31: reset termico gomme
    const ambientPit = Number.isFinite(S.asphaltTemp) ? S.asphaltTemp : REF_ASPHALT_TEMP;
    r.tempTyre = clamp(
      Math.round(r.tempTyre * 0.55 + ambientPit * TYRE_TEMP_START_FACTOR * 0.45),
      TYRE_TEMP_MIN, TYRE_TEMP_MAX
    );

    pittedThisStint.add(d.teamId);

    // v32: radio al giocatore con breakdown contestuale
       if (d.isPlayer) {
      const lap = getRaceStints()[stintDoneIdx].lapTo;
      let text, type;
      if (breakdown.fumble > 0)          { text = t('rrace.pit_fumble',       { s: pitLossSec.toFixed(1) }); type = 'bad';  }
      else if (breakdown.stack > 1.0)    { text = t('rrace.pit_double_stack', { s: pitLossSec.toFixed(1) }); type = 'warn'; }
      else if (breakdown.traffic > 1.5)  { text = t('rrace.pit_traffic',      { s: pitLossSec.toFixed(1) }); type = 'warn'; }
      else if (breakdown.stop > 3.2)     { text = t('rrace.pit_slow',         { s: pitLossSec.toFixed(1) }); type = 'warn'; }
      else if (breakdown.stop < 2.2)     { text = t('rrace.pit_fast',         { s: pitLossSec.toFixed(1) }); type = 'good'; }
      else                               { text = t('rrace.pit_stop',         { s: pitLossSec.toFixed(1) }); type = 'info'; }
      L.log.push({ lap, type, text });
    }
  });
}
/* v32: pit loss a 4 fasi — entry + stop + exit + traffico/stack.
   Mantiene il target totale nel range `circuit.pitLoss` (retrocompatibile),
   ma traccia il breakdown per radio e per test. */
/* v32: pit loss a 4 fasi — entry + stop + exit + traffico/stack.
   Mantiene il target totale nel range `circuit.pitLoss` (retrocompatibile),
   ma traccia il breakdown per radio e per test.
   v33 fix #4: bias e sigma della crew sono ripartiti proporzionalmente
   su entry / stop / exit, così due team con crew diverse mostrano
   differenze reali di ~1-2s sul pit loss totale (prima erano compresse). */
function computePitLossSc(team, circuit, context = {}) {
  const { isDoubleStack = false, trafficAhead = false } = context;

  const range = (circuit && Array.isArray(circuit.pitLoss))
    ? circuit.pitLoss
    : [PIT_TIME_LOSS_MIN, PIT_TIME_LOSS_MAX];
  const target = rnd(range[0], range[1]);

  const weights = (circuit && CIRCUIT_PIT_WEIGHTS[circuit.gp])
    || { wEntry: PIT_ENTRY_WEIGHT_DEFAULT, wBase: PIT_BASE_WEIGHT_DEFAULT, wExit: PIT_EXIT_WEIGHT_DEFAULT };
  const wSum = (weights.wEntry + weights.wBase + weights.wExit) || 1;

  const biasBase  = (team && Number.isFinite(team.pitCrewBias)) ? team.pitCrewBias : 0;
  const biasDelta = team ? facilityPitBiasDelta(team) : 0;                 // v32
  const bias      = biasBase + biasDelta;
  const sigma     = (team && Number.isFinite(team.pitCrewSigma)) ? team.pitCrewSigma : 0.35;
  const crewDelta = bias + rnd(-sigma, sigma);

  const entry = Math.max(0.5, target * weights.wEntry * rnd(0.92, 1.08) + crewDelta * (weights.wEntry / wSum));
  const exit  = Math.max(0.5, target * weights.wExit  * rnd(0.92, 1.08) + crewDelta * (weights.wExit  / wSum));
  const stop  = Math.max(1.8, target * weights.wBase                       + crewDelta * (weights.wBase  / wSum));

    const fumbleChance = team ? facilityFumbleChance(team) : PIT_FUMBLE_CHANCE;   // v32
  const fumbled = rng() < fumbleChance;
  const fumblePenalty = fumbled ? rnd(PIT_FUMBLE_MIN, PIT_FUMBLE_MAX) : 0;

  const traffic = trafficAhead ? rnd(0.5, PIT_TRAFFIC_MAX) : 0;
  const stack   = isDoubleStack ? rnd(PIT_DOUBLE_STACK_MIN, PIT_DOUBLE_STACK_MAX) : 0;

  const sec = entry + stop + exit + traffic + stack + fumblePenalty;

  return {
    sc: sec / SIM_TUNING.gapFactor,
    sec,
    fumbled,
    breakdown: { entry, stop, exit, traffic, stack, fumble: fumblePenalty }
  };
}

/* v28: rating leggibile per UI */
function pitCrewRating(team) {
 if (!team) return { label: '—', cls: 'text-slate-400' };
  const b = (team.pitCrewBias || 0) + facilityPitBiasDelta(team);
  if (b <= -0.5) return { label: t('pitcrew.elite'),  cls: 'text-gold' };
  if (b <= -0.2) return { label: t('pitcrew.fast'),   cls: 'text-emerald-400' };
  if (b <=  0.2) return { label: t('pitcrew.avg'),    cls: 'text-slate-300' };
  if (b <=  0.5) return { label: t('pitcrew.slow'),   cls: 'text-gold' };
  return                { label: t('pitcrew.terrible'), cls: 'text-racing' };
}
function runStint(L, idx, playerMode, halfIndex) {
  const st = getRaceStints()[idx];
  const w = S.weather;

  let weight = st.weight;
  if (halfIndex === 0) weight = st.weight * STINT_SPLIT;
  else if (halfIndex === 1) weight = st.weight * (1 - STINT_SPLIT);

  const amp = SIM_TUNING.raceNoise * Math.sqrt(weight);

  L.rows.forEach(r => {
    if (r.dnf) return;
    const d = driverById(r.id);
   const mode = PACE_MODES[d.isPlayer ? playerMode : aiPaceMode()] || PACE_MODES.normal;
const compound = (r.stintCompounds && r.stintCompounds[idx]) || 'medium';
const cEff = compoundEffect(compound, w.name);

             /* v31: aggiorna temperatura gomma e calcola i modificatori termici */
    const ambientStint = Number.isFinite(S.asphaltTemp) ? S.asphaltTemp : REF_ASPHALT_TEMP;
    updateTyreTemp(r, mode.id || 'normal', ambientStint);
    const tTempEff = tyreTempEffect(r.tempTyre);

    /* v31 Step 2: consumo carburante e bonus peso */
    const fuelUsedPerStint = FUEL_START_KG * (st.weight * (halfIndex === 0 ? STINT_SPLIT : 1 - STINT_SPLIT));
    r.fuelKg = Math.max(0, r.fuelKg - fuelUsedPerStint);
    const fuelBonus = r.fuelKg * FUEL_PACE_PER_KG;

  let inc = r.base * weight + mode.bonus + cEff.paceBonus + tTempEff.paceMod + fuelBonus;
let wearDelta = mode.wear * wearMultFor(d) * cEff.wearMult * (r.tempWearMult || 1) * tTempEff.wearMult;
    if (r.wear >= WEAR_CLIFF_START) wearDelta *= WEAR_CLIFF_MULT;

    if (halfIndex === 0) wearDelta *= STINT_SPLIT;
    else if (halfIndex === 1) wearDelta *= (1 - STINT_SPLIT);

    r.wear = clamp(r.wear + wearDelta, 0, 100);
    if (r.wear > WEAR_PENALTY_START) inc -= (r.wear - WEAR_PENALTY_START) * WEAR_PENALTY_SLOPE;

    let roll = rnd(-amp, amp);
    if (d.isPlayer) {
      const negScale = clamp(1 - (d.consistency - 50) * SIM_TUNING.raceNegScaleConsistency,
                             SIM_TUNING.raceNegScaleMin, SIM_TUNING.raceNegScaleMax);
      if (roll < 0) roll *= negScale;
    }
    inc += roll * w.chaos * r.chaosScale;
    r.sc += inc;

     /* v31 Step 4: accumula danno e calcola DNF in base al danno cumulato */
      /* v31 Step 4: accumula danno e calcola DNF in base al danno cumulato */
  const carNow  = teamById(r.teamId).car;
const teamRow = teamById(r.teamId);
const dmg = computeDamagePerTick(r, mode.id, carNow, st.weight, halfIndex, teamRow);
    r.danno = clamp(r.danno + dmg, 0, 100);

    /* v34 fix: il danno ora rallenta la macchina oltre a innalzare il rischio DNF.
       A danno 100 = ~3 sc di penalità = ~1.65s al giro. Non elimina il pilota,
       ma gli fa "sentire" il problema prima del ritiro. */
    inc -= r.danno * DAMAGE_PACE_SLOPE;

    /* Radio: avvisa il player quando il danno supera le soglie */
    if (d.isPlayer && !r.warnedDmg75 && r.danno > 75) {
      r.warnedDmg75 = true;
      L.log.push({ lap: st.lapTo, type: 'bad', text: t('rrace.dmg_critical') });
    } else if (d.isPlayer && !r.warnedDmg55 && r.danno > 55) {
      r.warnedDmg55 = true;
      L.log.push({ lap: st.lapTo, type: 'warn', text: t('rrace.dmg_warn') });
    }

    const dnfPerTick = damageDnfPerTick(r.danno);
    let risk = dnfPerTick * weight * w.chaos + (d.isPlayer ? mode.risk : 0);
    if (d.isPlayer) risk *= diff().dnfMult;
    if (rng() < Math.max(0, risk)) { r.dnf = true; r.dnfStint = idx; }
  });

  const last = getRaceStints().length - 1;
  const newDnf = L.rows.some(r => r.dnf && r.dnfStint === idx);
  if (newDnf && !L.sc.happened && rng() < SIM_TUNING.scProbability) {
    L.sc = { happened: true, stint: idx, resolved: idx === last };
    applySafetyCarToField(L);

    /* v29 Step 6: gli AI reagiscono subito, anche se la SC è già risolta
       (ultimo stint) così la classifica finale resta coerente. */
    const reaction = simulateAISCReaction(L);
    L.sc.aiReaction = reaction;

    /* Feedback radio al player */
    const me = L.rows.find(r => r.id === 'PLAYER');
       if (me && !me.dnf && reaction.pitting.length > 0) {
      L.log.push({
        lap: getRaceStints()[idx].lapTo,
        type: 'warn',
        text: t('rrace.sc_ai_reaction', { n: reaction.pitting.length })
      });
    }
  }
}

/* v29 Step 6: applica solo il compaction del gruppo.
   La reazione tattica degli AI è delegata a simulateAISCReaction(). */
function applySafetyCarToField(L) {
  const alive = L.rows.filter(r => !r.dnf);
  if (alive.length < 2) return;
  const vals = alive.map(r => r.sc);
  const maxSc = Math.max(...vals), minSc = Math.min(...vals);
  const range = maxSc - minSc || 1;
  alive.forEach(r => {
    r.sc = minSc + ((r.sc - minSc) / range) * range * SIM_TUNING.scLiveCompaction
         + rnd(-SIM_TUNING.scNoise, SIM_TUNING.scNoise);
  });
}
/* v29 Step 6: reazione AI alla Safety Car.
   Chiamata da runStint() quando la SC scatta (dopo il compaction del gruppo).
   Decide chi tra gli AI pita in regime di SC in base a:
   - aggressione del team (Step 5)
   - wear attuale (chi ha gomme finite approfitta)
   - pitStops già fatti vs pitCount della strategia
   Ritorna { pitting: [ids], staying: [ids] } per feedback UI e radio. */
function simulateAISCReaction(L) {
  const result = { pitting: [], staying: [] };
  const circuit = CALENDAR[S.round];

  L.rows.forEach(r => {
    if (r.id === 'PLAYER' || r.dnf) return;

   const d = driverById(r.id);
const team = teamById(r.teamId || d.teamId);
    if (!team) return;

    const aggression = AI_AGGRESSION[team.id] ?? 0.5;

    /* Probabilità base: 0.175 (Cadillac) → 0.425 (Ferrari/Mercedes) */
    let pPit = aggression * 0.5;

    /* Wear: chi ha gomme finite approfitta della SC, chi è fresco no */
    if (r.wear > 60) pPit += 0.30;
    if (r.wear > 75) pPit += 0.20;
    if (r.wear < 25) pPit -= 0.40;

    /* Stato strategia: chi ha già completato i pit previsti resta fuori */
    const pitCount  = strategyPitCount(r.strat);
    const stopsDone = r.pitStops || 0;
    if (stopsDone >= pitCount)     pPit -= 0.60;
    if (stopsDone === 0 && pitCount === 2) pPit += 0.15;   // 2-stop: prima sosta

    pPit = clamp(pPit, 0.05, 0.95);

      if (rng() < pPit) {
      /* Pit sotto SC: gomme fresche, piccolo costo di posizione */
      r.wear = Math.max(0, r.wear - SC_PIT_WEAR_RELIEF);
      r.sc -= SC_PIT_COST;
      r.pitStops = stopsDone + 1;
      r.scPitStint = L.stint;   /* v33 fix #2: segna lo stint in cui è avvenuto il pit SC */
      result.pitting.push(r.id);
    } else {
      /* Resta fuori: guadagno di posizione */
      r.sc += SC_STAY_BONUS;
      result.staying.push(r.id);
    }
  });

  return result;
}

function liveRadioAfterStint(L, idx) {
  const st = getRaceStints()[idx];
  const me = L.rows.find(r => r.id === 'PLAYER');
  if (me.dnf) return;
  if (me.wear > WEAR_PENALTY_START)
    L.log.push({ lap: st.lapTo, type: 'bad',  text: t('rrace.wear_critical') });
  else if (me.wear > 35)
    L.log.push({ lap: st.lapTo, type: 'warn', text: t('rrace.wear_warn') });
}
function stepStint(L, modeId) {
  /* v25: simula il primo half dello stint corrente */
  L.currentPaceMode = modeId || 'normal';
  runStint(L, L.stint, modeId, 0);
  liveRadioAfterStint(L, L.stint);
  const me = L.rows.find(r => r.id === 'PLAYER');

  /* v33 fix #3: SC ha priorità sulla pit window — chiediamo subito al giocatore */
  if (L.sc.happened && !L.sc.resolved) {
    L.pending = 'sc';
    return;
  }

  /* Controlla se è il momento di aprire la finestra pit */
  if (shouldOpenPitWindow(L)) {
    L.pending = 'pit';
    return;
  }

  /* Altrimenti chiudiamo lo stint completo: simula il secondo half, poi pit automatico */
  runStint(L, L.stint, modeId, 1);
  applyPitStop(L, L.stint);
  L.stint++;
  afterStintAdvance(L);
}

/* v25: determiniamo se mostrare la finestra pit al giocatore */
function shouldOpenPitWindow(L) {
  if (L.stint >= getRaceStints().length - 1) return false;   /* ultimo stint: niente pit */
  const st = getRaceStints()[L.stint];
  if (!st.pitWindow) return false;
  return true;
}
/* v22 (fix v33): decide se il box emette un ordine di scuderia.
   Ritorna true e popola L.ordersMateId se il compagno (Prima Guida)
   è dietro di te ed entro ~1.65s. Massimo una volta per gara
   (controllato da L.ordersDone). */
function maybeTeamOrders(L) {
  if (!L || L.ordersDone) return false;
  const me = L.rows.find(r => r.id === 'PLAYER');
  if (!me || me.dnf) return false;

  const p = S.player;
  const mate = teammate();
  if (!mate) return false;

  /* Ordini solo se il compagno è Prima Guida e tu non lo sei */
  if (mate.role !== ROLE_FIRST) return false;
  if (p.role === ROLE_FIRST) return false;

  const mateRow = L.rows.find(r => r.id === mate.id);
  if (!mateRow || mateRow.dnf) return false;

  const order = liveStandings(L);
  const myIdx   = order.findIndex(r => r.id === 'PLAYER');
  const mateIdx = order.findIndex(r => r.id === mate.id);
  if (myIdx < 0 || mateIdx < 0) return false;

  /* Il player deve essere davanti al compagno */
  if (myIdx >= mateIdx) return false;

  /* Il compagno deve essere vicino: entro 3.0 sc (≈1.65s con gapFactor 0.55) */
  const gap = Math.abs(order[mateIdx].sc - order[myIdx].sc);
  if (gap > 3.0) return false;

  /* Probabilità cresce con la tensione col compagno */
  const pTrigger = clamp(0.35 + (S.mateTension / 100) * 0.30, 0.35, 0.65);
  if (rng() > pTrigger) return false;

  L.ordersMateId = mate.id;
  L.ordersDone = true;
  return true;
}

/* v25: dopo la chiusura di uno stint, decidiamo il prossimo pending */
function afterStintAdvance(L) {
  const me = L.rows.find(r => r.id === 'PLAYER');
  if (L.stint >= getRaceStints().length) { L.pending = null; return; }
  if (me.dnf)                          { L.pending = 'auto'; return; }

  // v33: cambio meteo tra stinti?
  const forecast = L.weatherForecast && L.weatherForecast[L.stint];
  if (forecast && forecast.willChange && forecast.stint !== L.lastWeatherChangeStint) {
    L.pending = 'weather';
    return;
  }

  if (L.sc.happened && !L.sc.resolved) { L.pending = 'sc'; return; }
  L.pending = maybeTeamOrders(L) ? 'orders' : 'pace';
}
/* v33: applica il cambio meteo e aggiorna i compound di conseguenza.
   choice: 'adapt' (pit per compound giusto) o 'stay' (continua con compound attuale) */
/* v34 fix: cambio meteo differenziato per team.
   - Il player decide tramite `choice` ('adapt' | 'stay').
   - Gli AI decidono tramite un modello probabilistico che combina:
     aggressione del team, mescola attuale, wear, giri rimanenti nello stint.
   Il compound di ogni pilota viene aggiornato solo se pitta. */
function applyWeatherChange(L, choice) {
  const forecast = L.weatherForecast[L.stint];
  if (!forecast || !forecast.willChange) return;

  const newWeatherName = forecast.to;
  S.weather = { ...WEATHER_DEFS[newWeatherName] };
  L.lastWeatherChangeStint = L.stint;

  const circuit = CALENDAR[S.round];
  const st = getRaceStints()[L.stint];
  const lapsRemaining = Math.max(1, st.lapTo - st.lapFrom + 1);

  const lap = st.lapFrom;
  L.log.push({
    lap: lap - 1, type: 'warn',
    text: newWeatherName === 'Pioggia'
      ? t('rrace.weather_rain_start')
      : t('rrace.weather_rain_stop')
  });

  /* Il compound "ideale" per il nuovo meteo */
  const targetCompound = newWeatherName === 'Pioggia' ? 'wet'
                      : newWeatherName === 'Variabile' ? 'inter'
                      : 'medium';

  L.rows.forEach(r => {
    if (r.dnf) return;
    const d = driverById(r.id);

    /* === Player: obbedisce alla scelta dell'utente === */
    if (d.isPlayer) {
      if (choice === 'adapt') {
        const team = teamById(S.player.teamId);
        const { sc: pitLossSc } = computePitLossSc(team, circuit, {});
        r.sc -= pitLossSc + WEATHER_PIT_COST;
        r.wear = Math.max(0, r.wear * PIT_WEAR_RESET);
        r.pitStops = (r.pitStops || 0) + 1;
        r.stintCompounds[L.stint] = targetCompound;

        const ambientPit = Number.isFinite(S.asphaltTemp) ? S.asphaltTemp : REF_ASPHALT_TEMP;
        const newAmbient = newWeatherName === 'Pioggia' ? Math.max(10, ambientPit - 8) : ambientPit;
        r.tempTyre = clamp(
          Math.round(r.tempTyre * 0.55 + newAmbient * TYRE_TEMP_START_FACTOR * 0.45),
          TYRE_TEMP_MIN, TYRE_TEMP_MAX
        );

        L.log.push({ lap, type: 'info', text: t('rrace.weather_pit_adapt') });
      } else {
        L.log.push({ lap, type: 'warn', text: t('rrace.weather_stay_out') });
      }
      return;
    }

    /* === AI: decisione probabilistica === */
    const team = teamById(r.teamId);
    const aggression = AI_AGGRESSION[team.id] ?? 0.5;

    /* Mescola attuale dell'AI in questo stint */
    const currentCompound = (r.stintCompounds && r.stintCompounds[L.stint]) || 'medium';

    /* Se è già sul compound corretto → non pitta quasi mai */
    if (currentCompound === targetCompound) {
      if (rng() < 0.10) { /* raro pit di scrupolo */ }
      else return;        /* resta fuori */
    }

    /* Probabilità base: aggressione del team × urgenza della mescola */
    let pPit = aggression * 0.75;

    /* Se ha gomme finite, pitare è più probabile (deve comunque rientrare) */
    if (r.wear > 60) pPit += 0.20;
    if (r.wear > 80) pPit += 0.15;

    /* Se restano pochi giri, tende a stare fuori ("tanto vale finire") */
    if (lapsRemaining <= 4) pPit -= 0.40;
    else if (lapsRemaining <= 8) pPit -= 0.15;

    /* Meteo estremo (pioggia battente) → più disciplina, tutti rientrano */
    if (newWeatherName === 'Pioggia' && currentCompound !== 'wet') pPit += 0.25;

    pPit = clamp(pPit, 0.05, 0.95);

    if (rng() < pPit) {
      const { sc: pitLossSc } = computePitLossSc(team, circuit, {});
      r.sc -= pitLossSc + WEATHER_PIT_COST;
      r.wear = Math.max(0, r.wear * PIT_WEAR_RESET);
      r.pitStops = (r.pitStops || 0) + 1;
	    r.scPitStint = L.stint;
      r.stintCompounds[L.stint] = targetCompound;

      const ambientPit = Number.isFinite(S.asphaltTemp) ? S.asphaltTemp : REF_ASPHALT_TEMP;
      const newAmbient = newWeatherName === 'Pioggia' ? Math.max(10, ambientPit - 8) : ambientPit;
      r.tempTyre = clamp(
        Math.round(r.tempTyre * 0.55 + newAmbient * TYRE_TEMP_START_FACTOR * 0.45),
        TYRE_TEMP_MIN, TYRE_TEMP_MAX
      );
    } else {
      /* Resta fuori: se il meteo peggiora e ha la mescola sbagliata, paga un malus di passo */
      if (newWeatherName === 'Pioggia' && currentCompound !== 'wet') {
        r.sc -= 1.5;   /* sc persi per restare su slick sul bagnato */
      }
    }
  });

  L.pending = 'pace';
}
function resolveLiveSC(L, choice) {
  const me = L.rows.find(r => r.id === 'PLAYER');
  const lap = getRaceStints()[L.sc.stint].lapTo;
  if (choice === 'pit') {
    const team = teamById(S.player.teamId);
    const bias = team && Number.isFinite(team.pitCrewBias) ? team.pitCrewBias : 0;
    const scLoss = Math.max(0.2, SC_PIT_COST + bias * 0.3);
    me.wear = Math.max(0, me.wear - SC_PIT_WEAR_RELIEF);
    me.sc -= scLoss;
    L.log.push({ lap, type: 'info', text: t('rrace.sc_pit_in') });
  } else {
    me.sc += SC_STAY_BONUS;
    L.log.push({ lap, type: 'info', text: t('rrace.sc_stay_in') });
  }
  L.sc.resolved = true;
 
}

function autoRunLive(L) {
  let guard = 0;
  while (L.stint < getRaceStints().length && guard++ < 20) {
    const me = L.rows.find(r => r.id === 'PLAYER');
    if (L.pending === 'weather') {
      applyWeatherChange(L, 'adapt');
      continue;
    }
    if (L.pending === 'sc') {
      resolveLiveSC(L, me.wear > 28 ? 'pit' : 'stay');
      /* v33 fix #3: completa lo stint corrente dopo la SC */
      const modeId = L.currentPaceMode || 'normal';
      if (shouldOpenPitWindow(L)) { L.pending = 'pit'; continue; }
      runStint(L, L.stint, modeId, 1);
      applyPitStop(L, L.stint);
      L.stint++;
      afterStintAdvance(L);
      continue;
    }
    if (L.pending === 'orders') { L.pending = 'pace'; }
    if (L.pending === 'pit') {
      choosePit('stay');
      continue;
    }
    stepStint(L, 'normal');
    if (L.pending === 'auto') continue;
  }
}
function finalizeRace(L) {
  const w = S.weather;
  const safetyCar = L.sc.happened;

  const finish = L.rows.filter(r => !r.dnf).sort((a, b) => b.sc - a.sc);
  const out    = L.rows.filter(r => r.dnf).sort((a, b) => b.dnfStint - a.dnfStint);

  const leaderSc = finish.length ? finish[0].sc : 0;
  finish.forEach((r, i) => { r.gap = i === 0 ? 0 : round3((leaderSc - r.sc) * SIM_TUNING.gapFactor); });
  if (safetyCar && finish.length > 1) {
    const maxGap = finish[finish.length - 1].gap;
    const capTarget = rnd(SIM_TUNING.scGapCapMin, SIM_TUNING.scGapCapMax);
    if (maxGap > capTarget) { const k = capTarget / maxGap; finish.forEach(r => { r.gap = round3(r.gap * k); }); }
  }
  out.forEach(r => { r.gap = null; });
  const order = [...finish, ...out];

  let flId = null, bestV = -Infinity;
  finish.forEach(r => {
    const v = r.pace + rnd(-4, 4) + (100 - r.wear) * 0.03;
    if (v > bestV) { bestV = v; flId = r.id; }
  });

  order.forEach((r, i) => {
    const d = driverById(r.id);
    r.pos = r.dnf ? null : i + 1;
    r.points = (!r.dnf && i < 10) ? POINTS[i] : 0;
    r.fl = r.id === flId;
    if (r.fl && FASTEST_LAP_POINT && r.pos && r.pos <= 10) r.points += 1;
    d.pts += r.points;
    if (r.dnf) d.dnf++;
    if (r.pos === 1) d.wins++;
    if (r.pos && r.pos <= 3) d.podiums++;
    if (r.pos && r.pos <= 10) {
      if (!d.fin || d.fin.length < 10) d.fin = newFin();
      d.fin[r.pos - 1]++;
    }
    if (r.fl) d.fl = (d.fl || 0) + 1;
  });

  S.lastRace = order.map(r => ({
    id: r.id, dnf: r.dnf, grid: r.grid, strat: r.strat,
    gap: r.gap, pos: r.pos, points: r.points, fl: r.fl
  }));
  S.lastSafetyCar = safetyCar;
  const flRow = S.lastRace.find(r => r.fl);
  S.lastFastestLap = flRow ? { id: flRow.id, awarded: !!(FASTEST_LAP_POINT && flRow.pos && flRow.pos <= 10) } : null;

  const me = S.lastRace.find(r => r.id === 'PLAYER');
  const race = CALENDAR[S.round];
  const rival = rivalDriver();
  S.seasonLog.push({
    gp: race.gp, flag: race.flag, grid: me.grid, pos: me.pos, points: me.points,
    dnf: me.dnf, weather: w.name, sc: safetyCar, strat: me.strat, fl: !!me.fl,
    cum: S.player.pts, leader: Math.max(...S.drivers.map(d => d.pts)), rival: rival ? rival.pts : null
  });

  S.totals.races++;
  S.totals.points += me.points;
  if (me.dnf) S.totals.dnf++;
  if (me.pos === 1) S.totals.wins++;
  if (me.pos && me.pos <= 3) S.totals.podiums++;
  if (me.fl) S.totals.fastestLaps = (S.totals.fastestLaps || 0) + 1;
  if (S.telemetry && me.dnf) S.telemetry.dnfCount++;
  recordRaceTelemetry(w.name, safetyCar);

  const cs = circuitStatFor(race.gp);
  cs.races++; cs.points += me.points;
  if (me.dnf) cs.dnf++;
  else {
    cs.finishes++; cs.posSum += me.pos;
    if (cs.bestPos == null || me.pos < cs.bestPos) cs.bestPos = me.pos;
  }
  if (me.pos === 1) cs.wins++;
  if (me.pos && me.pos <= 3) cs.podiums++;

  /* aggiorna rivalità PRIMA di S.round++ */
  updateRivalryAfterRace(S.lastRace);
  updateMateTension(S.lastRace);

  /* radio unificata */
   S.radioLog = [...L.log, ...generateRadioFinal(me, safetyCar)]
    .sort((a, b) => a.lap - b.lap).slice(0, RADIO_LOG_CAP);

  if (S.sponsor && !S.sponsor.completed && S.sponsor.type !== 'title') {
    const qualifies = (S.sponsor.type === 'top10' && me.pos && me.pos <= 10)
                   || (S.sponsor.type === 'podium' && me.pos && me.pos <= 3);
    if (qualifies) {
      S.sponsor.progress++;
      if (S.sponsor.progress >= S.sponsor.target) {
        S.sponsor.completed = true;
        S.budget += S.sponsor.reward;
        S.sponsor.justCompleted = true;
      }
    }
  }

    /* v29 Step 7: consuma PU dopo ogni GP */
  /* v29 Step 7: consuma PU dopo ogni GP */
  advancePUWear(race);

  /* Analytics: gara finita */
  const resultTag = me.dnf ? 'DNF' : 'P' + me.pos;
  window.goatcounter?.count({
    path: 'event/race/' + resultTag,
    title: 'Gara ' + race.gp + ': ' + resultTag,
    event: true
  });

  S.round++;
  S.raceLive = null;
  S.sprintDone = false;
  if (S.round % RD_BLOCK === 0 && S.round < CALENDAR.length) {
    S.rdOpen = true; S.rdDone = 0;
    processAIRDActivity(teamStandings(), true);
  }
}

function simRace() {
  const L = buildRaceLive();
  S.raceLive = L;    /* fix: rendi L visibile a choosePit/chooseLiveSC/ecc. */
  autoRunLive(L);
  finalizeRace(L);   /* finalizeRace imposta S.raceLive = null */
}
function goRace() {

  save(); render();
}

function completeLiveRace(L) {

  if (S.sponsor && S.sponsor.justCompleted) {
  toast(t('toast.sponsor_completed', { n: S.sponsor.reward }), 'good');
    S.sponsor.justCompleted = false; save();

}
/* v25 + v26 + v27: il giocatore entra nella finestra pit, l'AI reagisce */
function choosePit(choice) {
  const L = S.raceLive;
  if (!L || L.pending !== 'pit') return;
  const st = getRaceStints()[L.stint];
  const me = L.rows.find(r => r.id === 'PLAYER');
  const lap = Math.round(st.lapFrom + (st.lapTo - st.lapFrom) * STINT_SPLIT);

  /* v26: valuta il guadagno tattico della scelta */
  let evalResult = evaluatePitMove(L, choice);

  /* v27: reazione AI */
  const aiReact = simulateAIRaceReaction(L, choice);
  const reactorCount = aiReact.covering.length + aiReact.attacking.length;

  /* v27: ogni rivale che reagisce dimezza il bonus del player */
  if (reactorCount > 0) {
    evalResult.bonus = round1(evalResult.bonus * Math.pow(0.5, reactorCount));
  }

  me.sc += evalResult.bonus;

    /* Simula il secondo half, poi pit */
  runStint(L, L.stint, L.currentPaceMode || 'normal', 1);
  applyPitStop(L, L.stint);

  /* Radio: la scelta del giocatore */
  const bonusTxt = Math.abs(evalResult.bonus) >= 0.3
    ? ` (${evalResult.bonus >= 0 ? '+' : ''}${evalResult.bonus} sc)`
    : '';

  if (choice === 'pit') {
    L.log.push({ lap, type: 'info', text: t('rrace.pit_early') + bonusTxt });
    if (evalResult.bonus >= 0.8) {
      L.log.push({ lap, type: 'good', text: t('rrace.undercut_success', { sc: evalResult.bonus }) });
    } else if (evalResult.bonus <= -0.5) {
      L.log.push({ lap, type: 'warn', text: t('rrace.undercut_risky') });
    }
  } else {
    L.log.push({ lap, type: 'info', text: t('rrace.pit_late') + bonusTxt });
    if (evalResult.bonus >= 0.8) {
      L.log.push({ lap, type: 'good', text: t('rrace.overcut_success', { sc: evalResult.bonus }) });
    } else if (evalResult.bonus <= -0.5) {
      L.log.push({ lap, type: 'warn', text: t('rrace.overcut_risky') });
    }
  }

  /* v27: radio delle reazioni AI */
  aiReact.covering.forEach(c => {
    L.log.push({
      lap, type: 'warn',
      text: t('rrace.ai_covering', { name: c.name, team: c.teamName })
    });
  });
  aiReact.attacking.forEach(c => {
    L.log.push({
      lap, type: 'warn',
      text: t('rrace.ai_attacking', { name: c.name, team: c.teamName })
    });
  });

  L.stint++;
  afterStintAdvance(L);
  if (L.stint >= getRaceStints().length) return completeLiveRace(L);
  if (L.pending === 'auto') { autoRunLive(L); return completeLiveRace(L); }
  save(); render();
}
function chooseLivePace(modeId) {
  const L = S.raceLive;
  if (!L || L.pending !== 'pace' || !PACE_MODES[modeId]) return;
  const st = getRaceStints()[L.stint];
  const m = PACE_MODES[modeId];
  L.log.push({
    lap: st.lapFrom, type: 'info',
   text: t('rrace.pace_cmd', {
  icon: m.icon,
  name: t('pace.' + m.id + '.name'),
  mode: st.name
})
  });
  stepStint(L, modeId);
  if (L.stint >= getRaceStints().length) return completeLiveRace(L);
  if (L.pending === 'auto') { autoRunLive(L); return completeLiveRace(L); }
  save(); render();
}
function chooseLiveSC(choice) {
  const L = S.raceLive;
  if (!L || L.pending !== 'sc') return;
  resolveLiveSC(L, choice === 'pit' ? 'pit' : 'stay');

  /* v33 fix #3: dopo la SC completa il secondo half + pit + avanzamento stint */
  const modeId = L.currentPaceMode || 'normal';
  if (shouldOpenPitWindow(L)) {
    L.pending = 'pit';
    save(); render();
    return;
  }
  runStint(L, L.stint, modeId, 1);
  applyPitStop(L, L.stint);
  L.stint++;
  afterStintAdvance(L);
  if (L.stint >= getRaceStints().length) return completeLiveRace(L);
  if (L.pending === 'auto') { autoRunLive(L); return completeLiveRace(L); }
  save(); render();
}
function chooseLiveWeather(choice) {
  const L = S.raceLive;
  if (!L || L.pending !== 'weather') return;
  applyWeatherChange(L, choice === 'adapt' ? 'adapt' : 'stay');
  save(); render();
}
function chooseLiveOrders(choice) {
  const L = S.raceLive;
  if (!L || L.pending !== 'orders') return;
  const me = L.rows.find(r => r.id === 'PLAYER');
  const mate = L.rows.find(r => r.id === L.ordersMateId);
  const lap = getRaceStints()[1].lapTo;
  if (choice === 'obey' && mate) {
    const tmp = me.sc; me.sc = mate.sc; mate.sc = tmp;
    S.mateTension = clamp(S.mateTension - 10, 0, 100);
    S.reputation  = clamp(S.reputation + 1, 0, 100);
    L.log.push({ lap, type: 'warn', text: t('rrace.team_order_obey') });
  } else {
    S.mateTension = clamp(S.mateTension + 15, 0, 100);
    S.reputation  = clamp(S.reputation - 1, 0, 100);
    L.log.push({ lap, type: 'bad', text: t('rrace.team_order_ignore') });
  }
  L.pending = 'pace';
  save(); render();
}
function autoFinishLive() {
  const L = S.raceLive;
  if (!L) return;
  autoRunLive(L);
  completeLiveRace(L);
}

/* ---------- RACE VIEW ---------- */
function viewRace() {
  const r = CALENDAR[S.round - 1];
  const me = S.lastRace.find(x => x.id === 'PLAYER');
  const gained = me.grid - (me.pos || 21);
  const radio = S.radioLog || [];
  const rival = rivalDriver();
  const lastRivalClash = S.rivalryHistory.length ? S.rivalryHistory[S.rivalryHistory.length - 1] : null;

  let posLine = '';
  if (!me.dnf) {
    if (gained > 0) posLine = t('result.pos_gained', { n: gained });
    else if (gained < 0) posLine = t('result.pos_lost', { n: gained });
    else posLine = t('result.pos_same');
    if (me.points) posLine += t('result.points_suffix', { n: me.points });
  }

  return `
  <div class="anim">
    <div class="text-center mb-4">
      <div class="text-[11px] uppercase tracking-[0.3em] text-slate-400">${esc(t('result.title'))}</div>
      <h2 class="text-2xl font-black">${esc(r.flag)} ${esc(r.gp)}</h2>
      <div class="text-sm text-slate-400">${esc(S.weather.icon)} ${esc(S.weather.name)}</div>
      ${S.setupLabel ? `<div class="text-xs text-slate-400 mt-1">Setup: <b class="text-slate-300">${esc(S.setupLabel)}</b> (${S.setupBonus >= 0 ? '+' : ''}${S.setupBonus})</div>` : ''}
   ${S.playerStrategy ? `<div class="text-xs text-slate-400 mt-0.5">${esc(t('result.strategy'))} <b class="text-slate-300">${esc(t('strat.' + S.playerStrategy + '.name'))}</b></div>` : ''}
      ${S.lastSafetyCar ? `<div class="inline-flex items-center gap-1.5 mt-2 px-3 py-1 rounded-full bg-gold/20 text-gold text-xs font-bold">${esc(t('result.safety_car'))}</div>` : ''}
    </div>

    <div class="rounded-2xl p-5 mb-4 text-center neon ${me.dnf ? 'bg-racing/20' : me.pos === 1 ? 'bg-gold/20' : me.pos <= 3 ? 'bg-emerald-600/15' : 'bg-carbon2'}">
      ${me.dnf ? `
        <div class="text-5xl mb-2">💥</div>
        <div class="text-3xl font-black text-racing">${esc(t('result.dnf'))}</div>
        <div class="text-sm text-slate-300 mt-1">${esc(t('result.dnf_desc'))}</div>
      ` : `
        <div class="text-[11px] uppercase tracking-wider text-slate-400">${esc(t('result.final_pos'))}</div>
        <div class="text-6xl font-black ${me.pos === 1 ? 'text-gold' : ''}">P${me.pos}</div>
        <div class="text-sm mt-1 ${gained > 0 ? 'text-emerald-400' : gained < 0 ? 'text-racing' : 'text-slate-400'}">
          ${posLine}
        </div>
     <div class="text-sm mt-1 text-slate-400">${me.pos === 1 ? esc(t('result.winner')) : esc(t('result.gap_leader', { n: (me.gap ?? 0).toFixed(3) }))}</div>
        ${me.pos === 1 ? `<div class="text-gold font-black mt-2 text-lg">${esc(t('result.win_banner'))}</div>` : ''}
      `}
    </div>

    ${rival && lastRivalClash ? `
    <div class="bg-carbon2 rounded-2xl neon-soft overflow-hidden mb-4 border border-slate-700/50">
      <div class="px-4 py-2 bg-gradient-to-r from-racing/20 to-transparent">
        <span class="text-[11px] uppercase tracking-wider text-racing font-bold">${esc(t('result.rival_clash'))}</span>
      </div>
      <div class="p-4 flex items-center gap-3">
        <div class="text-2xl">${esc(rival.nat)}</div>
        <div class="flex-1 min-w-0">
          <div class="font-bold truncate">${esc(rival.name)}</div>
          <div class="text-[11px] text-slate-400">${esc(lastRivalClash.reason)}</div>
        </div>
        <span class="text-2xl font-black ${lastRivalClash.delta > 0 ? 'text-emerald-400' : lastRivalClash.delta < 0 ? 'text-racing' : 'text-slate-400'}">
          ${lastRivalClash.delta > 0 ? '+' : ''}${lastRivalClash.delta}
        </span>
      </div>
    </div>` : ''}

    ${radio.length ? `
    <div class="bg-carbon2 rounded-2xl neon-soft overflow-hidden mb-4">
      <div class="px-4 py-3 border-b border-slate-800 font-black text-xs uppercase tracking-wider flex items-center justify-between">
        <span>${esc(t('result.radio_title'))}</span>
        <span class="text-slate-400 font-normal normal-case">${esc(t('live.messages', { n: radio.length }))}</span>
      </div>
      <div class="divide-y divide-slate-800/60 max-h-[45vh] overflow-y-auto">
        ${radio.map((m, i) => {
          const st = RADIO_STYLES[m.type] || RADIO_STYLES.info;
          return `
          <div class="radio-line flex items-start gap-3 px-4 py-2.5 ${st.bg}" style="animation-delay:${i * 60}ms">
            <span class="text-[10px] uppercase tracking-wider text-slate-400 w-14 shrink-0 mt-1 font-mono">${esc(t('live.lap_short'))} ${m.lap}</span>
            <span class="text-base shrink-0">${st.icon}</span>
            <span class="flex-1 text-sm ${st.color}">${esc(m.text)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}

    <div class="bg-carbon2 rounded-2xl neon-soft overflow-hidden mb-4">
      <div class="px-4 py-3 border-b border-slate-800 font-black text-xs uppercase tracking-wider">${esc(t('result.finish_order'))}</div>
      <div class="divide-y divide-slate-800/60">
        ${S.lastRace.map(x => {
          const d = driverById(x.id), team = teamById(d.teamId);
          const isRival = d.id === S.rivalId;
          const gapLine = x.dnf
            ? t('result.retired')
                       : (x.pos === 1 ? t('result.winner') : '+' + (x.gap ?? 0).toFixed(3) + 's');
          return `
          <div class="flex items-center gap-2 px-4 py-2 ${d.isPlayer ? 'bg-racing/15' : isRival ? 'bg-racing/10' : ''} ${x.dnf ? 'opacity-50' : ''}">
            <span class="w-6 text-center font-black text-sm ${x.pos === 1 ? 'text-gold' : 'text-slate-400'}">${x.dnf ? 'NC' : x.pos}</span>
            <span class="w-1.5 h-5 rounded-sm shrink-0" style="background:${safeColor(team?.color)}"></span>
            <span>${esc(d.nat)}</span>
            <span class="flex-1 truncate text-sm ${d.isPlayer ? 'font-black' : isRival ? 'font-bold text-racing' : 'text-slate-300'}">
              ${esc(d.name)}${isRival ? ' ⚔️' : ''}
            </span>
            <span class="text-[10px] text-slate-600 hidden sm:inline">P${x.grid}</span>
            ${x.fl ? '<span class="text-[10px] text-purple-400 font-bold" title="Fastest lap">FL</span>' : ''}
            <span class="w-16 text-right text-[11px] shrink-0 ${x.dnf ? 'text-racing font-semibold' : x.pos === 1 ? 'text-gold font-bold' : 'text-slate-400'}">${esc(gapLine)}</span>
            <span class="w-6 text-right text-xs font-bold ${x.points ? 'text-gold' : 'text-slate-700'}">${x.points || '–'}</span>
          </div>`;
        }).join('')}
      </div>
    </div>

    <button type="button" data-action="after-race" class="w-full py-5 rounded-2xl bg-racing neon font-black text-lg active:scale-[.98] transition">
      ${esc(t('result.continue'))}
    </button>
  </div>`;

async function _runQuickSeason(totalRaces) {
  const carBefore = playerTeam().car;
  const budgetBefore = S.budget;
  let rdWindows = 0;
  let processedRaces = 0;

  try {
    while (S.round < CALENDAR.length) {
  const circuit = CALENDAR[S.round];

  /* v24: estrai prima meteo e temperatura, poi scegli l'assetto coerente.
     Così setup, mescole e DNF usano tutti lo stesso meteo reale. */
  S.weather = pickWeather();
  S.asphaltTemp = rollAsphaltTemp();
  S.asphaltTemp = applyWeatherToAsphalt(S.asphaltTemp, S.weather.name);

    const autoId = pickAutoSetupId(circuit, S.weather);
  S.setupBonus = setupBonusFor(autoId, circuit.type, S.weather.name)
               + facilitySetupBonus(playerTeam());                       // v32
  S.setupId = autoId;
  S.setupLabel = SETUPS.find(s => s.id === autoId).name;

  simQualifying({ keepWeather: true });   // ← non ri-estrae il meteo
  if (isSprintWeekend()) simSprint();

      const stratOpts = pickAvailableStrategies(S.weather.name);
      const autoStrat = stratOpts[irnd(0, stratOpts.length - 1)];
      S.playerStrategy = autoStrat.id;
      S.strategyLabel = autoStrat.name;

      simRace();

      if (S.sponsor && S.sponsor.justCompleted) S.sponsor.justCompleted = false;

           S.setupBonus = 0;
      S.setupId = null;
      S.setupLabel = null;
      S.playerStrategy = null;
      S.strategyLabel = null;
      S.radioLog = [];
      S.quali = null;
      S.reviewingFromStrategy = false;
      S._snowballActive = 0;

      if (S.rdOpen) { rdWindows++; autoRD(); }
      processedRaces++;

      if (processedRaces % 4 === 0 && S.round < CALENDAR.length) {
        const label = document.getElementById('qsLabel');
        const barEl = document.getElementById('qsProgress');
        if (label) label.textContent = processedRaces + ' / ' + totalRaces;
        if (barEl) barEl.style.width = ((processedRaces / totalRaces) * 100).toFixed(0) + '%';
        await new Promise(r => setTimeout(r, 0));
      }
    }

    S.lastRegulationInfo = null;
    S.screen = 'seasonEnd';
    save(); render();

        if (rdWindows > 0) {
      const carDelta = round1(playerTeam().car - carBefore);
      const net = Math.round(S.budget - budgetBefore);
      toast(t('toast.auto_rd_summary', {
        w: rdWindows,
        d: (carDelta >= 0 ? '+' : '') + carDelta,
        n: (net >= 0 ? '+' : '') + net
      }), carDelta >= 0 ? 'good' : 'bad');
    }
  } catch (e) {
    console.error('Errore nella simulazione rapida:', e);
    S.setupBonus = 0;
    S.setupLabel = null;
    S.playerStrategy = null;
    S.strategyLabel = null;
    S.radioLog = [];
    S.quali = null;
    S.reviewingFromStrategy = false;
    S._snowballActive = 0;
    S.screen = 'hub';
    S.tab = 'race';
    save(); render();
       toast(t('toast.quick_interrupted', { err: e && e.message ? e.message : 'error' }), 'bad');
  }
}

function pointsChartSVG() {
  const log = (S.seasonLog || []).filter(l => l.cum != null);
  if (log.length < 2) return '';
  const W = 340, H = 150, P = 26;
  const maxY = Math.max(10, ...log.map(l => Math.max(l.cum, l.leader || 0, l.rival || 0)));
  const X = i => P + (CALENDAR.length > 1 ? (i / (CALENDAR.length - 1)) : 0) * (W - P * 2);
  const Y = v => H - P - (v / maxY) * (H - P * 2);
  const line = (key, color, dash) =>
    `<polyline fill="none" stroke="${color}" stroke-width="2" ${dash ? 'stroke-dasharray="4 3"' : ''}
      points="${log.map((l, i) => X(i).toFixed(1) + ',' + Y(l[key] || 0).toFixed(1)).join(' ')}"/>`;
  return `
  <div class="bg-carbon2 rounded-2xl p-4 neon-soft mb-4">
    <div class="text-[11px] uppercase tracking-wider text-slate-400 mb-2">${esc(t('chart.title'))}</div>
    <svg viewBox="0 0 ${W} ${H}" class="w-full" role="img" aria-label="${esc(t('chart.title'))}">
      <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#2a323d"/>
      <line x1="${P}" y1="${P}" x2="${P}" y2="${H - P}" stroke="#2a323d"/>
      <text x="${P - 4}" y="${P + 4}" fill="#64748b" font-size="9" text-anchor="end">${maxY}</text>
      <text x="${P - 4}" y="${H - P}" fill="#64748b" font-size="9" text-anchor="end">0</text>
      ${log.some(l => l.rival != null) ? line('rival', '#94a3b8', true) : ''}
      ${line('leader', '#ffd447', false)}
      ${line('cum', '#e10600', false)}
    </svg>
    <div class="flex gap-4 text-[11px] text-slate-400 mt-1">
      <span><b style="color:#e10600">━</b> ${esc(t('chart.you'))}</span>
      <span><b style="color:#ffd447">━</b> ${esc(t('chart.leader'))}</span>
      <span><b style="color:#94a3b8">┅</b> ${esc(t('chart.rival'))}</span>
    </div>
  </div>`;
}

function seasonSummaryCard() {
  const log = (S.seasonLog || []).filter(l => !l.isSprint);
  if (!log.length) return '';
  const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
  const fin = log.filter(l => !l.dnf);
  const best = fin.length ? fin.reduce((b, l) => (l.pos < b.pos ? l : b), fin[0]) : null;
  const gained = fin.reduce((s, l) => s + (l.grid - l.pos), 0);
  const ppr = arr => arr.length ? (arr.reduce((s, l) => s + l.points, 0) / arr.length).toFixed(1) : '—';
  const dry = log.filter(l => l.weather === 'Asciutto'), wet = log.filter(l => l.weather !== 'Asciutto');
  const cell = (l, v) => `<div class="bg-carbon3 rounded-xl py-2"><div class="text-[9px] uppercase tracking-wider text-slate-400">${l}</div><div class="font-black text-sm">${v}</div></div>`;
  return `
  <div class="bg-carbon2 rounded-2xl p-4 neon-soft mb-4">
    <div class="text-[11px] uppercase tracking-wider text-slate-400 mb-3">${esc(t('summary.title'))}</div>
    <div class="grid grid-cols-3 gap-2 text-center">
      ${cell(t('summary.best_gp'), best ? 'P' + best.pos + ' ' + esc(best.flag) : '—')}
      ${cell(t('summary.avg_grid'), avg(log.map(l => l.grid)).toFixed(1))}
      ${cell(t('summary.avg_finish'), fin.length ? 'P' + avg(fin.map(l => l.pos)).toFixed(1) : '—')}
      ${cell(t('summary.pos_gained'), (gained >= 0 ? '+' : '') + gained)}
      ${cell(t('summary.pts_dry'), ppr(dry))}
      ${cell(t('summary.pts_wet'), ppr(wet))}
      ${cell(t('summary.fastest_laps'), log.filter(l => l.fl).length)}
      ${cell(t('summary.dnf'), log.filter(l => l.dnf).length)}
      ${cell(t('summary.sc_races'), log.filter(l => l.sc).length)}
      ${cell(t('summary.sprint_pts'), S.totals.sprintPoints || 0)}
    </div>
  </div>`;
}
