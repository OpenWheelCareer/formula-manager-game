          </label>
          <input id="fAge" type="range" min="18" max="22" value="${d.age}" class="w-full"
            aria-label="Età di esordio" aria-valuemin="18" aria-valuemax="22" aria-valuenow="${d.age}"
            data-action-input="age-slider">
        </div>

        ${difficultyPicker()}
      </div>

      <div class="flex gap-3 mt-5">
        <button type="button" aria-label="Torna al menu" data-action="menu-back" class="px-5 py-4 rounded-2xl bg-carbon2 neon-soft text-slate-300 font-semibold">← Indietro</button>
        <button type="button" data-action="create-step1" class="flex-1 py-4 rounded-2xl bg-racing neon font-black hover:brightness-110 active:scale-[.98] transition">AVANTI →</button>
      </div>
    </div>`;
  }

  if (d.step === 2) {
    return `
    <div class="anim">
      ${header('Attributi iniziali', 'Passo 2 di 4 — Distribuisci ' + pool + ' punti')}

      <div class="bg-carbon2 rounded-2xl p-4 sm:p-6 neon-soft space-y-5">
        <div class="flex items-center justify-between p-3 rounded-xl ${left < 0 ? 'bg-racing/20' : 'bg-carbon3'}">
          <span class="text-sm font-semibold">Punti rimanenti</span>
          <span id="pointsLeft" class="text-2xl font-black ${left < 0 ? 'text-racing' : left === 0 ? 'text-emerald-400' : 'text-gold'}">${left}</span>
        </div>

        ${attrSlider('speed', 'Velocità', 'Decisiva in qualifica e sul giro secco', '#e10600', d.speed)}
        ${attrSlider('consistency', 'Costanza', 'Riduce gli errori e le gare storte in GP', '#0090ff', d.consistency)}
        ${attrSlider('tyres', 'Gestione Gomme', 'Contiene il degrado nelle strategie aggressive', '#00594f', d.tyres)}

        <div class="p-4 rounded-xl bg-carbon3 flex items-center justify-between">
          <span class="text-[11px] uppercase tracking-wider text-slate-400">Overall stimato</span>
          <span class="text-3xl font-black text-white" id="ovrPrev">${computeOVR(d.speed, d.consistency, d.tyres)}</span>
        </div>

        ${traitPicker()}
      </div>

      <div class="flex gap-3 mt-5">
        <button type="button" data-action="create-back1" class="px-5 py-4 rounded-2xl bg-carbon2 neon-soft text-slate-300 font-semibold">←</button>
        <button type="button" data-action="create-step2" class="flex-1 py-4 rounded-2xl bg-racing neon font-black hover:brightness-110 active:scale-[.98] transition">SCEGLI SCUDERIA →</button>
      </div>
    </div>`;
  }

  if (d.step === 3) {
    const lowTeams = TEAM_DB.filter(t => t.low);
    return `
    <div class="anim">
      ${header('Scegli la scuderia', 'Passo 3 di 4 — Team d\'esordio')}

      <div class="grid gap-3 sm:grid-cols-2">
        ${lowTeams.map(t => `
          <button type="button" data-action="create-team" data-team-id="${esc(t.id)}"
            class="text-left p-4 rounded-2xl bg-carbon2 neon-soft border-2 transition active:scale-[.98] ${draft.teamId === t.id ? 'border-racing' : 'border-transparent hover:border-slate-700'}">
            <div class="flex items-center gap-3 mb-3">
              <div class="w-3 h-10 rounded-sm" style="background:${safeColor(t.color)}"></div>
              <div class="min-w-0">
                <div class="font-black text-lg leading-tight">${esc(t.name)}</div>
                <div class="text-[11px] text-slate-400">Budget ${t.budget} M$</div>
              </div>
            </div>
            <div class="space-y-2.5">
              ${bar('Monoposto', Math.round(t.car), t.color)}${bar('Prestigio', t.prestige, '#64748b')}
            </div>
          </button>`).join('')}
      </div>

      <div class="flex gap-3 mt-5">
        <button type="button" data-action="create-back2" class="px-5 py-4 rounded-2xl bg-carbon2 neon-soft text-slate-300 font-semibold">←</button>
        <button type="button" data-action="create-step3" ${draft.teamId ? '' : 'disabled'}
          class="flex-1 py-4 rounded-2xl font-black transition active:scale-[.98] ${draft.teamId ? 'bg-racing neon hover:brightness-110' : 'bg-carbon3 text-slate-600 cursor-not-allowed'}">
          SCEGLI IL RIVALE →
        </button>
      </div>
    </div>`;
  }

  const myTeam = TEAM_DB.find(t => t.id === d.teamId);
  const playerOvr = computeOVR(d.speed, d.consistency, d.tyres);
  const candidates = getRivalCandidatesForCreate(d.teamId, d.age, playerOvr);
  const canStart = candidates.length === 0 || !!d.rivalId;

  return `
  <div class="anim">
    ${header('Scegli il tuo rivale', 'Passo 4 di 4 — Il tuo avversario di carriera')}

    <div class="bg-carbon2 rounded-2xl p-4 neon-soft mb-4 text-sm text-slate-300">
      Ogni GP in cui batti il tuo rivale ti avvicina a un <b class="text-gold">bonus permanente</b>
      sulle tue statistiche. Scegli con cura: sarà il tuo termine di paragone per tutta la carriera.
    </div>

    ${candidates.length === 0 ? `
    <div class="bg-carbon2 rounded-2xl p-6 neon-soft text-center text-slate-400 text-sm">
      Nessun candidato disponibile — il sistema assegnerà automaticamente un rivale.
    </div>` : `
    <div class="grid gap-3 sm:grid-cols-2">
      ${candidates.map(c => {
        const hint = rivalAffinityHint(c, myTeam.car, d.age);
        const selected = d.rivalId === c.id;
        return `
        <button type="button" data-action="create-rival" data-rival-id="${esc(c.id)}"
          class="text-left p-4 rounded-2xl bg-carbon2 neon-soft border-2 transition active:scale-[.98] ${selected ? 'border-racing' : 'border-transparent hover:border-slate-700'}">
          <div class="flex items-center gap-3 mb-3">
            <div class="text-3xl">${esc(c.nat)}</div>
            <div class="flex-1 min-w-0">
              <div class="font-black text-base leading-tight truncate">${esc(c.name)}</div>
              <div class="text-[11px] text-slate-400 flex items-center gap-1.5 mt-0.5 truncate">
                <span class="w-2.5 h-3.5 rounded-sm shrink-0" style="background:${safeColor(c.teamColor)}"></span>
                ${esc(c.teamName)}
              </div>
            </div>
            <div class="text-right shrink-0">
              <div class="text-[10px] uppercase tracking-wider text-slate-500">OVR</div>
              <div class="text-2xl font-black">${c.ovr}</div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 text-[11px] mb-2">
            <div class="bg-carbon3 rounded-lg py-1 px-2 text-center">
              <span class="text-slate-500">Età </span><b class="text-slate-200">${c.age}</b>
            </div>
            <div class="bg-carbon3 rounded-lg py-1 px-2 text-center">
              <span class="text-slate-500">Vettura </span><b class="text-slate-200">${Math.round(c.teamCar)}</b>
            </div>
          </div>
          <div class="text-[11px] text-slate-400 italic">${esc(hint)}</div>
        </button>`;
      }).join('')}
    </div>`}

    <div class="flex gap-3 mt-5">
      <button type="button" data-action="create-back3" class="px-5 py-4 rounded-2xl bg-carbon2 neon-soft text-slate-300 font-semibold">←</button>
      <button type="button" data-action="create-finish" ${canStart ? '' : 'disabled'}
        class="flex-1 py-4 rounded-2xl font-black transition active:scale-[.98] ${canStart ? 'bg-racing neon hover:brightness-110' : 'bg-carbon3 text-slate-600 cursor-not-allowed'}">
        🏁 INIZIA LA CARRIERA
      </button>
    </div>
  </div>`;
}

function attrSlider(key, label, desc, color, val) {
  return `
  <div>
    <div class="flex justify-between items-baseline mb-1">
      <div>
        <span class="font-bold text-sm">${label}</span>
        <span class="block text-[11px] text-slate-500">${desc}</span>
      </div>
      <span class="text-2xl font-black" style="color:${safeColor(color)}" id="v_${key}">${val}</span>
    </div>
    <input type="range" min="30" max="80" value="${val}" class="w-full"
      aria-label="${esc(label)}"
      data-action-input="attr-slider" data-attr-key="${esc(key)}">
  </div>`;
}

function syncStep1Draft() {
  const g = id => document.getElementById(id);
  if (g('fFirst')) draft.first = g('fFirst').value;
  if (g('fLast'))  draft.last  = g('fLast').value;
  if (g('fNat'))   draft.nat   = g('fNat').value;
  if (g('fAge'))   draft.age   = +g('fAge').value;
}

function createStep1() {
  const f = document.getElementById('fFirst').value.trim();
  const l = document.getElementById('fLast').value.trim();
  if (!f || !l) { toast('Inserisci nome e cognome', 'bad'); return; }
  draft.first = sanitizeName(f);
  draft.last = sanitizeName(l);
  if (!draft.first || !draft.last) { toast('Nome o cognome non validi', 'bad'); return; }
  draft.nat = document.getElementById('fNat').value;
  draft.age = +document.getElementById('fAge').value;
  draft.step = 2;
  renderCreate();
}

function createStep2() {
  const used = draft.speed + draft.consistency + draft.tyres;
  if (used > draftPool()) { toast('Hai superato i punti disponibili', 'bad'); return; }
  draft.step = 3;
  renderCreate();
}

function createStep3() {
  if (!draft.teamId) return;

  if (draft.rivalId) {
    const rivalData = AI_DRIVERS.find(d => d.id === draft.rivalId);
    if (!rivalData || rivalData.team === draft.teamId) draft.rivalId = null;
  }
  if (!draft.rivalId) {
    const cands = getRivalCandidatesForCreate(
      draft.teamId, draft.age,
      computeOVR(draft.speed, draft.consistency, draft.tyres)
    );
    if (cands.length) draft.rivalId = cands[0].id;
  }
  draft.step = 4;
  renderCreate();
}

function createFinish() {
  if (!draft.teamId) return;
  CURRENT_SLOT = draft.slot || 1;
  S = newCareer(draft);
  S.rdOpen = true;
  save();
  render();
  toast('Benvenuto in F1, ' + S.player.last + '!', 'good');
}

function continueCareer() {
  S = load(CURRENT_SLOT);
  if (!S) { toast('Salvataggio assente o corrotto', 'bad'); return; }
  RNG_STATE = S.rngState >>> 0;
  if (!S.sponsor && (!S.sponsorOffers || !S.sponsorOffers.length) && S.round < CALENDAR.length) {
    S.sponsorOffers = generateSponsorOffers();
  }
  if (!S.rivalId) S.rivalId = selectRivalFromDriverList(S.player);
  if (S.drivers.some(d => !d.role)) assignTeamRoles(S);
  save();
  render();
}

/* ---------- HUB ---------- */
function viewHub() {
  const p = S.player, t = playerTeam();
  const tabs = [
    ['race',  '🏁 Gara'],
    ['stand', '📊 Classifiche'],
    ['rd',    '🔧 R&D'],
    ['career','🏆 Carriera']
  ];
  const pPos = playerPos();
  const trait = p.trait && TRAITS[p.trait];

  return `
  <div class="anim">
    <div class="rounded-2xl bg-carbon2 neon-soft overflow-hidden mb-4">
      <div class="h-1.5" style="background:linear-gradient(90deg,${safeColor(t.color)},transparent)"></div>
      <div class="p-4 flex items-center gap-4">
        <div class="text-4xl sm:text-5xl">${esc(p.nat)}</div>
        <div class="flex-1 min-w-0">
          <div class="font-black text-lg sm:text-xl leading-tight truncate">${esc(p.name)}</div>
          <div class="text-xs text-slate-400 flex items-center gap-2 mt-0.5 flex-wrap">
            ${teamBadge(t)} <span class="text-slate-600">•</span> ${p.age} anni
            ${p.role ? `<span class="text-slate-600">•</span> <span class="text-slate-300">${esc(p.role)}</span>` : ''}
            ${trait ? `<span class="text-slate-600">•</span> <span class="text-slate-300">${trait.icon} ${esc(trait.name)}</span>` : ''}
          </div>
        </div>
        <div class="text-center shrink-0">
          <div class="text-[10px] uppercase tracking-widest text-slate-500">OVR</div>
          <div class="text-3xl sm:text-4xl font-black ${p.ovr >= 85 ? 'text-gold' : p.ovr < diff().fireOvr + 6 ? 'text-racing' : 'text-white'}">${p.ovr}</div>
        </div>
      </div>
      <div class="px-4 pb-4 grid grid-cols-3 gap-3">
        ${bar('VEL', p.speed, '#e10600')}
        ${bar('COS', p.consistency, '#0090ff')}
        ${bar('GOM', p.tyres, '#00594f')}
      </div>
      <div class="px-4 pb-4 grid grid-cols-4 gap-2 text-center">
        ${miniStat('Stagione', S.year)}
        ${miniStat('Punti', p.pts)}
        ${miniStat('Pos.', pPos)}
        ${miniStat('Contratto', p.contract + 'a')}
      </div>
    </div>

    ${rivalCard()}
    ${roleCard()}

    <div class="grid grid-cols-4 gap-2 mb-4 sticky top-2 z-20" role="tablist" aria-label="Sezioni carriera" data-tablist>
      ${tabs.map(([id, lbl]) => `
        <button type="button" role="tab" id="tab-${id}" aria-selected="${S.tab === id}"
          aria-controls="panel-main" tabindex="${S.tab === id ? 0 : -1}"
          data-action="hub-tab" data-tab="${id}"
          class="tabbtn ${S.tab === id ? 'active' : 'bg-carbon2 text-slate-400'} py-3 rounded-xl text-[11px] sm:text-sm font-bold transition neon-soft">
          ${lbl}
        </button>`).join('')}
    </div>

    <div id="panel-main" role="tabpanel" aria-labelledby="tab-${S.tab}" tabindex="0">
      ${ S.tab === 'race'   ? tabRace()
       : S.tab === 'stand'  ? tabStandings()
       : S.tab === 'rd'     ? tabRD()
       : tabCareer() }
    </div>
  </div>`;
}

function rivalCard() {
  const rival = rivalDriver();
  if (!rival) return '';
  const rivalTeam = teamById(rival.teamId);
  const delta = S.rivalryPoints;
  const deltaColor = delta > 0 ? 'text-emerald-400' : delta < 0 ? 'text-racing' : 'text-slate-400';
  const deltaLabel = delta > 0 ? '+' + delta : (delta < 0 ? String(delta) : '0');

  const lastStored = S.rivalryHistory.length ? S.rivalryHistory[S.rivalryHistory.length - 1] : null;
  const last = (lastStored && lastStored.rivalId === S.rivalId) ? lastStored : null;

  return `
  <div class="bg-carbon2 rounded-2xl neon-soft overflow-hidden mb-4 border border-slate-700/50">
    <div class="px-4 py-2 bg-gradient-to-r from-racing/20 to-transparent flex items-center justify-between">
      <span class="text-[11px] uppercase tracking-wider text-racing font-bold">⚔️ Rivalità Stagionale</span>
      <span class="text-[11px] text-slate-400">Carriera: <b class="text-slate-200">${S.rivalryTotal >= 0 ? '+' : ''}${S.rivalryTotal}</b></span>
    </div>
    <div class="p-4 flex items-center gap-3">
      <div class="text-3xl">${esc(rival.nat)}</div>
      <div class="flex-1 min-w-0">
        <div class="font-black truncate">${esc(rival.name)}</div>
        <div class="text-[11px] text-slate-400 flex items-center gap-1.5 truncate">
          <span class="w-1.5 h-3 rounded-sm inline-block shrink-0" style="background:${safeColor(rivalTeam?.color)}"></span>
                 ${esc(rivalTeam?.name || '—')} • OVR ${rival.ovr} • ${rival.pts} pt • ${S.rivalSeasons || 0} stag.
        </div>
      </div>
      <div class="text-right shrink-0">
        <div class="text-[10px] uppercase tracking-wider text-slate-500">Vantaggio</div>
        <div class="text-2xl font-black ${deltaColor}">${deltaLabel}</div>
      </div>
    </div>
    ${last ? `
    <div class="px-4 pb-3 text-[11px] text-slate-400 border-t border-slate-800 pt-2">
      Ultimo scontro: <b class="text-slate-300">${esc(last.gp)}</b> — ${esc(last.reason)}
      <span class="ml-1 font-black ${last.delta > 0 ? 'text-emerald-400' : last.delta < 0 ? 'text-racing' : 'text-slate-500'}">(${last.delta > 0 ? '+' : ''}${last.delta})</span>
    </div>` : ''}
  </div>`;
}

function roleCard() {
  const mate = teammate();
  if (!mate) return '';
  const t = S.mateTension;
  const col = t >= 70 ? '#e10600' : t >= 40 ? '#ffd447' : '#00594f';
  return `
  <div class="bg-carbon2 rounded-2xl neon-soft p-4 mb-4">

function tabRD() {
  const t = playerTeam();
  const consCost = rdEffectiveCost('cons', t.car, S.budget);
  const balCost  = rdEffectiveCost('bal',  t.car, S.budget);
  const aggCost  = rdEffectiveCost('agg',  t.car, S.budget);
  const simCharges = t.simCharges || 0;

  const overCapMult = rdOverCapMultiplier(S.budget);
  const isOverCap = S.budget > BUDGET_CAP;

  return `

    ${isOverCap ? `
    <div class="bg-racing/10 border border-racing/40 rounded-xl p-3 text-sm">

      <div class="text-slate-300 mt-1 text-[12px]">
        Costi R&amp;D maggiorati del <b class="text-racing">${Math.round((overCapMult - 1) * 100)}%</b>.

      </div>

    ${sponsorBox()}

    ${S.rdOpen ? `
      <div class="bg-gold/10 border border-gold/40 rounded-xl p-3 text-sm text-gold font-semibold">
        Finestra aperta — puoi introdurre ${2 - S.rdDone} pacchetto/i.
      </div>

      ${simCharges > 0 ? `
      <div class="bg-emerald-600/15 border border-emerald-600/40 rounded-xl p-3 text-[12px] text-emerald-300 font-semibold">
        🖥️ Correlazione attiva: i prossimi ${simCharges} sviluppo/i hanno −${Math.round(SIM_BUFF_FAIL_REDUCTION * 100)}% di rischio.
      </div>` : ''}

      ${RD_PACKAGES.map(p => {
        const cf = Math.round(rdEffectiveFail('cons', t.car, t.rdSkill, p.id, simCharges) * 100);
        const bf = Math.round(rdEffectiveFail('bal',  t.car, t.rdSkill, p.id, simCharges) * 100);
        const af = Math.round(rdEffectiveFail('agg',  t.car, t.rdSkill, p.id, simCharges) * 100);
        return `
        <div class="bg-carbon2 rounded-2xl p-4 neon-soft">
          <div class="flex items-start gap-3 mb-3">
            <div class="text-2xl">${esc(p.icon)}</div>
            <div class="min-w-0">
              <div class="font-black">${esc(p.name)}</div>
              <div class="text-[12px] text-slate-400">${esc(p.desc)}</div>
              <div class="text-[10px] text-slate-500 mt-0.5">${esc(p.note)}</div>

          </div>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" data-action="rd-run" data-pkg="${esc(p.id)}" data-strat="cons" ${S.budget < consCost ? 'disabled' : ''}

              <div class="text-[10px] text-slate-500">${consCost} M$</div>
              <div class="text-[9px] mt-1 text-emerald-400">rischio ${cf}%</div>
            </button>
            <button type="button" data-action="rd-run" data-pkg="${esc(p.id)}" data-strat="bal" ${S.budget < balCost ? 'disabled' : ''}
              class="p-2.5 rounded-xl text-center transition active:scale-95 ${S.budget < balCost ? 'bg-carbon3 text-slate-600' : 'bg-carbon3 hover:bg-slate-700'}">
              <div class="text-[11px] font-bold">Bilanciata</div>
              <div class="text-[10px] text-slate-500">${balCost} M$</div>
              <div class="text-[9px] mt-1 text-gold">rischio ${bf}%</div>
            </button>
            <button type="button" data-action="rd-run" data-pkg="${esc(p.id)}" data-strat="agg" ${S.budget < aggCost ? 'disabled' : ''}
              class="p-2.5 rounded-xl text-center transition active:scale-95 ${S.budget < aggCost ? 'bg-carbon3 text-slate-600' : 'bg-carbon3 hover:bg-slate-700'}">
              <div class="text-[11px] font-bold">Aggressiva</div>
              <div class="text-[10px] text-slate-500">${aggCost} M$</div>
              <div class="text-[9px] mt-1 text-racing">rischio ${af}%</div>

    ` : `
      <div class="bg-carbon2 rounded-2xl p-6 neon-soft text-center">
        <div class="text-4xl mb-2">🔒</div>
        <div class="font-bold">Nessuna finestra di sviluppo attiva</div>
        <p class="text-sm text-slate-400 mt-1">Si riapre ogni ${RD_BLOCK} gare.</p>
      </div>
    `}

    ${S.rdLog.length ? `

      <div class="text-[11px] uppercase tracking-wider text-slate-400 mb-3">Storico sviluppi</div>
      <div class="space-y-2.5">

          <div class="flex gap-3 items-start">
            <span class="text-lg">${esc(l.icon)}</span>
            <div class="flex-1 min-w-0">

              <div class="text-[11px] text-slate-500">${l.year} • R${l.round} — ${esc(l.text)}</div>
            </div>
            <span class="font-black text-sm ${l.outcome === 'good' ? 'text-emerald-400' : l.outcome === 'neutral' ? 'text-slate-400' : 'text-racing'}">
              ${l.delta >= 0 ? '+' : ''}${l.delta}
            </span>
          </div>`).join('')}
      </div>
    </div>` : ''}
  </div>`;
}

function circuitStatsCard() {
  const entries = Object.entries(S.circuitStats || {}).filter(([, v]) => v.races > 0);
  if (!entries.length) return '';
  const rows = entries.map(([gp, v]) => {
    const cal = CALENDAR.find(c => c.gp === gp);
    return { gp, flag: cal ? cal.flag : '🏁', ...v, avg: v.finishes ? v.posSum / v.finishes : null };
  }).sort((a, b) => b.races - a.races || (a.avg ?? 99) - (b.avg ?? 99));
  const fav = rows.filter(r => r.finishes >= 2).sort((a, b) => a.avg - b.avg)[0];
  return `
  <div class="bg-carbon2 rounded-2xl neon-soft overflow-hidden">
    <div class="px-4 py-3 border-b border-slate-800 font-black text-sm uppercase tracking-wider">🗺️ Statistiche per circuito</div>
    ${fav ? `<div class="px-4 py-2 text-[11px] text-slate-400 border-b border-slate-800">Circuito preferito: <b class="text-gold">${esc(fav.flag)} ${esc(fav.gp)}</b> (media P${fav.avg.toFixed(1)})</div>` : ''}
    <div class="divide-y divide-slate-800/60 max-h-72 overflow-y-auto">
      ${rows.map(r => `
        <div class="flex items-center gap-2 px-4 py-2 text-sm">
          <span>${esc(r.flag)}</span>
          <span class="flex-1 truncate text-slate-300">${esc(r.gp)}</span>
          <span class="text-[11px] text-slate-500">${r.races} GP</span>
          <span class="text-[11px] text-slate-400 w-14 text-right">${r.avg ? 'μ P' + r.avg.toFixed(1) : '—'}</span>
          <span class="text-[11px] text-slate-500 w-20 text-right">🥇${r.wins} 🍾${r.podiums} ⏱️${r.poles}</span>
        </div>`).join('')}
    </div>
  </div>`;
}

/* ---------- QUALIFICHE ---------- */
function goQualifying() { startQualifying({ keepWeather: true }); }

function startQualifying(opts = {}) {
  if (!opts.keepWeather) S.weather = pickWeather();
  S.quali = {
    session: 0, sessions: {}, playerPos: {}, commentary: {},
    status: 'running', eliminatedIn: null, finalPos: null,
    savedTyres: false
  };
  runQualiSession(1);
  S.screen = 'quali';
  save(); render();
}

function simulateQualiTimes(participantIds, sessionNum) {
  const cfg = QUALI_SESSIONS[sessionNum];
  const rows = participantIds.map(id => {
    const d = driverById(id);
    let sc = basePace(d);

    if (d.isPlayer) {
      sc += (d.speed - 50) * SIM_TUNING.qualiPlayerSpeedBoost;
      const negScale = clamp(
        1 - (d.consistency - 50) * SIM_TUNING.qualiNegScaleConsistency * cfg.consMult,
        SIM_TUNING.qualiNegScaleMin,
        SIM_TUNING.qualiNegScaleMax
      );
      let q = rnd(-cfg.noise, cfg.noise);
      if (q < 0) q *= negScale;
      sc += q * (1 + (S.weather.chaos - 1) * SIM_TUNING.qualiWeatherChaosScale);
    } else {
      sc += rnd(-cfg.noise, cfg.noise) * (1 + (S.weather.chaos - 1) * SIM_TUNING.qualiWeatherChaosScale);
    }
    return { id, sc };
  });
  rows.sort((a, b) => b.sc - a.sc);
  return rows;
}

function getQualiParticipants(sessionNum) {
  if (sessionNum === 1) return S.drivers.map(d => d.id);
  if (sessionNum === 2) return S.quali.sessions[1].slice(0, 15).map(r => r.id);
  if (sessionNum === 3) {
    const q2Top10 = S.quali.sessions[2].slice(0, 10);
    if (S.quali.status === 'retired') return q2Top10.filter(r => r.id !== 'PLAYER').map(r => r.id);
    return q2Top10.map(r => r.id);
  }
  return [];
}

function awardPole(driverId) {
  const d = driverById(driverId);
  if (!d) return;
  d.poles++;
  if (d.isPlayer) {
    S.totals.poles++;
    const race = CALENDAR[S.round];
    if (race) circuitStatFor(race.gp).poles++;
  }
}

function circuitStatFor(gp) {
  if (!S.circuitStats) S.circuitStats = {};
  if (!S.circuitStats[gp]) {
    S.circuitStats[gp] = { races:0, wins:0, podiums:0, poles:0, points:0, dnf:0, bestPos:null, posSum:0, finishes:0 };
  }
  return S.circuitStats[gp];
}

function runQualiSession(sessionNum) {
  const cfg = QUALI_SESSIONS[sessionNum];
  const participants = getQualiParticipants(sessionNum);
  const rows = simulateQualiTimes(participants, sessionNum);

  S.quali.sessions[sessionNum] = rows;
  S.quali.session = sessionNum;

  const pIdx = rows.findIndex(r => r.id === 'PLAYER');
  const playerPos = pIdx >= 0 ? pIdx + 1 : null;
  S.quali.playerPos[sessionNum] = playerPos;

  const prevPos = sessionNum > 1 ? S.quali.playerPos[sessionNum - 1] : null;
  S.quali.commentary[sessionNum] = generateQualiCommentary(sessionNum, playerPos, prevPos);

  if (sessionNum < 3) {
    if (pIdx < 0 || pIdx >= cfg.advance) {
      S.quali.status = 'eliminated';
      S.quali.eliminatedIn = sessionNum;
      S.quali.finalPos = playerPos;
      runRemainingQualiSessions(sessionNum);
    }
  } else {
    if (rows[0]) awardPole(rows[0].id);
    S.quali.status = 'done';
  }
}

function generateQualiCommentary(sessionNum, playerPos, prevPos) {
  const msgs = [];
  const cfg = QUALI_SESSIONS[sessionNum];
  if (playerPos == null) return msgs;

  if (sessionNum === 3) {
    if (playerPos === 1) msgs.push({ type: 'good', text: '⏱️ POLE POSITION! Giro perfetto in Q3.' });
    else if (playerPos <= 3) msgs.push({ type: 'good', text: `🏁 Q3: P${playerPos}, prima fila conquistata.` });
    else msgs.push({ type: 'info', text: `Q3: P${playerPos}. Griglia definita, si parte da qui.` });
  } else if (playerPos === 1) {
    msgs.push({ type: 'good', text: '⏱️ Giro perfetto! Sei il più veloce in pista.' });
  } else if (playerPos <= cfg.advance) {
    msgs.push({ type: 'info', text: `✅ ${cfg.name}: P${playerPos}, dentro la zona di qualificazione.` });
  } else {
    msgs.push({ type: 'bad', text: `❌ ${cfg.name}: P${playerPos}, fuori dalla zona. Stai per essere eliminato.` });
  }

  if (prevPos != null) {
    if (playerPos < prevPos) msgs.push({ type: 'good', text: `📈 Migliori di ${prevPos - playerPos} posizioni rispetto alla sessione precedente.` });
    else if (playerPos > prevPos) msgs.push({ type: 'warn', text: `📉 Perdi ${playerPos - prevPos} posizioni rispetto alla sessione precedente.` });
  } else if (playerPos <= 3) {
    msgs.push({ type: 'good', text: `🔥 Ottimo ritmo fin dall'inizio.` });
  } else if (playerPos >= 18) {
    msgs.push({ type: 'warn', text: `⚠️ Ritmo insufficiente. Serve un giro pulito.` });
  }

  if (S.weather.name === 'Pioggia') msgs.push({ type: 'warn', text: '🌧️ Pista bagnata, giro molto insidioso. Ogni errore costa caro.' });
  else if (S.weather.name === 'Variabile') msgs.push({ type: 'info', text: '🌤️ Pista incerta, difficile trovare il limite della vettura.' });

  return msgs.slice(0, QUALI_COMMENTARY_CAP);
}

function runRemainingQualiSessions(fromSession) {
  for (let s = fromSession + 1; s <= 3; s++) {
    if (S.quali.sessions[s]) continue;
    const participants = getQualiParticipants(s);
    const rows = simulateQualiTimes(participants, s);
    S.quali.sessions[s] = rows;
    if (s === 3) {
      const prevPos = S.quali.playerPos[2] ?? null;
      S.quali.commentary[3] = generateQualiCommentary(3, S.quali.playerPos[3] ?? null, prevPos);
    }
  }
  const q3Rows = S.quali.sessions[3];
  if (q3Rows && q3Rows[0]) awardPole(q3Rows[0].id);
}

function advanceQuali() {
  if (S.quali.status === 'eliminated' || S.quali.status === 'retired') return completeQualifying();
  if (S.quali.session >= 3) return completeQualifying();
  runQualiSession(S.quali.session + 1);
  save(); render();
}

function skipQ3() {
  if (S.quali.session !== 2) return;
  const pPos = S.quali.playerPos[2];
  if (!pPos || pPos > 10) return;

  S.quali.status = 'retired';
  S.quali.finalPos = 10;
  S.quali.savedTyres = true;

  const q2Top10 = S.quali.sessions[2].slice(0, 10);
  const others = q2Top10.filter(r => r.id !== 'PLAYER').map(r => r.id);
  const q3Rows = simulateQualiTimes(others, 3);
  S.quali.sessions[3] = q3Rows;
  S.quali.session = 3;

  if (q3Rows[0]) awardPole(q3Rows[0].id);

  save(); render();
}

function buildGridFromQuali() {
  const grid = [];
  if (S.quali.sessions[3]) S.quali.sessions[3].forEach(r => grid.push(r.id));
  if (S.quali.status === 'retired') grid.push('PLAYER');
  if (S.quali.sessions[2] && S.quali.sessions[2].length >= 15) S.quali.sessions[2].slice(10, 15).forEach(r => grid.push(r.id));
  if (S.quali.sessions[1]) S.quali.sessions[1].slice(15, 22).forEach(r => grid.push(r.id));
  const seen = new Set();
  S.grid = grid.filter(id => { if (seen.has(id)) return false; seen.add(id); return true; });
}

function isSprintWeekend() {
  return !!CALENDAR[S.round] && SPRINT_GPS.has(CALENDAR[S.round].gp);
}

function completeQualifying() {
  buildGridFromQuali();
  S.reviewingFromStrategy = false;
  if (isSprintWeekend() && !S.sprintDone) {
    simSprint();
    S.screen = 'sprint';
  } else {
    S.screen = 'strategy';
  }
  save(); render();
}

function simQualifying() {
  S.weather = pickWeather();
  S.quali = {
    session: 0, sessions: {}, playerPos: {}, commentary: {},
    status: 'running', eliminatedIn: null, finalPos: null,
    savedTyres: false
  };
  runQualiSession(1);
  if (S.quali.status === 'running') runQualiSession(2);
  if (S.quali.status === 'running') runQualiSession(3);
  buildGridFromQuali();
}

function viewQuali() {
  const q = S.quali;
  if (q.status !== 'running') return viewQualiReview();

  const r = CALENDAR[S.round];
  const sessionNum = q.session;
  const cfg = QUALI_SESSIONS[sessionNum];
  const rows = q.sessions[sessionNum] || [];
  const playerPos = q.playerPos[sessionNum];
  const commentary = (q.commentary && q.commentary[sessionNum]) || [];

  const isCut = sessionNum < 3 && playerPos && playerPos > cfg.advance;
  const accent = playerPos === 1 ? 'bg-gold/20'
               : (playerPos && playerPos <= cfg.advance) ? 'bg-emerald-600/15'
               : 'bg-carbon2';

  const statusCard = `
    <div class="rounded-2xl p-5 mb-4 text-center neon ${accent}">
      <div class="text-[11px] uppercase tracking-wider text-slate-400">La tua posizione in ${cfg.name}</div>
      <div class="text-6xl font-black ${playerPos === 1 ? 'text-gold' : playerPos && playerPos <= cfg.advance ? 'text-white' : 'text-slate-300'}">P${playerPos || '—'}</div>
      ${playerPos === 1 ? '<div class="text-gold font-black mt-1">⏱️ MIGLIOR TEMPO!</div>' : ''}
      ${isCut ? '<div class="text-racing font-bold mt-1">Fuori dalla zona di qualificazione</div>' : ''}
    </div>`;

  const showSkipQ3 = sessionNum === 2 && playerPos && playerPos <= 10;
  const buttonLabel = sessionNum < 3 ? `Vai alla Q${sessionNum + 1} →` : 'Vai alla strategia →';

  return `
  <div class="anim">
    <div class="text-center mb-4">
      <div class="text-[11px] uppercase tracking-[0.3em] text-slate-500">Qualifiche — ${cfg.name}</div>
      <h2 class="text-2xl font-black">${esc(r.flag)} GP ${esc(r.gp)}</h2>
      <div class="text-sm text-slate-400">${esc(S.weather.icon)} ${esc(S.weather.name)}</div>
      ${S.setupLabel ? `<div class="text-xs text-slate-500 mt-1">Setup: <b class="text-slate-300">${esc(S.setupLabel)}</b> (${S.setupBonus >= 0 ? '+' : ''}${S.setupBonus})</div>` : ''}
    </div>

    <div class="mb-3 flex items-center justify-center gap-2 text-[11px]">
      ${[1,2,3].map(n => {
        const active = sessionNum === n;
        const done = q.sessions[n] ? true : false;
        const label = QUALI_SESSIONS[n].name;
        return `<span class="px-2.5 py-1 rounded-full ${active ? 'bg-racing text-white font-black' : done ? 'bg-carbon3 text-slate-400' : 'bg-carbon2 text-slate-600'}">${label}</span>`;
      }).join('<span class="text-slate-700">›</span>')}
    </div>

    ${statusCard}

/* ---------- SPRINT ---------- */
function simSprint() {
  const w = S.weather, circuit = CALENDAR[S.round];
  const amp = SIM_TUNING.raceNoise * 0.6;
  const rows = S.grid.map((id, gridPos) => {
    const d = driverById(id);
    const car = teamById(d.teamId).car;
    let sc = car * SIM_TUNING.raceCarWeight + d.ovr * SIM_TUNING.raceOvrWeight
           - gridPos * SIM_TUNING.raceGridPenalty * 1.25
           + traitBonus(d.trait, 'race', w.name, circuit.type) + (ROLE_PACE[d.role] || 0);
    let roll = rnd(-amp, amp);
    if (d.isPlayer) {
      sc += diff().paceBonus * 0.5;
      const negScale = clamp(1 - (d.consistency - 50) * SIM_TUNING.raceNegScaleConsistency,
                             SIM_TUNING.raceNegScaleMin, SIM_TUNING.raceNegScaleMax);
      if (roll < 0) roll *= negScale;
    }
    sc += roll * w.chaos;
    let dnfChance = clamp(SIM_TUNING.dnfBase + (100 - car) * SIM_TUNING.dnfCarSlope, 0.02, 0.08) * 0.5;
    if (d.isPlayer) dnfChance *= diff().dnfMult;
    return { id, sc, dnf: rng() < dnfChance, grid: gridPos + 1 };
  });
  const order = [...rows.filter(r => !r.dnf).sort((a, b) => b.sc - a.sc), ...rows.filter(r => r.dnf)];
  order.forEach((r, i) => {
    r.pos = r.dnf ? null : i + 1;
    r.points = (!r.dnf && i < SPRINT_POINTS.length) ? SPRINT_POINTS[i] : 0;
    driverById(r.id).pts += r.points;
  });
  const me = order.find(r => r.id === 'PLAYER');
  S.totals.points += me.points;
  S.totals.sprintPoints = (S.totals.sprintPoints || 0) + me.points;
  S.lastSprint = order.map(({ id, dnf, grid, pos, points }) => ({ id, dnf, grid, pos, points }));
    S.sprintDone = true;

  /* v23: gli sprint contano nello storico stagionale */
  const rival = rivalDriver();
  S.seasonLog.push({
    gp: circuit.gp, flag: circuit.flag, isSprint: true,
    grid: me.grid, pos: me.pos, points: me.points,
    dnf: me.dnf, weather: w.name, sc: false, strat: null, fl: false,
    cum: S.player.pts,
    leader: Math.max(...S.drivers.map(d => d.pts)),
    rival: rival ? rival.pts : null
  });
  if (!me.dnf && me.pos) {
    const cs = circuitStatFor(circuit.gp);
    cs.sprints = (cs.sprints || 0) + 1;
  }
}

/* =========================================================================
   ==================== RADIO TEAM =========================================
   ========================================================================= */

const RADIO_STYLES = {
  info:  { color: 'text-slate-200',  bg: '', icon: '📻' },
  good:  { color: 'text-emerald-300', bg: 'bg-emerald-600/10', icon: '✅' },
  warn:  { color: 'text-gold',       bg: 'bg-gold/10',        icon: '⚠️' },
  bad:   { color: 'text-racing',     bg: 'bg-racing/10',      icon: '🚨' }
};

function generateRadio(ctx) {
  const msgs = [];
  const { me, safetyCar } = ctx;
  const totalLaps = 57;
  const rival = rivalDriver();

  msgs.push({
    lap: 1, type: 'info',
    text: rng() < 0.5
      ? "Luci spente, si parte! Occhio alla curva 1."
      : "Buona partenza, mantieni la posizione e gestisci le gomme."
  });

  if (S._snowballActive && S._snowballActive > 0) {
    msgs.push({
      lap: 2, type: 'warn',
      text: `⚖️ Balance of Performance: il tuo dominio in campionato ti penalizza di −${S._snowballActive.toFixed(1)} in questa gara.`
    });
  }

  if (S.quali && S.quali.savedTyres) {
    msgs.push({ lap: 1, type: 'info', text: "💾 Gomme più fresche grazie alla scelta di saltare la Q3." });
  }

  if ((S.setupBonus || 0) < 0) {
    msgs.push({
      lap: irnd(3, 8), type: 'warn',
      text: rng() < 0.5
        ? "L'assetto non funziona bene, la macchina è nervosa. Stai perdendo decimi."
        : "Dobbiamo lavorare sull'assetto, il bilanciamento non è quello giusto."
    });
  }

  /* v22: solo nel flusso simulato (non live) */
  if (!me.dnf && !ctx.live) {
    if (S.player.tyres < 45) {
      msgs.push({ lap: irnd(18, 32), type: 'bad',
        text: rng() < 0.5 ? "🔴 Le gomme sono finite. Prova a resistere fino alla fine."
                          : "🔴 Degrado critico, stai perdendo aderenza. Attenzione." });
    } else if (S.player.tyres < 60) {
      msgs.push({ lap: irnd(18, 32), type: 'warn',
        text: rng() < 0.5 ? "🟡 Degrado in aumento. Gestisci le gomme con cura."
                          : "🟡 Le gomme iniziano a cedere, non spingere troppo adesso." });
    } else {
      msgs.push({ lap: irnd(18, 32), type: 'good', text: "🟢 Gestione gomme ottima, puoi spingere ancora." });
    }
  }

  if (safetyCar) {
    msgs.push({ lap: irnd(10, 42), type: 'warn',
      text: rng() < 0.5 ? "🚨 Safety Car in pista! Approfittane per rientrare ai box."
                        : "🚨 Safety Car! È il momento di un pit stop gratuito." });
  }

  if (rival && !me.dnf) {
    const rivalResult = S.lastRace ? S.lastRace.find(r => r.id === S.rivalId) : null;
    if (rivalResult && !rivalResult.dnf && me.pos && rivalResult.pos) {
      if (me.pos < rivalResult.pos) {
        msgs.push({ lap: irnd(22, 42), type: 'good',
          text: `⚔️ Stai battendo il tuo rivale ${rival.name.split(' ')[0]}! Sei P${me.pos}, lui P${rivalResult.pos}.` });
      } else if (me.pos > rivalResult.pos) {
        msgs.push({ lap: irnd(22, 42), type: 'warn',
          text: `⚔️ ${rival.name.split(' ')[0]} ti sta davanti. Spingi!` });
      }
    }
  }

  const gained = me.grid - (me.pos || 22);
  if (!me.dnf) {
    if (gained >= 6) {
      msgs.push({ lap: irnd(22, 42), type: 'good',
        text: `Rimonta fantastica! +${gained} posizioni, il team è entusiasta.` });
    } else if (gained >= 2) {
      msgs.push({ lap: irnd(22, 42), type: 'good', text: "Stai guadagnando posizioni, continua così." });
    } else if (gained <= -4) {
      msgs.push({ lap: irnd(22, 42), type: 'bad',
        text: "Stai perdendo terreno, spingi di più! Il ritmo non è sufficiente." });
    }
  }

  if (me.dnf) {
    msgs.push({ lap: irnd(8, 45), type: 'bad',
      text: rng() < 0.5
        ? "💥 Problema tecnico, dobbiamo ritirare la vettura. Gara finita."
        : "💥 Guasto meccanico, rientra ai box. Weekend chiuso qui." });
  } else {
    let finalText, finalType;
    if (me.pos === 1) { finalText = "🏆 VITTORIA! Che gara, sei stato impeccabile. Complimenti!"; finalType = 'good'; }
    else if (me.pos <= 3) { finalText = "🍾 Podio conquistato! Ottimo lavoro, il team è soddisfatto."; finalType = 'good'; }
    else if (me.pos <= 10) { finalText = "✅ Zona punti, buon risultato. Analizzeremo i dati."; finalType = 'info'; }
    else if (me.pos <= 15) { finalText = "📊 Fuori dalla top 10, ma gara solida. Dobbiamo migliorare."; finalType = 'info'; }
    else { finalText = "📊 Weekend difficile, analizzeremo gli errori e torneremo più forti."; finalType = 'bad'; }
    msgs.push({ lap: totalLaps, type: finalType, text: finalText });
  }

  msgs.sort((a, b) => a.lap - b.lap);
  return msgs.slice(0, RADIO_LOG_CAP);
}

/* =========================================================================
   ============================ GARA A STINT ===============================
   ========================================================================= */

const wearMultFor = d => d.isPlayer ? clamp(1 - (d.tyres - 55) / 100, 0.6, 1.3) : 1;
const aiPaceMode = () => { const r = rng(); return r < 0.20 ? 'push' : r < 0.85 ? 'normal' : 'save'; };
const liveStandings = L => L.rows.filter(r => !r.dnf).sort((a, b) => (b.sc - a.sc) || (a.grid - b.grid));

function buildRaceLive() {
  const w = S.weather || (S.weather = pickWeather());
  const circuit = CALENDAR[S.round];
  S._snowballActive = 0;

  const rows = S.grid.map((id, gridPos) => {
    const d = driverById(id);
    const car = teamById(d.teamId).car;
    const stratId = d.isPlayer
  ? (S.playerStrategy || pickRandomStrategy(w.name))
  : pickAIStrategy(w.name, circuit.type);
    const strat = applyStrategyEffect(stratId, w.name, circuit.type, d.isPlayer ? d.tyres : 50);
    const pace = car * SIM_TUNING.raceCarWeight + d.ovr * SIM_TUNING.raceOvrWeight;

    let base = pace - gridPos * SIM_TUNING.raceGridPenalty + strat.bonus
             + traitBonus(d.trait, 'race', w.name, circuit.type) + (ROLE_PACE[d.role] || 0);
    if (d.isPlayer) {
      base += (S.setupBonus || 0) + diff().paceBonus;
      if (S.quali && S.quali.savedTyres) base += 1.8;
      const expectedPace = TITLE_THRESHOLD_PER_RACE * S.round;
      if (S.player.pts > expectedPace * SIM_TUNING.snowballThreshold + 5) {
        const penalty = Math.min(SIM_TUNING.snowballMax, (S.player.pts - expectedPace) * SIM_TUNING.snowballSlope);
        base -= penalty;
        S._snowballActive = round1(penalty);
      }
    } else {
      base += rnd(-SIM_TUNING.raceAiFlavorNoise, SIM_TUNING.raceAiFlavorNoise);
    }
    let dnfChance = clamp(
      SIM_TUNING.dnfBase + (100 - car) * SIM_TUNING.dnfCarSlope + (w.chaos - 1) * SIM_TUNING.dnfWeatherSlope,
      SIM_TUNING.dnfMin, SIM_TUNING.dnfMax);
    if (d.isPlayer) {
      const driverError = Math.max(0, (55 - d.consistency)) * 0.0006;
      dnfChance += driverError;
      dnfChance *= diff().dnfMult;
    }

    return { id, base, pace, chaosScale: strat.chaosScale, dnfChance,
             sc: 0, wear: 0, dnf: false, dnfStint: null, grid: gridPos + 1, strat: stratId };
  });

  return {
    stint: 0, rows,
    sc: { happened: false, stint: null, resolved: true },
    pending: 'pace', log: [], ordersDone: false, ordersMateId: null
  };
}

function runStint(L, idx, playerMode) {
  const st = RACE_STINTS[idx];
  const w = S.weather;
  const amp = SIM_TUNING.raceNoise * Math.sqrt(st.weight);

  L.rows.forEach(r => {
    if (r.dnf) return;
    const d = driverById(r.id);
    const mode = PACE_MODES[d.isPlayer ? playerMode : aiPaceMode()] || PACE_MODES.normal;

    let inc = r.base * st.weight + mode.bonus;
    r.wear = clamp(r.wear + mode.wear * wearMultFor(d), 0, 100);
    if (r.wear > WEAR_PENALTY_START) inc -= (r.wear - WEAR_PENALTY_START) * WEAR_PENALTY_SLOPE;

    let roll = rnd(-amp, amp);
    if (d.isPlayer) {
      const negScale = clamp(1 - (d.consistency - 50) * SIM_TUNING.raceNegScaleConsistency,
                             SIM_TUNING.raceNegScaleMin, SIM_TUNING.raceNegScaleMax);
      if (roll < 0) roll *= negScale;
    }
    inc += roll * w.chaos * r.chaosScale;
    r.sc += inc;

    const risk = r.dnfChance * st.weight + (d.isPlayer ? mode.risk : 0);
    if (rng() < Math.max(0, risk)) { r.dnf = true; r.dnfStint = idx; }
  });

  const last = RACE_STINTS.length - 1;
  const newDnf = L.rows.some(r => r.dnf && r.dnfStint === idx);
  if (newDnf && !L.sc.happened && rng() < SIM_TUNING.scProbability) {
    L.sc = { happened: true, stint: idx, resolved: idx === last };
    applySafetyCarToField(L);
  }
}

function applySafetyCarToField(L) {
  const alive = L.rows.filter(r => !r.dnf);
  if (alive.length < 2) return;
  const vals = alive.map(r => r.sc);
  const maxSc = Math.max(...vals), minSc = Math.min(...vals);
  const range = maxSc - minSc || 1;
  alive.forEach(r => {
    const d = driverById(r.id);
    r.sc = minSc + ((r.sc - minSc) / range) * range * SIM_TUNING.scLiveCompaction
         + rnd(-SIM_TUNING.scNoise, SIM_TUNING.scNoise);
    if (!d.isPlayer) {
      if (rng() < 0.5) { r.wear = Math.max(0, r.wear - SC_PIT_WEAR_RELIEF); r.sc -= SC_PIT_COST; }
      else r.sc += SC_STAY_BONUS;
    }
  });
}

function liveRadioAfterStint(L, idx) {
  const st = RACE_STINTS[idx];
  const me = L.rows.find(r => r.id === 'PLAYER');
  if (me.dnf) return;
  if (me.wear > WEAR_PENALTY_START)
    L.log.push({ lap: st.lapTo, type: 'bad',  text: '🔴 Gomme al limite: il degrado ti sta costando tempo.' });
  else if (me.wear > 35)
    L.log.push({ lap: st.lapTo, type: 'warn', text: '🟡 Le gomme sono usurate, valuta come gestirle.' });
}

function maybeTeamOrders(L) {
  if (L.stint !== 2 || L.ordersDone) return false;
  const mate = teammate();
  if (!mate || S.player.role !== ROLE_SECOND || mate.role !== ROLE_FIRST) return false;
  const me = L.rows.find(r => r.id === 'PLAYER'), m = L.rows.find(r => r.id === mate.id);
  if (!me || !m || m.dnf || me.sc <= m.sc) return false;
  if (rng() >= 0.6) return false;
  L.ordersDone = true; L.ordersMateId = mate.id;
  return true;
}

function stepStint(L, modeId) {
  runStint(L, L.stint, modeId);
  liveRadioAfterStint(L, L.stint);
  L.stint++;
  const me = L.rows.find(r => r.id === 'PLAYER');
  if (L.stint >= RACE_STINTS.length) { L.pending = null; return; }
  if (me.dnf)                          { L.pending = 'auto'; return; }
  if (L.sc.happened && !L.sc.resolved) { L.pending = 'sc'; return; }
  L.pending = maybeTeamOrders(L) ? 'orders' : 'pace';
}

function resolveLiveSC(L, choice) {
  const me = L.rows.find(r => r.id === 'PLAYER');
  const lap = RACE_STINTS[L.sc.stint].lapTo;
  if (choice === 'pit') {
    me.wear = Math.max(0, me.wear - SC_PIT_WEAR_RELIEF);
    me.sc -= SC_PIT_COST;
    L.log.push({ lap, type: 'info', text: '🛞 Rientro sotto Safety Car: gomme nuove, un po\' di terreno perso.' });
  } else {
    me.sc += SC_STAY_BONUS;
    L.log.push({ lap, type: 'info', text: '🏎️ Resti in pista: guadagni posizione ma le gomme sono già provate.' });
  }
  L.sc.resolved = true;
  L.pending = 'pace';
}

function autoRunLive(L) {
  let guard = 0;
  while (L.stint < RACE_STINTS.length && guard++ < 10) {
    const me = L.rows.find(r => r.id === 'PLAYER');
    if (L.pending === 'sc') resolveLiveSC(L, me.wear > 28 ? 'pit' : 'stay');
    if (L.pending === 'orders') L.pending = 'pace';
    stepStint(L, 'normal');
    if (L.pending === 'auto') continue;
  }
}

function finalizeRace(L) {
  const w = S.weather;
  const safetyCar = L.sc.happened;

  const finish = L.rows.filter(r => !r.dnf).sort((a, b) => b.sc - a.sc);
  const out    = L.rows.filter(r => r.dnf).sort((a, b) => b.dnfStint - a.dnfStint);

  const leaderSc = finish.length ? finish[0].sc : 0;
  finish.forEach((r, i) => { r.gap = i === 0 ? 0 : round3((leaderSc - r.sc) * SIM_TUNING.gapFactor); });
  if (safetyCar && finish.length > 1) {
    const maxGap = finish[finish.length - 1].gap;
    const capTarget = rnd(SIM_TUNING.scGapCapMin, SIM_TUNING.scGapCapMax);
    if (maxGap > capTarget) { const k = capTarget / maxGap; finish.forEach(r => { r.gap = round3(r.gap * k); }); }
  }
  out.forEach(r => { r.gap = null; });
  const order = [...finish, ...out];

  let flId = null, bestV = -Infinity;
  finish.forEach(r => {
    const v = r.pace + rnd(-4, 4) + (100 - r.wear) * 0.03;
    if (v > bestV) { bestV = v; flId = r.id; }
  });

  order.forEach((r, i) => {
    const d = driverById(r.id);
    r.pos = r.dnf ? null : i + 1;
    r.points = (!r.dnf && i < 10) ? POINTS[i] : 0;
    r.fl = r.id === flId;
    if (r.fl && FASTEST_LAP_POINT && r.pos && r.pos <= 10) r.points += 1;
    d.pts += r.points;
    if (r.dnf) d.dnf++;
    if (r.pos === 1) d.wins++;
    if (r.pos && r.pos <= 3) d.podiums++;
    if (r.pos && r.pos <= 10) {
      if (!d.fin || d.fin.length < 10) d.fin = newFin();
      d.fin[r.pos - 1]++;
    }
    if (r.fl) d.fl = (d.fl || 0) + 1;
  });

  S.lastRace = order.map(r => ({
    id: r.id, dnf: r.dnf, grid: r.grid, strat: r.strat,
    gap: r.gap, pos: r.pos, points: r.points, fl: r.fl
  }));
  S.lastSafetyCar = safetyCar;
  const flRow = S.lastRace.find(r => r.fl);
  S.lastFastestLap = flRow ? { id: flRow.id, awarded: !!(FASTEST_LAP_POINT && flRow.pos && flRow.pos <= 10) } : null;

  const me = S.lastRace.find(r => r.id === 'PLAYER');
  const race = CALENDAR[S.round];
  const rival = rivalDriver();
  S.seasonLog.push({
    gp: race.gp, flag: race.flag, grid: me.grid, pos: me.pos, points: me.points,
    dnf: me.dnf, weather: w.name, sc: safetyCar, strat: me.strat, fl: !!me.fl,
    cum: S.player.pts, leader: Math.max(...S.drivers.map(d => d.pts)), rival: rival ? rival.pts : null
  });

  S.totals.races++;
  S.totals.points += me.points;
  if (me.dnf) S.totals.dnf++;
  if (me.pos === 1) S.totals.wins++;
  if (me.pos && me.pos <= 3) S.totals.podiums++;
  if (me.fl) S.totals.fastestLaps = (S.totals.fastestLaps || 0) + 1;
  if (S.telemetry && me.dnf) S.telemetry.dnfCount++;
  recordRaceTelemetry(w.name, safetyCar);

  const cs = circuitStatFor(race.gp);
  cs.races++; cs.points += me.points;
  if (me.dnf) cs.dnf++;
  else {
    cs.finishes++; cs.posSum += me.pos;
    if (cs.bestPos == null || me.pos < cs.bestPos) cs.bestPos = me.pos;
  }
  if (me.pos === 1) cs.wins++;
  if (me.pos && me.pos <= 3) cs.podiums++;

  /* aggiorna rivalità PRIMA di S.round++ */
  updateRivalryAfterRace(S.lastRace);
  updateMateTension(S.lastRace);

  /* radio unificata */
  S.radioLog = [...L.log, ...generateRadio({ me, safetyCar, w, live: true })]
    .sort((a, b) => a.lap - b.lap).slice(0, RADIO_LOG_CAP);

  if (S.sponsor && !S.sponsor.completed && S.sponsor.type !== 'title') {
    const qualifies = (S.sponsor.type === 'top10' && me.pos && me.pos <= 10)
                   || (S.sponsor.type === 'podium' && me.pos && me.pos <= 3);
    if (qualifies) {
      S.sponsor.progress++;
      if (S.sponsor.progress >= S.sponsor.target) {
        S.sponsor.completed = true;
        S.budget += S.sponsor.reward;
        S.sponsor.justCompleted = true;
      }
    }
  }

  S.round++;
  S.raceLive = null;
  S.sprintDone = false;
  if (S.round % RD_BLOCK === 0 && S.round < CALENDAR.length) {
    S.rdOpen = true; S.rdDone = 0;
    processAIRDActivity(teamStandings(), true);
  }
}

function simRace() {
  const L = buildRaceLive();
  autoRunLive(L);
  finalizeRace(L);
}

function goRace() {
  S.raceLive = buildRaceLive();
  S.screen = 'raceLive';
  save(); render();
}

function completeLiveRace(L) {
  finalizeRace(L);
  S.screen = 'race';
  save(); render();
  if (S.sponsor && S.sponsor.justCompleted) {
    toast('💰 Obiettivo sponsor raggiunto! +' + S.sponsor.reward + ' M$', 'good');
    S.sponsor.justCompleted = false; save();
  }
}

function chooseLivePace(modeId) {
  const L = S.raceLive;
  if (!L || L.pending !== 'pace' || !PACE_MODES[modeId]) return;
  const st = RACE_STINTS[L.stint];
  L.log.push({ lap: st.lapFrom, type: 'info', text: PACE_MODES[modeId].icon + ' ' + st.name + ': ' + PACE_MODES[modeId].name + '.' });
  stepStint(L, modeId);
  if (L.stint >= RACE_STINTS.length) return completeLiveRace(L);
  if (L.pending === 'auto') { autoRunLive(L); return completeLiveRace(L); }
  save(); render();
}

function chooseLiveSC(choice) {
  const L = S.raceLive;
  if (!L || L.pending !== 'sc') return;
  resolveLiveSC(L, choice === 'pit' ? 'pit' : 'stay');
  if (maybeTeamOrders(L)) L.pending = 'orders';
  save(); render();
}

function chooseLiveOrders(choice) {
  const L = S.raceLive;
  if (!L || L.pending !== 'orders') return;
  const me = L.rows.find(r => r.id === 'PLAYER');
  const mate = L.rows.find(r => r.id === L.ordersMateId);
  const lap = RACE_STINTS[1].lapTo;
  if (choice === 'obey' && mate) {
    const tmp = me.sc; me.sc = mate.sc; mate.sc = tmp;
    S.mateTension = clamp(S.mateTension - 10, 0, 100);
    S.reputation  = clamp(S.reputation + 1, 0, 100);
    L.log.push({ lap, type: 'warn', text: '📻 Ordine di scuderia: lasci passare il compagno. Il box apprezza.' });
  } else {
    S.mateTension = clamp(S.mateTension + 15, 0, 100);
    S.reputation  = clamp(S.reputation - 1, 0, 100);
    L.log.push({ lap, type: 'bad', text: '📻 Ignori l\'ordine di scuderia. Il muretto non è contento.' });
  }
  L.pending = 'pace';
  save(); render();
}

function autoFinishLive() {
  const L = S.raceLive;
  if (!L) return;
  autoRunLive(L);
  completeLiveRace(L);
}

function viewRaceLive() {
  const L = S.raceLive;
  const r = CALENDAR[S.round];
  const st = RACE_STINTS[Math.min(L.stint, RACE_STINTS.length - 1)];
  const order = liveStandings(L);
  const me = L.rows.find(x => x.id === 'PLAYER');
  const myPos = order.findIndex(x => x.id === 'PLAYER') + 1;
  const ahead  = myPos > 1 ? order[myPos - 2] : null;
  const behind = (myPos > 0 && myPos < order.length) ? order[myPos] : null;
  const gapTxt = o => o ? (Math.abs(o.sc - me.sc) * SIM_TUNING.gapFactor).toFixed(1) + 's' : '—';
  const start = clamp(myPos - 4, 0, Math.max(0, order.length - 7));
  const slice = order.slice(start, start + 7);
  const wearColor = me.wear > WEAR_PENALTY_START ? '#e10600' : me.wear > 35 ? '#ffd447' : '#00594f';
  const mate = L.ordersMateId ? driverById(L.ordersMateId) : null;

  let decision = '';
  if (L.pending === 'pace') {
    decision = `
      <div class="text-[11px] uppercase tracking-wider text-slate-400 mb-2">Ritmo per lo ${esc(st.name)} (giri ${st.lapFrom}–${st.lapTo})</div>
      <div class="space-y-2">
        ${Object.values(PACE_MODES).map(m => `
          <button type="button" data-action="live-pace" data-mode="${esc(m.id)}"
            class="w-full text-left p-4 rounded-2xl bg-carbon2 neon-soft border-2 border-transparent hover:border-racing active:scale-[.98] transition">
            <div class="flex items-center gap-3">
              <div class="text-2xl">${m.icon}</div>
              <div class="flex-1 min-w-0">
                <div class="font-black">${esc(m.name)}</div>
                <div class="text-[12px] text-slate-400">${esc(m.desc)}</div>
              </div>
            </div>
          </button>`).join('')}
      </div>`;
  } else if (L.pending === 'sc') {
    decision = `
      <div class="rounded-2xl p-4 mb-3 bg-gold/10 border border-gold/40 text-sm text-gold font-semibold">🚨 Safety Car! Il gruppo si compatta: cosa fai?</div>
      <div class="space-y-2">
        <button type="button" data-action="live-sc" data-choice="pit"
          class="w-full text-left p-4 rounded-2xl bg-carbon2 neon-soft border-2 border-transparent hover:border-racing active:scale-[.98] transition">
          <div class="font-black">🛞 Rientra ai box</div>
          <div class="text-[12px] text-slate-400">Gomme fresche, ma perdi un po' di posizione in pista.</div>
        </button>
        <button type="button" data-action="live-sc" data-choice="stay"
          class="w-full text-left p-4 rounded-2xl bg-carbon2 neon-soft border-2 border-transparent hover:border-racing active:scale-[.98] transition">
          <div class="font-black">🏎️ Resta in pista</div>
          <div class="text-[12px] text-slate-400">Guadagni posizione, ma le gomme restano quelle che sono.</div>
        </button>
      </div>`;
  } else if (L.pending === 'orders' && mate) {
    decision = `
      <div class="rounded-2xl p-4 mb-3 bg-racing/10 border border-racing/40 text-sm">
        📻 <b>Ordine di scuderia:</b> il box chiede di lasciar passare ${esc(mate.name)} (Prima Guida).
      </div>
      <div class="space-y-2">
        <button type="button" data-action="live-orders" data-choice="obey"
          class="w-full text-left p-4 rounded-2xl bg-carbon2 neon-soft border-2 border-transparent hover:border-racing active:scale-[.98] transition">
          <div class="font-black">🤝 Obbedisci</div>
          <div class="text-[12px] text-slate-400">Perdi la posizione, ma cala la tensione e il team ti apprezza.</div>
        </button>
        <button type="button" data-action="live-orders" data-choice="ignore"
          class="w-full text-left p-4 rounded-2xl bg-carbon2 neon-soft border-2 border-transparent hover:border-racing active:scale-[.98] transition">

  return `

        <div class="bg-carbon3 rounded-lg py-1.5">Davanti <b class="text-slate-200">${gapTxt(ahead)}</b></div>
        <div class="bg-carbon3 rounded-lg py-1.5">Dietro <b class="text-slate-200">${gapTxt(behind)}</b></div>
      </div>
      <div class="mt-3">${bar('Usura gomme', Math.round(me.wear), wearColor)}</div>

    <div class="bg-carbon2 rounded-2xl neon-soft overflow-hidden mb-4">

        ${slice.map(o => {

          const isRival = d.id === S.rivalId;
          return `<div class="flex items-center gap-3 px-4 py-2 ${d.isPlayer ? 'bg-racing/15' : isRival ? 'bg-racing/10' : ''}">

          </div>`;
        }).join('')}

    ${decision}

      class="w-full mt-4 py-3 rounded-2xl bg-carbon2 neon-soft text-slate-400 text-sm active:scale-[.98] transition">
      ⏩ Simula il resto in automatico
    </button>
  </div>`;
}

function afterRace() {

  S.setupBonus = 0;
  S.setupLabel = null;
  S.playerStrategy = null;
  S.strategyLabel = null;
  S.lastRegulationInfo = null;
  S.radioLog = [];
  S.quali = null;
  S.reviewingFromStrategy = false;
  S._snowballActive = 0;
  S.forecast = null;
  S.raceLive = null;
  S.lastSprint = null;
  if (S.round >= CALENDAR.length) S.screen = 'seasonEnd';
  else { S.screen = 'hub'; S.tab = S.rdOpen ? 'rd' : 'race'; }
  scheduleSave(0); render();

function quickSeason() {
  askConfirm('Simulare in blocco tutte le gare rimanenti della stagione?', startQuickSeason, { yes: 'Simula' });
}

function startQuickSeason() {
  const totalRaces = CALENDAR.length - S.round;
  if (totalRaces <= 0) return;

  app.innerHTML = `
    <div class="anim min-h-[85vh] flex flex-col justify-center text-center px-6">
      <div class="text-6xl mb-4 pulse-glow">⏩</div>
      <div class="text-xl font-black">Simulazione in corso…</div>
      <div class="text-sm text-slate-400 mt-2" id="qsLabel">0 / ${totalRaces}</div>
      <div class="mt-5 h-2 rounded-full bg-carbon3 overflow-hidden max-w-xs mx-auto w-full">
        <div id="qsProgress" class="h-full rounded-full bg-racing transition-all duration-200" style="width:0%"></div>
      </div>
    </div>`;

  requestAnimationFrame(() => setTimeout(() => _runQuickSeason(totalRaces), 0));
}

async function _runQuickSeason(totalRaces) {
  const carBefore = playerTeam().car;
  const budgetBefore = S.budget;
  let rdWindows = 0;
  let processedRaces = 0;

  try {
    while (S.round < CALENDAR.length) {
      const circuit = CALENDAR[S.round];
      const autoId = circuit.type === 'twisty' ? 'aero' : circuit.type === 'power' ? 'top' : 'bal';
      S.setupBonus = setupBonusFor(autoId, circuit.type, 'Asciutto');
      S.setupLabel = SETUPS.find(s => s.id === autoId).name;

      simQualifying();
      if (isSprintWeekend()) simSprint();

      const stratOpts = pickAvailableStrategies(S.weather.name);
      const autoStrat = stratOpts[irnd(0, stratOpts.length - 1)];
      S.playerStrategy = autoStrat.id;
      S.strategyLabel = autoStrat.name;

      simRace();

      if (S.sponsor && S.sponsor.justCompleted) S.sponsor.justCompleted = false;

      S.setupBonus = 0;
      S.setupLabel = null;
      S.playerStrategy = null;
      S.strategyLabel = null;
      S.radioLog = [];
      S.quali = null;
      S.reviewingFromStrategy = false;
      S._snowballActive = 0;

      if (S.rdOpen) { rdWindows++; autoRD(); }
      processedRaces++;

      if (processedRaces % 4 === 0 && S.round < CALENDAR.length) {
        const label = document.getElementById('qsLabel');
        const barEl = document.getElementById('qsProgress');
        if (label) label.textContent = processedRaces + ' / ' + totalRaces;
        if (barEl) barEl.style.width = ((processedRaces / totalRaces) * 100).toFixed(0) + '%';
        await new Promise(r => setTimeout(r, 0));
      }
    }

    S.lastRegulationInfo = null;
    S.screen = 'seasonEnd';
    save(); render();

    if (rdWindows > 0) {
      const carDelta = round1(playerTeam().car - carBefore);
      const net = Math.round(S.budget - budgetBefore);
      toast('🔧 R&D automatico: ' + rdWindows + ' finestra/e • ' + (carDelta >= 0 ? '+' : '') + carDelta + ' pt vettura • budget ' + (net >= 0 ? '+' : '') + net + ' M$', carDelta >= 0 ? 'good' : 'bad');
    }
  } catch (e) {
    console.error('Errore nella simulazione rapida:', e);
    S.setupBonus = 0;
    S.setupLabel = null;
    S.playerStrategy = null;
    S.strategyLabel = null;
    S.radioLog = [];
    S.quali = null;
    S.reviewingFromStrategy = false;
    S._snowballActive = 0;
    S.screen = 'hub';
    S.tab = 'race';
    save(); render();
    toast('⚠️ Simulazione interrotta: ' + (e && e.message ? e.message : 'errore sconosciuto'), 'bad');
  }
}

function pointsChartSVG() {
  const log = (S.seasonLog || []).filter(l => l.cum != null);
  if (log.length < 2) return '';
  const W = 340, H = 150, P = 26;
  const maxY = Math.max(10, ...log.map(l => Math.max(l.cum, l.leader || 0, l.rival || 0)));
   const X = i => P + (CALENDAR.length > 1 ? (i / (CALENDAR.length - 1)) : 0) * (W - P * 2);
  const Y = v => H - P - (v / maxY) * (H - P * 2);
  const line = (key, color, dash) =>
    `<polyline fill="none" stroke="${color}" stroke-width="2" ${dash ? 'stroke-dasharray="4 3"' : ''}
      points="${log.map((l, i) => X(i).toFixed(1) + ',' + Y(l[key] || 0).toFixed(1)).join(' ')}"/>`;
  return `
  <div class="bg-carbon2 rounded-2xl p-4 neon-soft mb-4">
    <div class="text-[11px] uppercase tracking-wider text-slate-400 mb-2">📈 Punti gara per gara</div>
    <svg viewBox="0 0 ${W} ${H}" class="w-full" role="img" aria-label="Andamento dei punti in stagione">
      <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#2a323d"/>
      <line x1="${P}" y1="${P}" x2="${P}" y2="${H - P}" stroke="#2a323d"/>
      <text x="${P - 4}" y="${P + 4}" fill="#64748b" font-size="9" text-anchor="end">${maxY}</text>
      <text x="${P - 4}" y="${H - P}" fill="#64748b" font-size="9" text-anchor="end">0</text>
      ${log.some(l => l.rival != null) ? line('rival', '#94a3b8', true) : ''}
      ${line('leader', '#ffd447', false)}
      ${line('cum', '#e10600', false)}
    </svg>
    <div class="flex gap-4 text-[11px] text-slate-400 mt-1">
      <span><b style="color:#e10600">━</b> Tu</span><span><b style="color:#ffd447">━</b> Leader</span><span><b style="color:#94a3b8">┅</b> Rivale</span>
    </div>
  </div>`;
}

function seasonSummaryCard() {
    const log = (S.seasonLog || []).filter(l => !l.isSprint);
  if (!log.length) return '';
  const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
  const fin = log.filter(l => !l.dnf);
  const best = fin.length ? fin.reduce((b, l) => (l.pos < b.pos ? l : b), fin[0]) : null;
  const gained = fin.reduce((s, l) => s + (l.grid - l.pos), 0);
  const ppr = arr => arr.length ? (arr.reduce((s, l) => s + l.points, 0) / arr.length).toFixed(1) : '—';
  const dry = log.filter(l => l.weather === 'Asciutto'), wet = log.filter(l => l.weather !== 'Asciutto');
  const cell = (l, v) => `<div class="bg-carbon3 rounded-xl py-2"><div class="text-[9px] uppercase tracking-wider text-slate-400">${l}</div><div class="font-black text-sm">${v}</div></div>`;
  return `
  <div class="bg-carbon2 rounded-2xl p-4 neon-soft mb-4">
    <div class="text-[11px] uppercase tracking-wider text-slate-400 mb-3">🧾 Riepilogo stagionale</div>
    <div class="grid grid-cols-3 gap-2 text-center">
      ${cell('Miglior GP', best ? 'P' + best.pos + ' ' + esc(best.flag) : '—')}
      ${cell('Griglia media', avg(log.map(l => l.grid)).toFixed(1))}
      ${cell('Arrivo medio', fin.length ? 'P' + avg(fin.map(l => l.pos)).toFixed(1) : '—')}
      ${cell('Pos. guadagnate', (gained >= 0 ? '+' : '') + gained)}
      ${cell('Pt/gara asciutto', ppr(dry))}
      ${cell('Pt/gara bagnato', ppr(wet))}
      ${cell('Giri veloci', log.filter(l => l.fl).length)}
      ${cell('Ritiri', log.filter(l => l.dnf).length)}
      ${cell('Gare con SC', log.filter(l => l.sc).length)}
	  ${cell('Punti sprint', S.totals.sprintPoints || 0)}
    </div>
  </div>`;
}

/* =========================================================================
   ========================= STANDINGS HELPERS =============================
   ========================================================================= */

function countback(a, b) {
  const fa = a.fin || [], fb = b.fin || [];
  for (let i = 0; i < 10; i++) {
    const d0 = (fb[i] || 0) - (fa[i] || 0);
    if (d0) return d0;
  }
  return 0;
}

function driverStandings() {
  return [...S.drivers].sort((a, b) => b.pts - a.pts || countback(a, b));
}

function teamStandings() {
  return S.teams.map(t => {
    const ds = S.drivers.filter(d => d.teamId === t.id);
    const fin = newFin().map((_, i) => ds.reduce((s, d) => s + ((d.fin && d.fin[i]) || 0), 0));
    return { ...t, pts: ds.reduce((s, d) => s + d.pts, 0), drivers: ds, fin };
  }).sort((a, b) => b.pts - a.pts || countback(a, b));
}

function playerPos() {
  if (!S || !S.drivers || !S.drivers.length) return '—';
  const idx = driverStandings().findIndex(d => d.isPlayer);
  return idx < 0 ? '—' : idx + 1;
}

/* =========================================================================
   ============================= TRAIT ====================================
   ========================================================================= */

function traitBonus(trait, phase, weatherName, circuitType) {
  switch (trait) {
    case 'rain':   return phase === 'race' ? (weatherName === 'Asciutto' ? -0.5 : 2.0) : 0;
    case 'quali':  return phase === 'quali' ? 1.5 : -0.4;
    case 'racer':  return phase === 'race' ? 1.0 : -1.0;
    case 'street': return circuitType === 'twisty' ? 1.5 : circuitType === 'power' ? -0.5 : 0;
    case 'power':  return circuitType === 'power' ? 1.5 : circuitType === 'twisty' ? -0.5 : 0;
    default:       return 0;
  }
}

function basePace(d) {
  const car = teamById(d.teamId).car;
  const circuit = CALENDAR[S.round];
  let pace = car * SIM_TUNING.qualiCarWeight + d.ovr * SIM_TUNING.qualiOvrWeight;
  pace += traitBonus(d.trait, 'quali', S.weather ? S.weather.name : 'Asciutto', circuit ? circuit.type : 'balanced');
  pace += ROLE_PACE[d.role] || 0;
  if (d.isPlayer) pace += (S.setupBonus || 0) + diff().paceBonus;
  return pace;
}

function debugInvariants() {
  const issues = [];
  const check = (cond, msg) => { if (!cond) issues.push(msg); };
  if (!S) { console.warn('No active state'); return []; }

  check(S.player.ovr >= 30 && S.player.ovr <= 99, 'Player OVR out of range: ' + S.player.ovr);
  check(S.player.age >= 18 && S.player.age <= 60, 'Player age out of range: ' + S.player.age);
  check(S.player.speed >= 30 && S.player.speed <= 99, 'Player speed out of range');
  check(S.player.consistency >= 30 && S.player.consistency <= 99, 'Player consistency out of range');
  check(S.player.tyres >= 30 && S.player.tyres <= 99, 'Player tyres out of range');

  const teamIds = new Set();
  S.teams.forEach(t => {
    check(!teamIds.has(t.id), 'Duplicate team ID: ' + t.id);
    teamIds.add(t.id);
    check(t.car >= 30 && t.car <= 99, 'Team ' + t.id + ' car out of range: ' + t.car);
    check(t.budgetNow >= 0, 'Team ' + t.id + ' budgetNow negative: ' + t.budgetNow);
    const drivers = S.drivers.filter(d => d.teamId === t.id);
    check(drivers.length === 2, 'Team ' + t.id + ' has ' + drivers.length + ' drivers (expected 2)');
  });

  const driverIds = new Set();
  S.drivers.forEach(d => {
    check(!driverIds.has(d.id), 'Duplicate driver ID: ' + d.id);
    driverIds.add(d.id);
    check(d.ovr >= 30 && d.ovr <= 99, 'Driver ' + d.name + ' OVR out of range: ' + d.ovr);
    check(d.age >= 18 && d.age <= 60, 'Driver ' + d.name + ' age out of range: ' + d.age);
    check(teamIds.has(d.teamId), 'Driver ' + d.name + ' has invalid teamId: ' + d.teamId);
    check(d.pts >= 0, 'Driver ' + d.name + ' has negative points');
  });

  check(Number.isInteger(S.round) && S.round >= 0 && S.round <= CALENDAR.length, 'Invalid round: ' + S.round);
  check(S.budget >= 0, 'Player budget negative: ' + S.budget);
  check(Number.isInteger(S.rngState) && S.rngState >= 0 && S.rngState <= 0xFFFFFFFF, 'Invalid RNG state');

  if (S.rivalId) {
    check(S.drivers.some(d => d.id === S.rivalId), 'rivalId punta a pilota inesistente: ' + S.rivalId);
    const r = S.drivers.find(d => d.id === S.rivalId);
    check(r && r.teamId !== S.player.teamId, 'rivalId è nel team del player');
  }

  try { JSON.stringify(S); } catch (e) { issues.push('State not serializable: ' + e.message); }

  if (issues.length === 0) console.log('✅ Tutti gli invarianti OK');
  else {
    console.warn('❌ ' + issues.length + ' violazioni:');
    issues.forEach(i => console.warn('  • ' + i));
  }
  return issues;
}

const TESTS = [];
function test(name, fn) { TESTS.push({ name, fn }); }
function assert(c, m) { if (!c) throw new Error(m || 'asserzione fallita'); }
function assertEq(a, b, m) {
  if (a !== b) throw new Error((m || 'uguaglianza') + ': ' + JSON.stringify(a) + ' !== ' + JSON.stringify(b));
}
function assertClose(a, b, eps, m) {
  eps = eps == null ? 0.001 : eps;
  if (Math.abs(a - b) > eps) throw new Error((m || 'prossimità') + ': ' + a + ' !~ ' + b);

function runAllTests() {
  const results = [];
  const t0 = performance.now();
  IO_SUSPENDED = true;
  try {
    for (const t of TESTS) {
      try { t.fn(); results.push({ name: t.name, ok: true }); }
      catch (e) { results.push({ name: t.name, ok: false, err: (e && e.message) || String(e) }); }
    }
  } finally {
    IO_SUSPENDED = false;
  }
  const dur = Math.round(performance.now() - t0);
  return { results, dur, passed: results.filter(r => r.ok).length, total: results.length };
}

function renderTestResults(results, passed, total, dur) {
  const allOk = passed === total;
  app.innerHTML = `
    <div class="anim max-w-3xl mx-auto">
      <h1 class="text-3xl font-black mb-2">🧪 Test Suite</h1>
      <p class="text-slate-400 text-sm mb-5">${total} test • ${dur}ms</p>

      <div class="mb-5 p-4 rounded-2xl border ${allOk ? 'bg-emerald-600/15 border-emerald-600/40' : 'bg-racing/15 border-racing/40'}">
        <div class="text-3xl font-black ${allOk ? 'text-emerald-400' : 'text-racing'}">${passed} / ${total}</div>
        <div class="text-sm text-slate-300 mt-1">${allOk ? '✅ Tutti i test passati' : '❌ Alcuni test falliti'}</div>
      </div>

      <div class="space-y-1 max-h-[60vh] overflow-y-auto pr-1">
        ${results.map(r => `
          <div class="flex items-start gap-3 p-3 rounded-xl bg-carbon2">
            <span class="text-lg shrink-0">${r.ok ? '✅' : '❌'}</span>
            <div class="flex-1 min-w-0">
              <div class="text-sm break-words ${r.ok ? 'text-slate-200' : 'text-white font-semibold'}">${esc(r.name)}</div>
              ${r.ok ? '' : `<div class="text-xs text-racing mt-1 break-words font-mono">${esc(r.err || '')}</div>`}
            </div>
          </div>`).join('')}
      </div>

      <button type="button" data-action="menu-back"
        class="mt-5 w-full py-4 rounded-2xl bg-racing neon font-black active:scale-[.98] transition">
        ← Torna al menu
      </button>
    </div>`;
}

/* =========================================================================
   ============================ EVENT DELEGATION ===========================
   ========================================================================= */

let _actionLock = false;
function _dispatchAction(name, dataset, el, event) {
  if (_actionLock) return;
  const fn = ACTIONS[name];
  if (!fn) { console.warn('Azione sconosciuta:', name); return; }
  _actionLock = true;
  try { fn(dataset, el, event); }
  finally { setTimeout(() => { _actionLock = false; }, 120); }
}

const ACTIONS = {
  'menu-back': () => { S = null; render(); },
  'slot-continue': (d) => { CURRENT_SLOT = +d.slot; continueCareer(); },
  'slot-new':      (d) => openCreate(+d.slot),
  'slot-export':   (d) => exportSlot(+d.slot),
  'slot-import':   (d) => { IMPORT_TARGET = +d.slot; document.getElementById('importFile').click(); },
  'slot-wipe':     (d) => askConfirm('Eliminare definitivamente la carriera nello slot ' + d.slot + '?',
                       () => { wipeSlot(+d.slot); render(); }, { yes: 'Elimina', danger: true }),
  'career-abandon': () => {
    askConfirm('Abbandonare la carriera e tornare al menu?\nI progressi sono già salvati.',
      () => { flushSave(true); S = null; render(); }, { yes: 'Esci al menu' });
  },
  'career-wipe-restart': () => { wipeSlot(CURRENT_SLOT); S = null; render(); },
  'career-export': () => exportSlot(CURRENT_SLOT),

  'create-step1': () => createStep1(),
  'create-step2': () => createStep2(),
  'create-step3': () => createStep3(),
  'create-back1': () => { draft.step = 1; renderCreate(); },
  'create-back2': () => { draft.step = 2; renderCreate(); },
  'create-back3': () => { draft.step = 3; renderCreate(); },
  'create-finish': () => createFinish(),
  'create-team': (d) => { draft.teamId = d.teamId; renderCreate(); },
  'create-rival': (d) => { draft.rivalId = d.rivalId; renderCreate(); },
  'create-trait': (d) => { draft.trait = draft.trait === d.trait ? null : d.trait; renderCreate(); },
  'create-diff':  (d) => { syncStep1Draft(); draft.difficulty = d.diff; renderCreate(); },

  'hub-tab': (d) => { S.tab = d.tab; scheduleSave(0); render(); },

  'sponsor-pick': (d) => chooseSponsor(d.sponsorId),
  'rd-run': (d) => doRD(d.pkg, d.strat),
  'rd-close': () => { S.rdOpen = false; scheduleSave(0); render({ resetScroll: false }); },

  'go-setup': () => goSetup(),
  'pick-setup': (d) => chooseSetup(d.setupId),

  'quali-advance': () => advanceQuali(),
  'quali-skip-q3': () => skipQ3(),
  'sprint-continue': () => { S.screen = 'strategy'; save(); render(); },
  'review-quali': () => { S.reviewingFromStrategy = true; S.screen = 'quali'; render(); },

  'pick-strategy': (d) => chooseStrategy(d.stratId),
  'live-pace':   (d) => chooseLivePace(d.mode),
  'live-sc':     (d) => chooseLiveSC(d.choice),
  'live-orders': (d) => chooseLiveOrders(d.choice),
  'live-auto':   () => autoFinishLive(),
  'after-race': () => afterRace(),
  'quick-season': () => quickSeason(),

  'season-end': () => { S.screen = 'seasonEnd'; scheduleSave(0); render(); },
  'season-eval': () => endSeason(),
  'progress-next': () => advanceFromProgress(),
  'market-pick': (d) => confirmAcceptOffer(+d.offerIndex),
  'regulation-pick': (d) => applyPlayerRegulationChoice(d.approachId),
    'rival-keep': () => keepCurrentRival(),
  'rival-switch-pick': (d) => {
    const cand = S.drivers.find(x => x.id === d.rivalId && !x.isPlayer && x.teamId !== S.player.teamId);
    if (!cand) { toast('Rivale non valido', 'bad'); return; }
    askConfirm('Cambiare rivale in ' + cand.name + '?\n\nBilancio carriera mantenuto, storico stagionale azzerato.',
      () => switchRivalTo(d.rivalId), { yes: 'Cambia rivale' });
  },

  'render-retry-hub': () => { if (S) { S.screen = 'hub'; S.tab = 'race'; render(); } else render(); },
  'render-retry-menu': () => { S = null; render(); },

  'attr-slider': (d, el) => {
    const key = d.attrKey;
    if (key !== 'speed' && key !== 'consistency' && key !== 'tyres') return;
    draft[key] = +el.value;
    const v = document.getElementById('v_' + key);
    if (v) v.textContent = el.value;
    const ovr = document.getElementById('ovrPrev');
    if (ovr) ovr.textContent = computeOVR(draft.speed, draft.consistency, draft.tyres);
    const left = document.getElementById('pointsLeft');
    if (left) {
      const rem = draftPool() - (draft.speed + draft.consistency + draft.tyres);
      left.textContent = rem;
      left.className = 'text-2xl font-black ' + (rem < 0 ? 'text-racing' : rem === 0 ? 'text-emerald-400' : 'text-gold');
    }
  },
  'age-slider': (d, el) => {
    const lbl = document.getElementById('ageLbl');
    if (lbl) lbl.textContent = el.value;
    const inp = document.getElementById('fAge');
    if (inp) inp.setAttribute('aria-valuenow', el.value);
  }
};

const LOCKED_ACTIONS = new Set([
  'go-setup','pick-setup','quali-advance','quali-skip-q3','sprint-continue','pick-strategy',
  'live-pace','live-sc','live-orders','live-auto','after-race','season-end','season-eval',
  'progress-next','market-pick','regulation-pick'
]);
let _uiLockUntil = 0;

app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !app.contains(el) || el.disabled) return;
  if (LOCKED_ACTIONS.has(el.dataset.action)) {
    const now = performance.now();
    if (now < _uiLockUntil) return;
    _uiLockUntil = now + 350;
  }
  _dispatchAction(el.dataset.action, el.dataset, el, e);
});

app.addEventListener('input', e => {
  const el = e.target.closest('[data-action-input]');
  if (!el || !app.contains(el)) return;
  _dispatchAction(el.dataset.actionInput, el.dataset, el, e);
});

function activateTab(btn) {
  const id = btn.id;
  btn.click();
  const fresh = id ? document.getElementById(id) : null;
  if (fresh) fresh.focus({ preventScroll: true });
}

app.addEventListener('keydown', e => {
  const tabBtn = e.target.closest('[role="tab"]');
  if (!tabBtn) return;
  const tablist = tabBtn.closest('[data-tablist]');
  if (!tablist) return;
  const tabs = [...tablist.querySelectorAll('[role="tab"]')];
  const idx = tabs.indexOf(tabBtn);
  if (idx < 0) return;

  let next = -1;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (idx + 1) % tabs.length;
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (idx - 1 + tabs.length) % tabs.length;
  else if (e.key === 'Home') next = 0;
  else if (e.key === 'End') next = tabs.length - 1;
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activateTab(tabBtn); return; }
  else return;

  e.preventDefault();
  activateTab(tabs[next]);
});

/* file import */
document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast('File troppo grande', 'bad'); return; }
  const reader = new FileReader();
  reader.onload  = () => importSaveText(String(reader.result), IMPORT_TARGET);
  reader.onerror = () => toast('Lettura del file non riuscita', 'bad');
  reader.readAsText(file);
});

    const { results, passed, total, dur } = runAllTests();

}
