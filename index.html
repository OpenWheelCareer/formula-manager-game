function applyStrategyEffect(stratId, weatherName, circuitType, tyres) {
  let bonus = 0;
  let chaosScale = 1;

  const tyreFactor = clamp(((typeof tyres === 'number' ? tyres : 50) - 50) / 50, -0.5, 1);
  const wearMult = clamp(1 - tyreFactor * 0.7, 0.3, 1.35);

  switch (stratId) {
    case '1stop_soft_hard':
      bonus += 3.8;
      bonus -= 2.5 * wearMult;
      break;
    case '2stop_soft_med_soft':
      bonus += 4.2;
      bonus -= 2.5 * wearMult;
      if (circuitType === 'twisty') bonus -= 2.5;
      break;
    case '1stop_hard_med':
      bonus += 0.3;
      chaosScale = 0.75;
      break;
    case 'inter':
      if (weatherName === 'Variabile') bonus += 4.5;
      else if (weatherName === 'Pioggia') bonus -= 3.0;
      break;
    case 'wet':
      if (weatherName === 'Pioggia') bonus += 4.5;
      else if (weatherName === 'Variabile') bonus -= 6.5;
      break;
  }

  return { bonus, chaosScale };
}

function seedRng(seed = Date.now()) {
  RNG_STATE = (Number(seed) >>> 0) || 0x9e3779b9;
}

function rng() {
  RNG_STATE = (Math.imul(RNG_STATE, 1664525) + 1013904223) >>> 0;
  return RNG_STATE / 4294967296;
}

const rnd    = (a, b) => a + rng() * (b - a);
const irnd   = (a, b) => Math.floor(rnd(a, b + 1));
const clamp  = (v, a, b) => Math.max(a, Math.min(b, v));
const round1 = v => Math.round(v * 10) / 10;
const round3 = v => Math.round(v * 1000) / 1000;

/* =========================================================================
   ============================== UTILITY ==================================
   ========================================================================= */

function sanitizeName(str, max) {
  const limit = Number.isInteger(max) && max > 0 ? max : NAME_MAX;
  return String(str == null ? '' : str)
    .replace(/[\u202A-\u202E\u2066-\u2069\u200B-\u200F\uFEFF]/g, '')
    .replace(/[<>&"'`\\/]/g, '')
    .trim()
    .slice(0, limit)
    .trim();
}

function esc(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function safeColor(c, fallback) {
  const fb = fallback || '#64748b';
  if (typeof c !== 'string') return fb;
  return /^#(?:[0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(c) ? c : fb;
}

/* =========================================================================
   ============================ PERSISTENCE ================================
   ========================================================================= */

let _saveTimer = null;
let _saveDirty = false;

function save() {
  if (!S || IO_SUSPENDED) return false;
  try {
    S.version = SAVE_VERSION;
    S.rngState = RNG_STATE >>> 0;
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    HAS_SAVE_CACHE = true;
    _saveDirty = false;
    return true;
  } catch (e) {
    console.error('Impossibile salvare la carriera:', e);
    if (!SAVE_WARNING_SHOWN) {
      SAVE_WARNING_SHOWN = true;
      try { toast('⚠️ Salvataggio non riuscito: i progressi non saranno persistenti', 'bad'); } catch (_) {}
    }
    return false;
  }
}

function scheduleSave(delay) {
  if (IO_SUSPENDED) return;
  _saveDirty = true;
  if (_saveTimer) return;
  _saveTimer = setTimeout(() => {
    _saveTimer = null;
    if (_saveDirty) save();
  }, typeof delay === 'number' ? delay : 200);
}

/* force=true scrive sempre (chiusura pagina), force=false solo se c'è
   qualcosa di dirty da scrivere (evita write ad ogni alt-tab). */
function flushSave(force) {
  if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
  if (force || _saveDirty) save();
}

function detectSave() {
  try {
    for (const key of [SAVE_KEY, ...LEGACY_SAVE_KEYS]) {
      if (localStorage.getItem(key)) return true;
    }
  } catch (e) {
    console.warn('localStorage non disponibile:', e);
  }
  return false;
}

function defaultRDSkillFor(prestige) {
  return round3(0.5 + (prestige - 50) / 100 * 0.4);
}

function migrateSave(data) {
  if (!data || typeof data !== 'object' || !data.player || !Array.isArray(data.teams) || !Array.isArray(data.drivers)) {
    return null;
  }
  if (data.teams.length === 0 || data.drivers.length === 0) {
    return null;
  }

  const migrated = typeof structuredClone === 'function' ? structuredClone(data) : JSON.parse(JSON.stringify(data));
  const legacyHall = migrated.hallOfFame || [];

  if (!Array.isArray(migrated.hallOfFamePiloti)) {
    migrated.hallOfFamePiloti = legacyHall.map(h => ({
      year: h.year, driverName: h.driverName, driverNat: h.driverNat,
      teamName: h.teamName, teamColor: h.teamColor, playerWon: !!h.playerWon
    }));
  }
  if (!Array.isArray(migrated.hallOfFameCostruttori)) {
    migrated.hallOfFameCostruttori = legacyHall.map(h => ({
      year: h.year, teamName: h.teamName, teamColor: h.teamColor,
      playerTeamWon: !!h.playerWon
    }));
  }
  delete migrated.hallOfFame;

  migrated.version = SAVE_VERSION;
  migrated.round = Number.isInteger(migrated.round) ? clamp(migrated.round, 0, CALENDAR.length) : 0;
  migrated.year = Number.isInteger(migrated.year) ? migrated.year : 2026;
  migrated.budget = Number.isFinite(migrated.budget) ? migrated.budget : 0;
  migrated.pendingBonus = Number.isFinite(migrated.pendingBonus) ? Math.max(0, migrated.pendingBonus) : 0;
  migrated.rdDone = Number.isInteger(migrated.rdDone) ? clamp(migrated.rdDone, 0, 2) : 0;
  migrated.rdLog = Array.isArray(migrated.rdLog) ? migrated.rdLog.slice(0, RD_LOG_CAP) : [];
  migrated.seasonLog = Array.isArray(migrated.seasonLog) ? migrated.seasonLog : [];
  migrated.history = Array.isArray(migrated.history) ? migrated.history.slice(-HISTORY_CAP) : [];
  migrated.sponsorHistory = Array.isArray(migrated.sponsorHistory) ? migrated.sponsorHistory.slice(0, SPONSOR_HISTORY_CAP) : [];
  migrated.rookiePoolUsed = Array.isArray(migrated.rookiePoolUsed) ? migrated.rookiePoolUsed : [];
  migrated.hallOfFamePiloti = Array.isArray(migrated.hallOfFamePiloti) ? migrated.hallOfFamePiloti.slice(-HOF_CAP) : [];
  migrated.hallOfFameCostruttori = Array.isArray(migrated.hallOfFameCostruttori) ? migrated.hallOfFameCostruttori.slice(-HOF_CAP) : [];
  migrated.setupBonus = Number.isFinite(migrated.setupBonus) ? migrated.setupBonus : 0;
  migrated.setupLabel = typeof migrated.setupLabel === 'string' ? migrated.setupLabel : null;
  migrated.playerStrategy = typeof migrated.playerStrategy === 'string' ? migrated.playerStrategy : null;
  migrated.strategyLabel = typeof migrated.strategyLabel === 'string' ? migrated.strategyLabel : null;
  migrated.lastSafetyCar = !!migrated.lastSafetyCar;
  migrated.sponsor = migrated.sponsor && typeof migrated.sponsor === 'object' ? migrated.sponsor : null;
  migrated.sponsorOffers = Array.isArray(migrated.sponsorOffers) ? migrated.sponsorOffers : null;
  migrated.offers = Array.isArray(migrated.offers) ? migrated.offers : null;
  migrated.fired = !!migrated.fired;
  migrated.gameOver = !!migrated.gameOver;
  migrated.retired = !!migrated.retired;
  migrated.totals = {
    seasons: 0, races: 0, wins: 0, podiums: 0, poles: 0, titles: 0, points: 0, dnf: 0,
    ...(migrated.totals || {})
  };

  const telDefault = defaultTelemetry();
  const tel = { ...telDefault, ...((migrated.telemetry && typeof migrated.telemetry === 'object') ? migrated.telemetry : {}) };
  ['constructorTitles', 'driverTitles', 'weatherCounts', 'budgetSumByTeam', 'budgetSamplesByTeam'].forEach(k => {
    if (!tel[k] || typeof tel[k] !== 'object' || Array.isArray(tel[k])) tel[k] = telDefault[k];
  });
  migrated.telemetry = tel;

  if (migrated.sponsor) migrated.sponsor.justCompleted = false;

  migrated.regulationPending = !!migrated.regulationPending;
  migrated.regulationHistory = Array.isArray(migrated.regulationHistory)
    ? migrated.regulationHistory.slice(-REG_HISTORY_CAP)
    : [];
  migrated.regulationSnapshot = (migrated.regulationSnapshot && typeof migrated.regulationSnapshot === 'object')
    ? migrated.regulationSnapshot : null;
  migrated.lastRegulationInfo = (migrated.lastRegulationInfo && typeof migrated.lastRegulationInfo === 'object')
    ? migrated.lastRegulationInfo : null;

  migrated.teams = migrated.teams.map(t => {
    const base = Number.isFinite(t.budget) ? t.budget : 100;
    return {
      ...t,
      color: safeColor(t.color),
      budget: base,
      budgetNow: Number.isFinite(t.budgetNow) ? t.budgetNow : base,
      rdSkill: Number.isFinite(t.rdSkill) ? clamp(t.rdSkill, 0.2, 1.0) : defaultRDSkillFor(t.prestige || 70),
      rdHistory: Array.isArray(t.rdHistory) ? t.rdHistory.slice(0, 20) : [],
      simCharges: Number.isInteger(t.simCharges) ? clamp(t.simCharges, 0, SIM_BUFF_CHARGES) : 0,
      car: Number.isFinite(t.car) ? clamp(t.car, 40, 99) : 70,
      minCar: Number.isFinite(t.minCar) ? t.minCar : 40,
      prestige: Number.isFinite(t.prestige) ? t.prestige : 70
    };
  });

  const p = migrated.player;
  p.id = 'PLAYER';
  p.isPlayer = true;
  p.teamId = p.teamId || migrated.teams[0]?.id;
  p.name = sanitizeName(p.name || ((p.first || 'Player') + ' ' + (p.last || 'One')), FULLNAME_MAX) || 'Player One';
  p.first = sanitizeName(p.first || 'Player');
  p.last = sanitizeName(p.last || 'One');
  p.nat = typeof p.nat === 'string' ? p.nat : '🇮🇹';
  p.age = Number.isFinite(p.age) ? p.age : 19;
  p.speed = Number.isFinite(p.speed) ? clamp(p.speed, 30, 99) : 55;
  p.consistency = Number.isFinite(p.consistency) ? clamp(p.consistency, 30, 99) : 55;
  p.tyres = Number.isFinite(p.tyres) ? clamp(p.tyres, 30, 99) : 55;
  p.speedFrac = Number.isFinite(p.speedFrac) ? clamp(p.speedFrac, -1, 1) : 0;
  p.consFrac  = Number.isFinite(p.consFrac)  ? clamp(p.consFrac,  -1, 1) : 0;
  p.tyresFrac = Number.isFinite(p.tyresFrac) ? clamp(p.tyresFrac, -1, 1) : 0;
  p.ovr = computeOVR(p.speed, p.consistency, p.tyres);
  p.pts = Number.isFinite(p.pts) ? p.pts : 0;
  p.wins = Number.isFinite(p.wins) ? p.wins : 0;
  p.podiums = Number.isFinite(p.podiums) ? p.podiums : 0;
  p.poles = Number.isFinite(p.poles) ? p.poles : 0;
  p.dnf = Number.isFinite(p.dnf) ? p.dnf : 0;
  p.contract = Number.isFinite(p.contract) ? p.contract : 0;
  p.role = typeof p.role === 'string' ? p.role : 'Pilota Titolare';
  p.salary = Number.isFinite(p.salary) ? p.salary : 0;

  migrated.drivers = migrated.drivers.map(d => ({
    ...d,
    pts:     Number.isFinite(d.pts)     ? d.pts     : 0,
    wins:    Number.isFinite(d.wins)    ? d.wins    : 0,
    podiums: Number.isFinite(d.podiums) ? d.podiums : 0,
    poles:   Number.isFinite(d.poles)   ? d.poles   : 0,
    dnf:     Number.isFinite(d.dnf)     ? d.dnf     : 0,
    name:    sanitizeName(d.name, FULLNAME_MAX) || 'Driver',
    nat:     typeof d.nat === 'string' ? d.nat : '🏁',
    teamId:  d.teamId || migrated.teams[0]?.id,
    age:     Number.isFinite(d.age) ? d.age : 22,
    ovr:     Number.isFinite(d.ovr) ? clamp(d.ovr, 1, 99) : 70,
    isPlayer: !!d.isPlayer
  }));

  const validTeamIds = new Set(migrated.teams.map(t => t.id));
  const firstTeamId  = migrated.teams[0]?.id || null;

  if (firstTeamId && !validTeamIds.has(migrated.player.teamId)) {
    migrated.player.teamId = firstTeamId;
  }
  migrated.drivers.forEach(d => {
    if (!validTeamIds.has(d.teamId)) d.teamId = firstTeamId;
  });

  if (!migrated.drivers.some(d => d.isPlayer)) migrated.drivers.push(p);
  else migrated.drivers = migrated.drivers.map(d => d.isPlayer ? p : d);

  const screenNeeds = {
    quali:       () => Array.isArray(migrated.grid) && migrated.grid.length > 0,
    race:        () => Array.isArray(migrated.lastRace) && migrated.lastRace.length > 0,
    strategy:    () => migrated.weather != null,
    setup:       () => migrated.round < CALENDAR.length,
    regulations: () => migrated.regulationPending === true,
    market:      () => Array.isArray(migrated.offers) && migrated.offers.length > 0,
    progress:    () => migrated.progression && typeof migrated.progression === 'object'
  };
  if (screenNeeds[migrated.screen] && !screenNeeds[migrated.screen]()) {
    migrated.screen = 'hub';
    migrated.tab = 'race';
  }
  if (migrated.regulationPending && migrated.screen === 'hub') {
    migrated.screen = 'regulations';
  }

  if (!migrated.regulationPending) {
    migrated.regulationSnapshot = null;
  }

  const rngState = Number.isFinite(migrated.rngState) ? migrated.rngState >>> 0 : 0x9e3779b9;
  migrated.rngState = rngState;
  return migrated;
}

function load() {
  const keys = [SAVE_KEY, ...LEGACY_SAVE_KEYS];
  for (const key of keys) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) continue;
      const parsed = JSON.parse(raw);
      const migrated = migrateSave(parsed);
      if (!migrated) continue;
      RNG_STATE = migrated.rngState >>> 0;
      HAS_SAVE_CACHE = true;
      if (key !== SAVE_KEY) {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(migrated)); }
        catch (e) { console.error('Migrazione salvataggio non completata:', e); }
      }
      return migrated;
    } catch (e) {
      console.error('Salvataggio corrotto o illeggibile su "' + key + '":', e);
    }
  }
  HAS_SAVE_CACHE = false;
  return null;
}

function wipe() {
  try {
    [SAVE_KEY, ...LEGACY_SAVE_KEYS].forEach(key => localStorage.removeItem(key));
    HAS_SAVE_CACHE = false;
    _saveDirty = false;
    if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
    return true;
  } catch (e) {
    console.error('Impossibile eliminare il salvataggio:', e);
    return false;
  }
}

function defaultTelemetry() {
  return {
    seasonsSimulated: 0,
    constructorTitles: {},
    driverTitles: {},
    rookieTitles: 0,
    championOvrSum: 0,
    championOvrCount: 0,
    dnfCount: 0,
    scCount: 0,
    weatherCounts: { Asciutto: 0, Variabile: 0, Pioggia: 0 },
    rdSpendTotal: 0,
    rdSuccessCount: 0,
    rdFailCount: 0,
    transfersCount: 0,
    retirementsCount: 0,
    budgetSumByTeam: {},
    budgetSamplesByTeam: {}
  };
}

function trackSeasonTelemetry(standings, tStandings) {
  if (!S.telemetry) S.telemetry = defaultTelemetry();
  const T = S.telemetry;

  T.seasonsSimulated++;

  const champ = standings[0];
  const ctorChamp = tStandings[0];
  if (champ) {
    T.driverTitles[champ.id] = (T.driverTitles[champ.id] || 0) + 1;
    T.championOvrSum += champ.ovr || 0;
    T.championOvrCount++;
    if (champ.id && champ.id.startsWith('rookie_')) T.rookieTitles++;
  }
  if (ctorChamp) {
    T.constructorTitles[ctorChamp.id] = (T.constructorTitles[ctorChamp.id] || 0) + 1;
  }

  S.teams.forEach(t => {
    const b = Number.isFinite(t.budgetNow) ? t.budgetNow : t.budget;
    T.budgetSumByTeam[t.id] = (T.budgetSumByTeam[t.id] || 0) + b;
    T.budgetSamplesByTeam[t.id] = (T.budgetSamplesByTeam[t.id] || 0) + 1;
  });
}

function recordRaceTelemetry(weatherName, safetyCar) {
  if (!S.telemetry) S.telemetry = defaultTelemetry();
  const T = S.telemetry;
  if (T.weatherCounts && weatherName in T.weatherCounts) T.weatherCounts[weatherName]++;
  else if (T.weatherCounts) T.weatherCounts[weatherName] = 1;
  if (safetyCar) T.scCount++;
}

function newCareer(p) {
  seedRng();

  const teams = TEAM_DB.map(t => ({
    ...t,
    budgetNow: Math.round(t.budget * (0.9 + rng() * 0.2)),
    rdSkill: defaultRDSkillFor(t.prestige),
    rdHistory: [],
    simCharges: 0
  }));

  const drivers = AI_DRIVERS.map(d => ({
    id: d.id, name: d.name, nat: d.nat, teamId: d.team,
    ovr: d.ovr, age: d.age, isPlayer: false,
    pts: 0, wins: 0, podiums: 0, poles: 0, dnf: 0
  }));

  const mates = drivers.filter(d => d.teamId === p.teamId);
  const replaced = mates[mates.length - 1];
  const idx = replaced ? drivers.indexOf(replaced) : -1;
  if (idx >= 0) drivers.splice(idx, 1);

  const player = {
    id: 'PLAYER',
    name: sanitizeName(p.first + ' ' + p.last, FULLNAME_MAX),
    first: sanitizeName(p.first), last: sanitizeName(p.last),
    nat: p.nat,
    teamId: p.teamId,
    age: p.age,
    speed: p.speed, consistency: p.consistency, tyres: p.tyres,
    speedFrac: 0, consFrac: 0, tyresFrac: 0,
    ovr: computeOVR(p.speed, p.consistency, p.tyres),
    isPlayer: true,
    pts: 0, wins: 0, podiums: 0, poles: 0, dnf: 0,
    contract: 2,
    role: 'Pilota Titolare',
    salary: 0
  };
  const insertAt = idx >= 0 ? idx : drivers.length;
  drivers.splice(insertAt, 0, player);

  const career = {
    version: SAVE_VERSION,
    rngState: RNG_STATE,
    screen: 'hub',
    tab: 'race',
    year: 2026,
    round: 0,
    weather: null,
    teams, drivers,
    player,
    grid: null,
    lastRace: null,
    rdOpen: false,
    rdDone: 0,
    budget: teams.find(t => t.id === p.teamId).budgetNow,
    pendingBonus: 0,
    rdLog: [],
    seasonLog: [],
    history: [],
    hallOfFamePiloti: [],
    hallOfFameCostruttori: [],
    setupBonus: 0,
    setupLabel: null,
    playerStrategy: null,
    strategyLabel: null,
    lastSafetyCar: false,
    sponsor: null,
    sponsorOffers: generateSponsorOffers(),
    sponsorHistory: [],
    rookiePoolUsed: [],
    totals: { seasons:0, races:0, wins:0, podiums:0, poles:0, titles:0, points:0, dnf:0 },
    telemetry: defaultTelemetry(),
    offers: null,
    fired: false,
    gameOver: false,
    retired: false,
    regulationPending: false,
    regulationHistory: [],
    regulationSnapshot: null,
    lastRegulationInfo: null
  };
  career.rngState = RNG_STATE >>> 0;
  return career;
}

function computeOVR(speed, cons, tyres) {
  return Math.round(speed * 0.45 + cons * 0.3 + tyres * 0.25);
}

const teamById   = id => S.teams.find(t => t.id === id);
const driverById = id => S.drivers.find(d => d.id === id);
const playerTeam = () => teamById(S.player.teamId);
const teammate   = () => S.drivers.find(d => d.teamId === S.player.teamId && !d.isPlayer);

/* =========================================================================
   =============================== ECONOMY =================================
   ========================================================================= */

function rdOverCapMultiplier(budgetNow) {
  if (typeof budgetNow !== 'number' || budgetNow <= BUDGET_CAP) return 1;
  const overRatio = (budgetNow - BUDGET_CAP) / BUDGET_CAP;
  return 1 + (RD_OVER_CAP_MAX_MULT - 1) * Math.min(1, overRatio);
}

function applyLuxuryTax(rawBudget) {
  if (rawBudget <= BUDGET_CAP) return rawBudget;
  const excess = rawBudget - BUDGET_CAP;
  return BUDGET_CAP + excess * (1 - LUXURY_TAX_RATE);
}

function computeSeasonBudgetForTeam(team, standingPos, numTeams) {
  const base = team.budget;
  const posRatio = numTeams > 1 ? 1 - standingPos / (numTeams - 1) : 1;
  const posBonus = 0.7 + 0.7 * Math.pow(Math.max(0, posRatio), 0.8);
  const prestigeFactor = 0.9 + ((team.prestige || 70) - 65) * 0.006;
  const noise = rnd(0.92, 1.08);

  const raw = Math.max(55, base * posBonus * prestigeFactor * noise);
  const taxed = applyLuxuryTax(raw);
  return Math.round(taxed);
}

function updateTeamBudgetsForNextSeason(tStandings) {
  const numTeams = tStandings.length;
  tStandings.forEach((tStanding, i) => {
    const team = teamById(tStanding.id);
    if (!team) return;
    team.budgetNow = computeSeasonBudgetForTeam(team, i, numTeams);
  });
}

/* =========================================================================
   ============================== R&D SYSTEM ===============================
   ========================================================================= */

function rdEffectiveCost(stratId, teamCar, budgetNow) {
  const s = RD_STRATEGIES[stratId];
  const carFactor = 1 + Math.max(0, teamCar - 65) * 0.02;
  const capMult = rdOverCapMultiplier(budgetNow);
  return Math.round(s.cost * carFactor * capMult);
}

function rdEffectiveFail(stratId, teamCar, teamRdSkill, pkgId, simCharges) {
  const s = RD_STRATEGIES[stratId];
  const pkg = rdPackageById(pkgId);
  const carFactor = Math.max(0, teamCar - 70) * 0.008;
  const skillFactor = (0.7 - (teamRdSkill || 0.6)) * 0.15;
  const buff = (pkg.id !== 'sim' && (simCharges || 0) > 0) ? SIM_BUFF_FAIL_REDUCTION : 0;
  return clamp(s.failChance + carFactor + skillFactor + pkg.failAdd - buff, 0.03, 0.65);
}

function rdEffectiveGain(stratId, teamCar, teamRdSkill, pkgId) {
  const s = RD_STRATEGIES[stratId];
  const pkg = rdPackageById(pkgId);
  const carDiminish = clamp(1 - Math.max(0, teamCar - 65) * 0.012, 0.6, 1);
  const skillMult = 0.85 + (teamRdSkill || 0.6) * 0.35;
  return {
    min: s.gainMin * carDiminish * skillMult * pkg.gainMult,
    max: s.gainMax * carDiminish * skillMult * pkg.gainMult
  };
}

function applyRD(team, stratId, pkgId, { budgetRef = null, logTarget = null, logSuffix = '' } = {}) {
  const strat = RD_STRATEGIES[stratId];
  const currentBudget = budgetRef ? budgetRef.value : (team.budgetNow || 0);
  const actualCost = rdEffectiveCost(stratId, team.car, currentBudget);

  if (currentBudget < actualCost) {
    return { ok: false, reason: 'budget', cost: actualCost };
  }

  const gains = rdEffectiveGain(stratId, team.car, team.rdSkill, pkgId);
  const failChance = rdEffectiveFail(stratId, team.car, team.rdSkill, pkgId, team.simCharges || 0);

  if (budgetRef) budgetRef.value = Math.max(0, budgetRef.value - actualCost);
  else team.budgetNow = Math.max(0, (team.budgetNow || 0) - actualCost);

  if (pkgId === 'sim') team.simCharges = SIM_BUFF_CHARGES;
  else if ((team.simCharges || 0) > 0) team.simCharges--;

  const roll = rng();
  let outcome, delta, text;
  if (roll < failChance) {
    outcome = 'fail';
    delta = -round1(rnd(strat.failMag * 0.3, strat.failMag));
    text = 'Problemi di correlazione: il pacchetto non rende come atteso.';
  } else if (roll < failChance + 0.35) {
    outcome = 'neutral';
    delta = round1(rnd(0, gains.min));
    text = 'Aggiornamento installato, guadagni minimi.';
  } else {
    outcome = 'good';
    delta = round1(rnd(gains.min, gains.max));
    text = 'Ottimo riscontro in pista: la monoposto migliora sensibilmente.';
  }

  if (pkgId === 'sim' && outcome === 'fail') {
    delta = delta / 2;
    text += ' I dati del simulatore hanno limitato i danni.';
  }

  const upperBound = (team.isSatellite && typeof team.maxCar === 'number') ? team.maxCar : 99;
  team.car = round1(clamp(team.car + delta, team.minCar || 40, upperBound));

  if (S.telemetry) {
    S.telemetry.rdSpendTotal += actualCost;
    if (outcome === 'good') S.telemetry.rdSuccessCount++;
    else if (outcome === 'fail') S.telemetry.rdFailCount++;
  }

  const finalText = text + logSuffix;

  if (logTarget === 'player') {
    const pkg = RD_PACKAGES.find(p => p.id === pkgId);
    if (pkg) {
      S.rdLog.unshift({
        year: S.year, round: S.round,
        pkg: pkg.name, icon: pkg.icon,
        strat: strat.name, outcome, delta, text: finalText
      });
      if (S.rdLog.length > RD_LOG_CAP) S.rdLog.length = RD_LOG_CAP;
    }
  } else if (logTarget === 'team') {
    if (!team.rdHistory) team.rdHistory = [];
    team.rdHistory.unshift({ year: S.year, round: S.round, delta, outcome, strat: strat.name });
    if (team.rdHistory.length > 20) team.rdHistory.length = 20;
  }

  return { ok: true, outcome, delta, cost: actualCost, text: finalText, stratName: strat.name };
}

function executeRDAction(team, stratId, pkgId) {
  const res = applyRD(team, stratId, pkgId, { logTarget: 'team' });
  return res.ok
    ? { outcome: res.outcome, delta: res.delta, cost: res.cost, stratName: res.stratName }
    : { outcome: 'skip', delta: 0, cost: 0, stratName: RD_STRATEGIES[stratId].name };
}

function doRD(pkgId, stratId, silent) {
  const team = playerTeam();
  const budgetRef = { value: S.budget };
  const logSuffix = silent ? ' (sviluppo automatico — sim rapida)' : '';
  const res = applyRD(team, stratId, pkgId, { budgetRef, logTarget: 'player', logSuffix });

  if (!res.ok) {
    if (!silent) toast('💸 Budget insufficiente! (' + res.cost + ' M$ richiesti)', 'bad');
    return false;
  }
  S.budget = budgetRef.value;

  S.rdDone++;
  if (S.rdDone >= 2) S.rdOpen = false;

  save();
  if (silent) return true;

  render({ resetScroll: false });
  const outcome = res.outcome;
  toast(
    (outcome === 'good' ? '✅ Sviluppo riuscito ' : outcome === 'neutral' ? '➖ Sviluppo neutro ' : '❌ Sviluppo fallito ') +
    (res.delta >= 0 ? '+' : '') + res.delta + ' pt vettura (' + res.cost + ' M$)',
    outcome === 'good' ? 'good' : outcome === 'neutral' ? 'neutral' : 'bad'
  );
  return true;
}

/* Auto-R&D per la simulazione rapida.
   Strategia: se ha budget per un secondo sviluppo, il primo è il simulatore
   (così sfrutta il buff −10% sul secondo); altrimenti punta diretto al guadagno. */
function autoRD() {
  let guard = 0;
  while (S.rdOpen && S.rdDone < 2 && guard++ < 4) {
    const team = playerTeam();
    const consCost = rdEffectiveCost('cons', team.car, S.budget);
    const balCost  = rdEffectiveCost('bal',  team.car, S.budget);
    const aggCost  = rdEffectiveCost('agg',  team.car, S.budget);

    let stratId = null;
    if (S.budget >= aggCost * 1.2) stratId = 'agg';
    else if (S.budget >= balCost) stratId = 'bal';
    else if (S.budget >= consCost) stratId = 'cons';
    if (!stratId) break;

    const floor = team.minCar || 50;
    let pkgId;

    if (S.rdDone === 0 && (team.simCharges || 0) === 0 && S.budget >= balCost * 2) {
      pkgId = 'sim';
    } else if (S.budget < balCost * 1.6 || team.car <= floor + 6) {
      pkgId = 'chass';
    } else {
      pkgId = (S.rdDone % 2 === 0) ? 'aero' : 'power';
    }

    const ok = doRD(pkgId, stratId, true);
    if (!ok) break;
  }

  S.rdOpen = false;
  S.rdDone = 0;
}

function chooseSponsor(id) {
  const offer = (S.sponsorOffers || []).find(o => o.id === id);
  if (!offer) return;
  S.sponsor = { ...offer, progress: 0, completed: false, justCompleted: false };
  S.sponsorOffers = null;
  save();
  render({ resetScroll: false });
  toast('🤝 Contratto sponsor firmato: ' + offer.name, 'good');
}

/* =========================================================================
   ==================== PLAYER PROGRESSION =================================
   ========================================================================= */
function calculatePlayerProgression(p, mate, pos, wonTitle) {
  const seasonLog = S.seasonLog || [];
  const seasonRaces = seasonLog.length || 1;
  const seasonDnfs  = seasonLog.filter(l => l.dnf).length;
  const dnfRate     = seasonDnfs / seasonRaces;

  const aggressiveIds = new Set(['1stop_soft_hard','2stop_soft_med_soft','inter','wet']);
  const aggressiveUse = seasonLog.filter(l => l.strat && aggressiveIds.has(l.strat)).length;
  const aggRatio      = aggressiveUse / seasonRaces;

  let speedDelta = 0;
  const speedReasons = [];

  if (wonTitle)         { speedDelta += 2.8; speedReasons.push(['Titolo Mondiale conquistato', '+2.8']); }
  else if (pos <= 3)    { speedDelta += 1.6; speedReasons.push(['Podio nel campionato piloti', '+1.6']); }
  else if (pos <= 8)    { speedDelta += 0.9; speedReasons.push(['Stagione di alto livello', '+0.9']); }
  else if (pos <= 14)   { speedDelta += 0.4; speedReasons.push(['Stagione regolare nei punti', '+0.4']); }
  else                  { speedDelta -= 0.3; speedReasons.push(['Gavetta difficile', '-0.3']); }

  if (mate) {
    const diff = p.pts - mate.pts;
    let mult = 1;
    if (mate.ovr < 75) mult = 0.5;
    else if (mate.ovr < 80) mult = 0.75;
    else if (mate.ovr >= 85) mult = 1.4;
    else if (mate.ovr >= 80) mult = 1.1;

    if (diff > 30)       { const v = round1(1.8 * mult); speedDelta += v; speedReasons.push(['Dominio sul compagno', '+' + v]); }
    else if (diff > 0)   { const v = round1(1.0 * mult); speedDelta += v; speedReasons.push(['Compagno battuto', '+' + v]); }
    else if (diff > -25) { speedDelta += 0.3; speedReasons.push(['Buona crescita di squadra', '+0.3']); }
    else                 { speedDelta -= 0.4; speedReasons.push(['Confronto col compagno perso', '-0.4']); }
  }

  let consDelta = 0;
  const consReasons = [];

  if (dnfRate < 0.01)       { consDelta += 2.0;  consReasons.push(['Zero ritiri: affidabilità eccellente', '+2.0']); }
  else if (dnfRate < 0.15)  { consDelta += 1.2;  consReasons.push(['Ritiri contenuti: buona regolarità', '+1.2']); }
  else if (dnfRate < 0.30)  { consDelta += 0.2;  consReasons.push(['Regolarità nella media', '+0.2']); }
  else if (dnfRate < 0.50)  { consDelta -= 0.8;  consReasons.push(['Troppi ritiri: costanza da rivedere', '-0.8']); }
  else                      { consDelta -= 1.8;  consReasons.push(['Stagione piena di ritiri', '-1.8']); }

  if (pos <= 10 && dnfRate < 0.10 && seasonRaces >= 10) {
    consDelta += 0.6;
    consReasons.push(['Alta percentuale di arrivi a punti', '+0.6']);
  }

  let tyreDelta = 0;
  const tyreReasons = [];

  if (aggRatio >= 0.55)      { tyreDelta += 1.0; tyreReasons.push(['Strategie aggressive gestite bene', '+1.0']); }
  else if (aggRatio >= 0.30) { tyreDelta += 0.5; tyreReasons.push(['Uso strategico delle mescole', '+0.5']); }
  else                       { tyreDelta += 0.2; tyreReasons.push(['Approccio conservativo ma pulito', '+0.2']); }

  if (pos <= 10 && seasonRaces >= 10) {
    tyreDelta += 0.4;
    tyreReasons.push(['Costanza nelle gare finali', '+0.4']);
  }

  let resistance = 1;
  if (p.ovr >= 75) {
    const agePenalty = p.age >= 34 ? (p.age - 33) * 0.15 : 0;
    resistance = 1 + (p.ovr - 75) * 0.10 + agePenalty;
    const soften = v => (v > 0 ? v / resistance : v);
    speedDelta = soften(speedDelta);
    consDelta  = soften(consDelta);
    tyreDelta  = soften(tyreDelta);
  }

  let ageMod = 0, ageLabel = null;
  if (p.age <= 24)      { ageMod =  0.8; ageLabel = ['Spinta giovanile ed esordio', '+0.8']; }
  else if (p.age <= 29) { ageMod =  0.4; ageLabel = ['Maturità agonistica', '+0.4']; }
  else if (p.age <= 33) { ageMod = -0.1; ageLabel = ['Stabilità anagrafica', '-0.1']; }
  else if (p.age <= 36) { ageMod = -1.0; ageLabel = ['Inizio declino fisico', '-1.0']; }
  else if (p.age <= 39) { ageMod = -1.8; ageLabel = ['Fase calante di fine carriera', '-1.8']; }
  else                  { ageMod = -3.0; ageLabel = ['Ultimo anno agonistico pesante', '-3.0']; }

  speedDelta += ageMod;
  consDelta  += ageMod * 0.6;
  tyreDelta  += ageMod * 0.4;

  const luck = round1(rnd(-0.2, 0.7));
  speedDelta += luck;

  const reasons = [];
  reasons.push(...speedReasons);
  reasons.push(...consReasons);
  reasons.push(...tyreReasons);
  if (resistance > 1) reasons.push(['Difficile migliorare ad alto livello', '×' + (1 / resistance).toFixed(2)]);
  if (ageLabel) reasons.push(ageLabel);
  reasons.push(['Fattore forma', (luck >= 0 ? '+' : '') + luck]);

  return {
    speedDelta: round1(speedDelta),
    consDelta:  round1(consDelta),
    tyreDelta:  round1(tyreDelta),
    delta:      round1((speedDelta + consDelta + tyreDelta) / 3),
    reasons
  };
}

function applyAttr(current, frac, delta) {
  const total = clamp(current + (frac || 0) + delta, 30, 99);
  const value = Math.round(total);
  return { value, frac: round3(total - value) };
}

function applyPlayerProgression(p, progression) {
  const oldOVR = p.ovr;

  const s = applyAttr(p.speed,       p.speedFrac, progression.speedDelta);
  const c = applyAttr(p.consistency, p.consFrac,  progression.consDelta);
  const t = applyAttr(p.tyres,       p.tyresFrac, progression.tyreDelta);

  p.speed = s.value;       p.speedFrac = s.frac;
  p.consistency = c.value; p.consFrac  = c.frac;
  p.tyres = t.value;       p.tyresFrac = t.frac;

  p.ovr = computeOVR(p.speed, p.consistency, p.tyres);
  return { oldOVR, newOVR: p.ovr };
}

/* =========================================================================
   ==================== TEAM PERFORMANCE EVOLUTION =========================
   ========================================================================= */
function updateTeamPerformance(tStandings) {
  const numTeams = tStandings.length;

  S.teams.forEach(t => {
    const targetMin = t.minCar || 50;
    const upperBound = (t.isSatellite && typeof t.maxCar === 'number') ? t.maxCar : 99;

    const carFactor = clamp(1 - Math.max(0, t.car - 70) * 0.03, 0.4, 1);
    const drift = rnd(-3.0, 3.5) * carFactor;
    const anchorPull = (targetMin - t.car) * 0.07;

    let rubberBand = 0;
    if (!t.isSatellite) {
      const standingPos = tStandings.findIndex(st => st.id === t.id);
      if (standingPos >= 0) {
        const normalizedRank = numTeams > 1 ? standingPos / (numTeams - 1) : 0;
        if (normalizedRank > 0.4) {
          const rubberStrength = (normalizedRank - 0.4) / 0.6;
          rubberBand = rubberStrength * rnd(0.8, 2.4);
          if (rng() < 0.15 * rubberStrength) rubberBand += rnd(1.0, 2.5);
        }
      }
    }

    let regression = 0;
    if (t.car > 88 && !t.isSatellite) {
      regression = -(t.car - 88) * 0.20;
    }

    t.car = round1(clamp(t.car + drift + anchorPull + rubberBand + regression, targetMin, upperBound));
  });
}

/* =========================================================================
   ========================= AI R&D ========================================
   ========================================================================= */
function processAIRDActivity(tStandings, light) {
  const numTeams = tStandings.length;

  S.teams.forEach(team => {
    if (team.id === S.player.teamId) return;

    const standingPos = tStandings.findIndex(st => st.id === team.id);
    const normRank = numTeams > 1 ? standingPos / (numTeams - 1) : 0;

    let actions = 0;
    if (light) {
      actions = rng() < 0.5 ? 1 : 0;
    } else {
      if (team.budgetNow >= 90)       actions = 2 + (rng() < 0.4 ? 1 : 0);
      else if (team.budgetNow >= 60)  actions = 1 + (rng() < 0.6 ? 1 : 0);
      else if (team.budgetNow >= 35)  actions = 1;
      else                            actions = rng() < 0.5 ? 1 : 0;

      if (team.car >= 88 && normRank < 0.25) actions = Math.max(1, actions - 1);
      if (normRank > 0.7) actions += 1;
    }

    for (let i = 0; i < actions; i++) {
      let stratId;
      const r = rng();

      if (normRank > 0.7 && team.budgetNow >= 50) {
        stratId = r < 0.55 ? 'agg' : 'bal';
      } else if (normRank < 0.25 && team.car > 86) {
        stratId = r < 0.7 ? 'cons' : 'bal';
      } else if (team.budgetNow >= 50) {
        stratId = r < 0.4 ? 'bal' : r < 0.7 ? 'agg' : 'cons';
      } else if (team.budgetNow >= 25) {
        stratId = r < 0.6 ? 'cons' : 'bal';
      } else {
        stratId = 'cons';
      }

      const cost = rdEffectiveCost(stratId, team.car, team.budgetNow);
      if (team.budgetNow < cost) continue;

      const balCost = rdEffectiveCost('bal', team.car, team.budgetNow);
      let pkgId;
      if (i === 0 && actions >= 2 && rng() < 0.25) {
        pkgId = 'sim';
      } else if (team.car <= (team.minCar || 50) + 5 || team.budgetNow < balCost * 1.6) {
        pkgId = 'chass';
      } else {
        pkgId = rng() < 0.5 ? 'aero' : 'power';
      }

      executeRDAction(team, stratId, pkgId);
    }
  });
}

/* =========================================================================
   ==================== AI EVOLUTION / TRANSFERS ===========================
   ========================================================================= */
function processAIEvolutionAndRetirements() {
  const survivingDrivers = [];

  S.drivers.forEach(d => {
    if (d.isPlayer) { d.age++; survivingDrivers.push(d); return; }

    d.age++;
    if (d.age >= RETIRE_AGE) {
      if (S.telemetry) S.telemetry.retirementsCount++;
      const newRookie = generateRandomRookie(d.teamId);
      survivingDrivers.push(newRookie);
    } else {
      let driverDelta = 0;
      if (d.age <= 24 && d.ovr >= 87)     driverDelta = rnd(-0.2, 0.8);
      else if (d.age <= 24)               driverDelta = rnd(0.8, 2.5);
      else if (d.age <= 32)               driverDelta = rnd(-0.3, 0.9);
      else                                driverDelta = rnd(-1.2, 0.2);

      d.ovr = Math.round(clamp(d.ovr + driverDelta, 62, 97));
      survivingDrivers.push(d);
    }
  });

  S.drivers = survivingDrivers;
}

function processAITransfers() {
  const aiDrivers = S.drivers.filter(d => !d.isPlayer);
  let transfersCount = 0;
  const maxTransfers = irnd(3, 4);

  const moved = new Set();

  aiDrivers.forEach(d => {
    if (moved.has(d.id)) return;
    if (transfersCount >= maxTransfers) return;

    const currentTeam = teamById(d.teamId);
    if (!currentTeam) return;
    const strandedInFallenTopTeam = d.ovr >= 84 && currentTeam.car < 78;
    const strandedInWeakTeam      = d.ovr >= 83 && currentTeam.car < 75;

    const wantsMove = (strandedInFallenTopTeam && rng() < 0.65)
                   || (!strandedInFallenTopTeam && strandedInWeakTeam && rng() < 0.5);

    if (wantsMove) {
      const topTeams = S.teams.filter(t => t.car >= 84 && t.id !== d.teamId);
      if (topTeams.length > 0) {
        const targetTeam = topTeams[Math.floor(rng() * topTeams.length)];
        const targetTeamDrivers = aiDrivers.filter(td => td.teamId === targetTeam.id && !moved.has(td.id));
        if (targetTeamDrivers.length > 0) {
          const weakestTarget = targetTeamDrivers.slice().sort((a, b) => a.ovr - b.ovr)[0];
          if (weakestTarget && d.ovr > weakestTarget.ovr) {
            moved.add(d.id);
            moved.add(weakestTarget.id);
            const tempTeam = d.teamId;
            d.teamId = targetTeam.id;
            weakestTarget.teamId = tempTeam;
            transfersCount++;
          }
        }
      }
    }
  });

  if (S.telemetry) S.telemetry.transfersCount += transfersCount;
}

function generateRandomRookie(teamId) {
  const baseRookieOvr = irnd(74, 80);

  if (!S.rookiePoolUsed) S.rookiePoolUsed = [];

  const availableIdx = F2_ROOKIE_POOL
    .map((_, idx) => idx)
    .filter(idx => !S.rookiePoolUsed.includes(idx));

  let name, nat;
  if (availableIdx.length > 0) {
    const pick = availableIdx[Math.floor(rng() * availableIdx.length)];
    S.rookiePoolUsed.push(pick);
    name = F2_ROOKIE_POOL[pick].name;
    nat  = F2_ROOKIE_POOL[pick].nat;
  } else {
    const fName = RANDOM_NAMES_FIRST[Math.floor(rng() * RANDOM_NAMES_FIRST.length)];
    const lName = RANDOM_NAMES_LAST[Math.floor(rng() * RANDOM_NAMES_LAST.length)];
    const natPair = NATIONS[Math.floor(rng() * NATIONS.length)];
    name = fName + ' ' + lName;
    nat  = natPair[0];
  }

  return {
    id: 'rookie_' + rng().toString(36).substring(2, 7),
    name: sanitizeName(name, FULLNAME_MAX),
    nat: nat,
    teamId: teamId,
    ovr: baseRookieOvr,
    age: irnd(18, 22),
    isPlayer: false,
    pts: 0, wins: 0, podiums: 0, poles: 0, dnf: 0
  };
}

/* =========================================================================
   ============================ SEASON RECORD ==============================
   ========================================================================= */
function recordSeasonAndHallOfFame(standings, tStandings, pos, wonTitle, mate, progressionResult) {
  const p = S.player;
  const champion = standings[0];
  const championTeam = teamById(champion.teamId);
  const constructorChamp = tStandings[0];
  const constructorColor = safeColor(teamById(constructorChamp.id)?.color);

  S.hallOfFamePiloti.push({
    year: S.year, driverName: champion.name, driverNat: champion.nat,
    teamName: championTeam?.name || '—', teamColor: safeColor(championTeam?.color),
    playerWon: wonTitle
  });
  if (S.hallOfFamePiloti.length > HOF_CAP) {
    S.hallOfFamePiloti = S.hallOfFamePiloti.slice(-HOF_CAP);
  }

  S.hallOfFameCostruttori.push({
    year: S.year, teamName: constructorChamp.name, teamColor: constructorColor,
    playerTeamWon: constructorChamp.id === p.teamId
  });
  if (S.hallOfFameCostruttori.length > HOF_CAP) {
    S.hallOfFameCostruttori = S.hallOfFameCostruttori.slice(-HOF_CAP);
  }

  S.history.push({
    year: S.year,
    team: playerTeam()?.name || '—',
    teamColor: safeColor(playerTeam()?.color),
    pos, points: p.pts, wins: p.wins, podiums: p.podiums, poles: p.poles, dnf: p.dnf,
    ovrStart: progressionResult.oldOVR, ovrEnd: progressionResult.newOVR,
    title: wonTitle, matePts: mate ? mate.pts : 0, mateName: mate ? mate.name : '—',
    champion: champion.name
  });
  if (S.history.length > HISTORY_CAP) {
    S.history = S.history.slice(-HISTORY_CAP);
  }

  S.totals.seasons++;
  if (wonTitle) S.totals.titles++;

  trackSeasonTelemetry(standings, tStandings);
}

/* =========================================================================
   ============================ SEASON FLOW ================================
   ========================================================================= */
function resolveSeasonCareerState(pos) {
  const p = S.player;
  p.contract--;
  S.fired = p.ovr < OVR_FIRE;
  if (S.fired) p.contract = 0;

  if (p.age >= RETIRE_AGE) {
    S.retired = true;
    S.screen = 'retire';
    return;
  }

  if (p.contract <= 0) {
    S.offers = generateOffers(pos);
    if (S.offers.length === 0) {
      S.gameOver = true;
      S.screen = 'gameover';
      return;
    }
    S.screen = 'market';
  } else {
    S.screen = 'progress';
  }
}

function endSeason() {
  const p = S.player;
  const standings = driverStandings();
  const pos = standings.findIndex(d => d.isPlayer) + 1;
  const mate = teammate();
  const champion = standings[0];
  const wonTitle = champion?.isPlayer === true;

  if (!champion) {
    S.gameOver = true;
    S.screen = 'gameover';
    save(); render();
    return;
  }

  if (S.sponsor && !S.sponsor.completed && S.sponsor.type === 'title' && wonTitle) {
    S.sponsor.completed = true;
    S.pendingBonus = (S.pendingBonus || 0) + S.sponsor.reward;
    toast('💰 Sponsor: obiettivo Mondiale raggiunto! +' + S.sponsor.reward + ' M$ nel budget della prossima stagione', 'good');
  }

  const tStandings = teamStandings();
  const progression = calculatePlayerProgression(p, mate, pos, wonTitle);
  const progressionResult = applyPlayerProgression(p, progression);

  recordSeasonAndHallOfFame(standings, tStandings, pos, wonTitle, mate, progressionResult);
  processAIEvolutionAndRetirements();
  processAITransfers();

  processAIRDActivity(tStandings, false);

  updateTeamBudgetsForNextSeason(tStandings);

  updateTeamPerformance(tStandings);

  S.progression = {
    delta: progression.delta,
    speedDelta: progression.speedDelta,
    consDelta:  progression.consDelta,
    tyreDelta:  progression.tyreDelta,
    reasons: progression.reasons,
    oldOVR: progressionResult.oldOVR,
    newOVR: progressionResult.newOVR,
    pos, wonTitle
  };

  resolveSeasonCareerState(pos);
  save();
  render();
}

/* =========================================================================
   ============================== MARKET ===================================
   ========================================================================= */
function generateOffers(lastSeasonPos) {
  const p = S.player;
  const offers = [];

  S.teams.forEach(t => {
    if (S.fired && t.id === p.teamId) return;

    const isTopTeam = t.car >= 84;

    let gap = p.ovr - (t.prestige * 0.4 + t.car * 0.3);
    let interest = gap + rnd(0, 8);

    if (isTopTeam) {
      if (p.ovr >= 82) interest += (p.ovr - 80) * 3;
      else             interest -= 15;
    }

    if (t.id === p.teamId) interest += 12;
    interest += S.totals.titles * 8;

    if (interest > -12) {
      const role   = interest > 12 ? 'Prima Guida' : interest > 4 ? 'Pilota Titolare' : 'Seconda Guida';
      const years  = interest > 12 ? irnd(2, 3) : irnd(1, 2);
      const salary = Math.round(clamp((p.ovr - 45) * 1.5 + t.prestige * 0.25 + interest * 0.6, 1, 75));
      offers.push({ teamId: t.id, role, years, salary, interest: round1(interest) });
    }
  });

  return offers.sort((a, b) => b.interest - a.interest).slice(0, 5);
}

function confirmAcceptOffer(offerIndex) {
  if (!S || !S.offers) return;
  const offer = S.offers[offerIndex];
  if (!offer) return;
  const t = teamById(offer.teamId);
  const msg = 'Firmare con ' + t.name + '?\n\n'
            + offer.role + ' • ' + offer.years + ' stagione/i • ' + offer.salary + ' M$/anno\n\n'
            + 'L\'azione è definitiva.';
  askConfirm(msg, () => acceptOffer(offer), { yes: 'Firma il contratto' });
}

function acceptOffer(offer) {
  const p = S.player;
  const oldTeam = p.teamId;
  const newTeam = offer.teamId;

  if (oldTeam !== newTeam) {
    const targets = S.drivers.filter(d => d.teamId === newTeam && !d.isPlayer);
    const weakest = targets.slice().sort((a, b) => a.ovr - b.ovr)[0];
    if (weakest) weakest.teamId = oldTeam;
    p.teamId = newTeam;
  }

  p.contract = offer.years;
  p.salary = offer.salary;
  p.role = offer.role;

  S.regulationSnapshot = null;
  S.regulationPending = false;

  startNewSeason();
}

function startNewSeason() {
  if (S.sponsor) {
    if (!S.sponsorHistory) S.sponsorHistory = [];
    S.sponsorHistory.unshift({
      year: S.year,
      name: S.sponsor.name,
      completed: S.sponsor.completed,
      reward: S.sponsor.completed ? S.sponsor.reward : 0
    });
    if (S.sponsorHistory.length > SPONSOR_HISTORY_CAP) {
      S.sponsorHistory = S.sponsorHistory.slice(0, SPONSOR_HISTORY_CAP);
    }
  }

  S.year++;
  S.round = 0;
  S.grid = null;
  S.lastRace = null;
  S.seasonLog = [];
  S.weather = null;
  S.rdOpen = true;
  S.rdDone = 0;
  S.offers = null;
  S.fired = false;
  S.setupBonus = 0;
  S.setupLabel = null;
  S.playerStrategy = null;
  S.strategyLabel = null;
  S.lastSafetyCar = false;
  S.sponsor = null;
  S.sponsorOffers = generateSponsorOffers();

  S.regulationSnapshot = null;
  S.teams.forEach(t => { t.simCharges = 0; });

  const pt = playerTeam();

  const carryOver = Math.min(S.budget * BUDGET_CARRYOVER_RATE, BUDGET_CARRYOVER_CAP);
  const bonus = S.pendingBonus || 0;
  S.pendingBonus = 0;
  S.budget = Math.max(0, Math.round((pt.budgetNow || pt.budget) + irnd(-5, 15) + carryOver + bonus));

  S.drivers.forEach(d => { d.pts = 0; d.wins = 0; d.podiums = 0; d.poles = 0; d.dnf = 0; });

  if (S.year % REGULATION_PERIOD === 0) {
    S.regulationPending = true;
    S.regulationSnapshot = null;
    applyRegulationCompression();
    S.screen = 'regulations';
    S.tab = 'race';
    save(); render();
    return;
  }

  S.screen = 'hub';
  S.tab = 'race';
  save(); render();
}

/* =========================================================================
   ====================== REGOLAMENTO TECNICO ==============================
   ========================================================================= */

function applyRegulationCompression() {
  S.regulationSnapshot = {};
  S.teams.forEach(t => {
    const oldCar = t.car;
    const compressed = REGULATION_MEDIAN + (oldCar - REGULATION_MEDIAN) * REGULATION_COMPRESSION;
    const noise = rnd(-REGULATION_NOISE, REGULATION_NOISE);
    const upperBound = (t.isSatellite && typeof t.maxCar === 'number') ? t.maxCar : 99;

    t.car = round1(clamp(compressed + noise, REG_FLOOR, upperBound));

    if (t.minCar > t.car + 2) t.minCar = Math.max(45, t.car - 2);

    S.regulationSnapshot[t.id] = { old: round1(oldCar), compressed: t.car };
  });
}

function pickAIRegulationApproach(team) {
  const b = team.budgetNow || 0;
  const r = rng();

  if (b < 30) {
    if (r < 0.30) return 'scommessa';
    return 'cons';
  }

  if (b >= 100) {
    if (r < 0.50) return 'rev';
    if (r < 0.92) return 'bal';
    return 'cons';
  }
  if (b >= 60) {
    if (r < 0.30) return 'rev';
    if (r < 0.80) return 'bal';
    return 'cons';
  }
  if (r < 0.12) return 'rev';
  if (r < 0.40) return 'scommessa';
  if (r < 0.80) return 'bal';
  return 'cons';
}

function rollRegulationDelta(approachId, team) {
  const strat = REGULATION_STRATEGIES[approachId];
  let delta = rnd(strat.deltaMin, strat.deltaMax);
  let flop = false;
  if (approachId === 'rev' && team.car > REG_FLOP_CAR_THRESHOLD && rng() < REG_FLOP_CHANCE) {
    delta -= rnd(4, 9);
    flop = true;
  }
  return { delta, flop };
}

function processAIRegulationChoices() {
  const summary = [];

  S.teams.forEach(team => {
    if (team.id === S.player.teamId) return;

    let approachId = pickAIRegulationApproach(team);
    let strat = REGULATION_STRATEGIES[approachId];

    if ((team.budgetNow || 0) < strat.cost) {
      approachId = 'cons';
      strat = REGULATION_STRATEGIES.cons;
    }
    const actualCost = Math.min(strat.cost, team.budgetNow || 0);
    team.budgetNow = Math.max(0, (team.budgetNow || 0) - actualCost);

    const { delta, flop } = rollRegulationDelta(approachId, team);

    const upperBound = (team.isSatellite && typeof team.maxCar === 'number') ? team.maxCar : 99;
    team.car = round1(clamp(team.car + delta, REG_FLOOR, upperBound));

    if (team.car < team.minCar) team.minCar = Math.max(45, team.car - 2);

    if (!team.rdHistory) team.rdHistory = [];
    team.rdHistory.unshift({
      year: S.year, round: 0,
      delta: round1(delta),
      outcome: delta > 0.5 ? 'good' : delta < -0.5 ? 'fail' : 'neutral',
      strat: '⚙️ Regolamento ' + strat.name,
      regulation: true,
      flop
    });
    if (team.rdHistory.length > 20) team.rdHistory.length = 20;

    summary.push({
      teamId: team.id,
      teamName: team.name,
      teamColor: safeColor(team.color),
      approach: approachId,
      approachName: strat.name,
      cost: actualCost,
      delta: round1(delta),
      flop
    });
  });

  return summary;
}

function applyPlayerRegulationChoice(approachId) {
  if (!S || !S.regulationPending) return;
  const strat = REGULATION_STRATEGIES[approachId];
  if (!strat) return;

  let actualCost = strat.cost;
  if (S.budget < strat.cost) {
    if (approachId === 'cons') {
      actualCost = Math.min(strat.cost, S.budget);
    } else {
      toast('💸 Budget insufficiente per questo progetto', 'bad');
      return;
    }
  }
  S.budget = Math.max(0, S.budget - actualCost);

  const team = playerTeam();
  const { delta, flop } = rollRegulationDelta(approachId, team);
  const upperBound = (team.isSatellite && typeof team.maxCar === 'number') ? team.maxCar : 99;
  team.car = round1(clamp(team.car + delta, REG_FLOOR, upperBound));
  if (team.car < team.minCar) team.minCar = Math.max(45, team.car - 2);

  const aiSummary = processAIRegulationChoices();

  if (!S.regulationHistory) S.regulationHistory = [];
  S.regulationHistory.push({
    year: S.year,
    approach: approachId,
    approachName: strat.name,
    cost: actualCost,
    delta: round1(delta),
    flop,
    aiSummary
  });
  if (S.regulationHistory.length > REG_HISTORY_CAP) {
    S.regulationHistory = S.regulationHistory.slice(-REG_HISTORY_CAP);
  }

  S.lastRegulationInfo = {
    year: S.year,
    approachName: strat.name,
    delta: round1(delta),
    cost: actualCost,
    flop,
    aiSummary
  };

  S.regulationPending = false;
  S.regulationSnapshot = null;

  S.screen = 'hub';
  S.tab = 'race';

  save();
  render();

  toast(
    (flop ? '💥 ' : delta >= 3 ? '✅ ' : delta >= 0 ? '➖ ' : '⚠️ ') +
    'Regolamento: ' + strat.name + ' (' + (delta >= 0 ? '+' : '') + round1(delta) + ' pt)',
    delta >= 3 ? 'good' : delta < 0 || flop ? 'bad' : 'neutral'
  );
}

const app = document.getElementById('app');

function toast(msg, kind) {
  if (IO_SUSPENDED) return;
  const t = document.getElementById('toast');
  const b = document.getElementById('toastBox');
  b.textContent = msg;
  b.className = 'px-4 py-3 rounded-xl neon-soft text-sm font-semibold ' +
    (kind === 'good' ? 'bg-emerald-600 text-white'
    : kind === 'bad' ? 'bg-racing text-white'
    : 'bg-carbon3 text-slate-100');
  t.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), 2600);
}

let _modalCleanup = null;

function closeModal() {
  if (_modalCleanup) {
    const fn = _modalCleanup;
    _modalCleanup = null;
    fn();
  }
}

function askConfirm(message, onYes, opts) {
  opts = opts || {};
  closeModal();
  const prevFocus = document.activeElement;

  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/70';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-labelledby', 'modalMsg');
  overlay.innerHTML = `
    <div class="anim w-full max-w-sm rounded-2xl bg-carbon2 neon-soft p-5">
      <p id="modalMsg" class="text-sm text-slate-200 whitespace-pre-line">${esc(message)}</p>
      <div class="flex gap-3 mt-5">
        <button type="button" data-modal="no"  class="flex-1 py-3 rounded-xl bg-carbon3 text-slate-300 font-semibold">${esc(opts.no || 'Annulla')}</button>
        <button type="button" data-modal="yes" class="flex-1 py-3 rounded-xl bg-racing neon font-black">${esc(opts.yes || 'Conferma')}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const yesBtn = overlay.querySelector('[data-modal="yes"]');
  const noBtn  = overlay.querySelector('[data-modal="no"]');

  const finish = (result) => {
    closeModal();
    if (!result) return;
    try {
      onYes();
    } catch (e) {
      console.error('Errore nell\'azione di conferma:', e);
      try { toast('⚠️ Azione non completata: ' + (e && e.message ? e.message : 'errore'), 'bad'); } catch (_) {}
    }
  };

  const onKey = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); finish(false); return; }
    if (e.key === 'Tab') {
      e.preventDefault();
      const items = [noBtn, yesBtn];
      const idx = items.indexOf(document.activeElement);
      let next;
      if (idx === -1) next = e.shiftKey ? items.length - 1 : 0;
      else next = (idx + (e.shiftKey ? -1 : 1) + items.length) % items.length;
      items[next].focus();
    }
  };

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) { finish(false); return; }
    const btn = e.target.closest('[data-modal]');
    if (btn) finish(btn.dataset.modal === 'yes');
  });
  document.addEventListener('keydown', onKey, true);

  _modalCleanup = () => {
    document.removeEventListener('keydown', onKey, true);
    overlay.remove();
    if (prevFocus && document.contains(prevFocus) && typeof prevFocus.focus === 'function') {
      try { prevFocus.focus({ preventScroll: true }); } catch (_) {}
    }
  };

  (opts.danger ? noBtn : yesBtn).focus();
}

function createStep1() {
  const f = document.getElementById('fFirst').value.trim();
  const l = document.getElementById('fLast').value.trim();
  if (!f || !l) { toast('Inserisci nome e cognome', 'bad'); return; }
  draft.first = sanitizeName(f);
  draft.last = sanitizeName(l);
  if (!draft.first || !draft.last) { toast('Nome o cognome non validi', 'bad'); return; }
  draft.nat = document.getElementById('fNat').value;
  draft.age = +document.getElementById('fAge').value;
  draft.step = 2;
  renderCreate();
}

function createStep2() {
  const used = draft.speed + draft.consistency + draft.tyres;
  if (used > ATTR_POOL) { toast('Hai superato i punti disponibili', 'bad'); return; }
  draft.step = 3;
  renderCreate();
}

function createFinish() {
  if (!draft.teamId) return;
  S = newCareer(draft);
  S.rdOpen = true;
  save();
  render();
  toast('Benvenuto in F1, ' + S.player.last + '!', 'good');
}

function viewHub() {
  const p = S.player, t = playerTeam();
  const tabs = [
    ['race',  '🏁 Gara'],
    ['stand', '📊 Classifiche'],
    ['rd',    '🔧 R&D'],
    ['career','🏆 Carriera']
  ];
  const pPos = playerPos();

  return `
  <div class="anim">
    <div class="rounded-2xl bg-carbon2 neon-soft overflow-hidden mb-4">
      <div class="h-1.5" style="background:linear-gradient(90deg,${safeColor(t.color)},transparent)"></div>
      <div class="p-4 flex items-center gap-4">
        <div class="text-4xl sm:text-5xl">${esc(p.nat)}</div>
        <div class="flex-1 min-w-0">
          <div class="font-black text-lg sm:text-xl leading-tight truncate">${esc(p.name)}</div>
          <div class="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
            ${teamBadge(t)} <span class="text-slate-600">•</span> ${p.age} anni
            ${p.role ? `<span class="text-slate-600">•</span> <span class="text-slate-300">${esc(p.role)}</span>` : ''}
          </div>
        </div>
        <div class="text-center shrink-0">
          <div class="text-[10px] uppercase tracking-widest text-slate-500">OVR</div>
          <div class="text-3xl sm:text-4xl font-black ${p.ovr >= 85 ? 'text-gold' : p.ovr < OVR_FIRE + 6 ? 'text-racing' : 'text-white'}">${p.ovr}</div>
        </div>
      </div>
      <div class="px-4 pb-4 grid grid-cols-3 gap-3">
        ${bar('VEL', p.speed, '#e10600')}
        ${bar('COS', p.consistency, '#0090ff')}
        ${bar('GOM', p.tyres, '#00594f')}
      </div>
      <div class="px-4 pb-4 grid grid-cols-4 gap-2 text-center">
        ${miniStat('Stagione', S.year)}
        ${miniStat('Punti', p.pts)}
        ${miniStat('Pos.', pPos)}
        ${miniStat('Contratto', p.contract + 'a')}
      </div>
    </div>

    <div class="grid grid-cols-4 gap-2 mb-4 sticky top-2 z-20" role="tablist" aria-label="Sezioni carriera" data-tablist>
      ${tabs.map(([id, lbl]) => `
        <button type="button" role="tab" id="tab-${id}" aria-selected="${S.tab === id}"
          tabindex="${S.tab === id ? 0 : -1}"
          data-action="hub-tab" data-tab="${id}"
          class="tabbtn ${S.tab === id ? 'active' : 'bg-carbon2 text-slate-400'} py-3 rounded-xl text-[11px] sm:text-sm font-bold transition neon-soft">
          ${lbl}
        </button>`).join('')}
    </div>

    <div>${ S.tab === 'race'   ? tabRace()
             : S.tab === 'stand'? tabStandings()
             : S.tab === 'rd'   ? tabRD()
             : tabCareer() }</div>
  </div>`;
}

function miniStat(l, v) {
  return `<div class="bg-carbon3 rounded-xl py-2">
    <div class="text-[9px] uppercase tracking-wider text-slate-400">${l}</div>
    <div class="font-black text-sm">${v}</div>
  </div>`;
}

function tabRace() {
  const done = S.round >= CALENDAR.length;

  if (done) {
    return `
    <div class="anim bg-carbon2 rounded-2xl p-6 neon-soft text-center">
      <div class="text-5xl mb-3">🏁</div>
      <h3 class="text-xl font-black">Stagione ${S.year} conclusa</h3>
      <p class="text-slate-400 text-sm mt-1">È il momento di tirare le somme.</p>
      <button type="button" aria-label="Vedi il bilancio di stagione" data-action="season-end"
        class="mt-5 w-full py-4 rounded-2xl bg-racing neon font-black active:scale-[.98] transition">
        VEDI IL BILANCIO DI STAGIONE →
      </button>
    </div>
  `;
  }

  const r = CALENDAR[S.round];
  const blocked = S.rdOpen;

  return `
  <div class="anim space-y-4">
    ${S.lastRegulationInfo ? `
    <div class="bg-gold/10 border border-gold/40 rounded-2xl p-4">
      <div class="text-[11px] uppercase tracking-wider text-gold font-bold mb-1">⚙️ Nuovo Regolamento Tecnico — Anno ${S.lastRegulationInfo.year}</div>
      <div class="text-sm text-slate-200">Progetto scelto: <b class="text-white">${esc(S.lastRegulationInfo.approachName)}</b></div>
      <div class="text-sm mt-0.5 ${S.lastRegulationInfo.delta >= 0 ? 'text-emerald-400' : 'text-racing'}">
        Effetto vettura: <b>${S.lastRegulationInfo.delta >= 0 ? '+' : ''}${S.lastRegulationInfo.delta} pt</b>
        <span class="text-slate-500">(costo ${S.lastRegulationInfo.cost} M$)</span>
        ${S.lastRegulationInfo.flop ? '<span class="ml-2 text-racing font-bold">💥 flop!</span>' : ''}
      </div>
    </div>` : ''}

    <div class="bg-carbon2 rounded-2xl neon-soft overflow-hidden">
      <div class="p-5">
        <div class="text-[11px] uppercase tracking-[0.25em] text-racing font-bold">Round ${S.round + 1} / ${CALENDAR.length}</div>
        <div class="text-3xl sm:text-4xl font-black mt-1 leading-tight">${esc(r.flag)} GP ${esc(r.gp)}</div>
        <div class="text-slate-400 text-sm">${esc(r.circuit)}</div>
      </div>
      <div class="h-1 bg-carbon3">
        <div class="h-full bg-racing transition-all duration-700" style="width:${(S.round / CALENDAR.length) * 100}%"></div>
      </div>
    </div>

    ${blocked ? `
    <div class="bg-gold/10 border border-gold/40 rounded-2xl p-4 text-sm">
      <span class="font-bold text-gold">🔧 Finestra di sviluppo aperta.</span>
      <span class="text-slate-300">Passa alla scheda R&D prima della gara.</span>
    </div>` : ''}

    <button type="button" aria-label="Simula weekend completo" data-action="go-setup" ${blocked ? 'disabled' : ''}
      class="w-full py-5 rounded-2xl font-black text-lg active:scale-[.98] transition ${blocked ? 'bg-carbon3 text-slate-600' : 'bg-racing neon hover:brightness-110'}">
      ▶ SIMULA WEEKEND COMPLETO
    </button>

    <button type="button" aria-label="Simulazione rapida stagione" data-action="quick-season" ${blocked ? 'disabled' : ''}
      class="w-full py-4 rounded-2xl font-bold neon-soft active:scale-[.98] transition ${blocked ? 'bg-carbon3 text-slate-600' : 'bg-carbon2 hover:bg-carbon3'}">
      ⏩ SIMULAZIONE RAPIDA STAGIONE
      <span class="block text-[11px] font-normal text-slate-500 mt-0.5">Gare rimanenti calcolate in blocco, R&D automatico incluso</span>
    </button>

    ${S.seasonLog.length ? `
    <div class="bg-carbon2 rounded-2xl p-4 neon-soft">
      <div class="text-[11px] uppercase tracking-wider text-slate-400 mb-3">Ultimi risultati</div>
      <div class="space-y-1.5">
        ${S.seasonLog.slice(-5).reverse().map(l => `
          <div class="flex items-center gap-3 text-sm">
            <span>${esc(l.flag)}</span>
            <span class="flex-1 truncate text-slate-300">${esc(l.gp)}</span>
            ${l.sc ? '<span class="text-[10px] text-gold" title="Safety Car">🚨</span>' : ''}
            <span class="text-[11px] text-slate-500">P${l.grid} →</span>
            <span class="font-black ${l.dnf ? 'text-racing' : l.pos <= 3 ? 'text-gold' : 'text-white'}">${l.dnf ? 'DNF' : 'P' + l.pos}</span>
            <span class="w-8 text-right text-xs text-slate-400">${l.points ? '+' + l.points : ''}</span>
          </div>`).join('')}
      </div>
    </div>` : ''}
  </div>`;
}

function tabStandings() {
  const ds = driverStandings();
  const ts = teamStandings();

  return `
  <div class="anim space-y-4">
    <div class="bg-carbon2 rounded-2xl neon-soft overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800 font-black text-sm uppercase tracking-wider">Classifica Piloti</div>
      <div class="divide-y divide-slate-800/60">
        ${ds.map((d, i) => {
          const t = teamById(d.teamId);
          return `
          <div class="flex items-center gap-3 px-4 py-2.5 ${d.isPlayer ? 'bg-racing/15' : ''}">
            <span class="w-6 text-center font-black text-sm ${i === 0 ? 'text-gold' : 'text-slate-500'}">${i + 1}</span>
            <span class="w-1.5 h-6 rounded-sm shrink-0" style="background:${safeColor(t?.color)}"></span>
            <span class="text-base">${esc(d.nat)}</span>
            <span class="flex-1 truncate text-sm ${d.isPlayer ? 'font-black' : 'font-medium text-slate-300'}">${esc(d.name)}</span>
            <span class="text-[10px] text-slate-500 hidden sm:inline">${esc(t?.short || '')}</span>
            <span class="w-8 text-right text-[11px] text-slate-500">${d.ovr}</span>
            <span class="w-10 text-right font-black">${d.pts}</span>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="bg-carbon2 rounded-2xl neon-soft overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800 font-black text-sm uppercase tracking-wider">Classifica Costruttori</div>
      <div class="divide-y divide-slate-800/60">
        ${ts.map((t, i) => {
          const isMine = t.id === S.player.teamId;
          const b = isMine ? S.budget : (t.budgetNow || t.budget);
          const overCap = b > BUDGET_CAP;
          return `
          <div class="flex items-center gap-3 px-4 py-2.5 ${isMine ? 'bg-racing/15' : ''}">
            <span class="w-6 text-center font-black text-sm ${i === 0 ? 'text-gold' : 'text-slate-500'}">${i + 1}</span>
            <span class="w-1.5 h-6 rounded-sm shrink-0" style="background:${safeColor(t.color)}"></span>
            <span class="flex-1 truncate text-sm font-semibold">${esc(t.name)}</span>
            <span class="text-[10px] hidden sm:inline ${overCap ? 'text-racing font-bold' : 'text-slate-500'}">BUD ${Math.round(b)}M$${overCap ? ' ⚠️' : ''}</span>
            <span class="text-[10px] text-slate-500">CAR ${Math.round(t.car)}</span>
            <span class="w-12 text-right font-black">${t.pts}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

function sponsorBox() {
  if (S.sponsor) {
    const pct = Math.min(100, Math.round((S.sponsor.progress / S.sponsor.target) * 100));
    return `
    <div class="bg-carbon2 rounded-2xl p-4 neon-soft">
      <div class="flex items-center justify-between mb-2">
        <div class="text-[11px] uppercase tracking-wider text-slate-400">💼 Sponsor Stagionale</div>
        ${S.sponsor.completed ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-600 text-white font-bold">COMPLETATO</span>' : ''}
      </div>
      <div class="font-black">${esc(S.sponsor.name)}</div>
      <div class="text-[12px] text-slate-400 mb-2">${esc(S.sponsor.desc)}</div>
      <div class="flex justify-between text-[11px] text-slate-500 mb-1">
        <span>Progresso: ${S.sponsor.progress}/${S.sponsor.target}</span>
        <span class="text-gold font-bold">Premio: ${S.sponsor.reward} M$</span>
      </div>
      <div class="h-2 rounded-full bg-carbon3 overflow-hidden">
        <div class="h-full rounded-full transition-all duration-500 ${S.sponsor.completed ? 'bg-emerald-500' : 'bg-gold'}" style="width:${pct}%"></div>
      </div>
    </div>`;
  }

  if (S.sponsorOffers && S.sponsorOffers.length) {
    return `
    <div class="bg-carbon2 rounded-2xl p-4 neon-soft">
      <div class="text-[11px] uppercase tracking-wider text-slate-400 mb-2">💼 Scegli il tuo Sponsor Stagionale</div>
      <div class="space-y-2">
        ${S.sponsorOffers.map(o => `
          <button type="button" data-action="sponsor-pick" data-sponsor-id="${esc(o.id)}"
            class="w-full text-left p-3 rounded-xl bg-carbon3 hover:bg-slate-700 transition active:scale-[.98]">
            <div class="flex justify-between items-center gap-2">
              <span class="font-bold text-sm">${esc(o.name)}</span>
              <span class="text-gold text-xs font-black shrink-0">+${o.reward} M$</span>
            </div>
            <div class="text-[11px] text-slate-400 mt-0.5">${esc(o.desc)}</div>
          </button>`).join('')}
      </div>
    </div>`;
  }

  return '';
}

function tabRD() {
  const t = playerTeam();
  const consCost = rdEffectiveCost('cons', t.car, S.budget);
  const balCost  = rdEffectiveCost('bal',  t.car, S.budget);
  const aggCost  = rdEffectiveCost('agg',  t.car, S.budget);
  const simCharges = t.simCharges || 0;

  const overCapMult = rdOverCapMultiplier(S.budget);
  const isOverCap = S.budget > BUDGET_CAP;

  return `
  <div class="anim space-y-4">
    <div class="bg-carbon2 rounded-2xl p-4 neon-soft">
      <div class="flex items-center justify-between mb-3">
        <div>
          <div class="text-[11px] uppercase tracking-wider text-slate-400">Budget sviluppo</div>
          <div class="text-3xl font-black text-gold">${Math.round(S.budget)} <span class="text-base text-slate-500">M$</span></div>
          <div class="text-[10px] ${isOverCap ? 'text-racing font-bold' : 'text-slate-500'}">Cap: ${BUDGET_CAP} M$</div>
        </div>
        <div class="text-right">
          <div class="text-[11px] uppercase tracking-wider text-slate-400">Monoposto</div>
          <div class="text-3xl font-black" style="color:${safeColor(t.color)}">${Math.round(t.car)}</div>
          <div class="text-[10px] text-slate-500">R&D skill ${(t.rdSkill * 100).toFixed(0)}%</div>
        </div>
      </div>
      ${bar('Prestazione vettura', Math.round(t.car), t.color)}
    </div>

    ${isOverCap ? `
    <div class="bg-racing/10 border border-racing/40 rounded-xl p-3 text-sm">
      <div class="font-bold text-racing">⚠️ Oltre il Budget Cap (${BUDGET_CAP} M$)</div>
      <div class="text-slate-300 mt-1 text-[12px]">
        Costi R&amp;D maggiorati del <b class="text-racing">${Math.round((overCapMult - 1) * 100)}%</b>.
        L'assegnazione di stagione è già stata ridotta dalla <b class="text-racing">luxury tax del ${Math.round(LUXURY_TAX_RATE * 100)}%</b> sull'eccedenza rispetto al cap.
      </div>
    </div>` : ''}

    ${sponsorBox()}

    ${S.rdOpen ? `
      <div class="bg-gold/10 border border-gold/40 rounded-xl p-3 text-sm text-gold font-semibold">
        Finestra aperta — puoi introdurre ${2 - S.rdDone} pacchetto/i.
      </div>

      ${simCharges > 0 ? `
      <div class="bg-emerald-600/15 border border-emerald-600/40 rounded-xl p-3 text-[12px] text-emerald-300 font-semibold">
        🖥️ Correlazione attiva: i prossimi ${simCharges} sviluppo/i hanno −${Math.round(SIM_BUFF_FAIL_REDUCTION * 100)}% di rischio.
      </div>` : ''}

      ${RD_PACKAGES.map(p => {
        const cf = Math.round(rdEffectiveFail('cons', t.car, t.rdSkill, p.id, simCharges) * 100);
        const bf = Math.round(rdEffectiveFail('bal',  t.car, t.rdSkill, p.id, simCharges) * 100);
        const af = Math.round(rdEffectiveFail('agg',  t.car, t.rdSkill, p.id, simCharges) * 100);
        return `
        <div class="bg-carbon2 rounded-2xl p-4 neon-soft">
          <div class="flex items-start gap-3 mb-3">
            <div class="text-2xl">${esc(p.icon)}</div>
            <div class="min-w-0">
              <div class="font-black">${esc(p.name)}</div>
              <div class="text-[12px] text-slate-400">${esc(p.desc)}</div>
              <div class="text-[10px] text-slate-500 mt-0.5">${esc(p.note)}</div>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" aria-label="Conservativa, costo ${consCost} milioni" data-action="rd-run" data-pkg="${esc(p.id)}" data-strat="cons" ${S.budget < consCost ? 'disabled' : ''}
              class="p-2.5 rounded-xl text-center transition active:scale-95 ${S.budget < consCost ? 'bg-carbon3 text-slate-600' : 'bg-carbon3 hover:bg-slate-700'}">
              <div class="text-[11px] font-bold">Conservativa</div>
              <div class="text-[10px] text-slate-500">${consCost} M$</div>
              <div class="text-[9px] mt-1 text-emerald-400">rischio ${cf}%</div>
            </button>
            <button type="button" aria-label="Bilanciata, costo ${balCost} milioni" data-action="rd-run" data-pkg="${esc(p.id)}" data-strat="bal" ${S.budget < balCost ? 'disabled' : ''}
              class="p-2.5 rounded-xl text-center transition active:scale-95 ${S.budget < balCost ? 'bg-carbon3 text-slate-600' : 'bg-carbon3 hover:bg-slate-700'}">
              <div class="text-[11px] font-bold">Bilanciata</div>
              <div class="text-[10px] text-slate-500">${balCost} M$</div>
              <div class="text-[9px] mt-1 text-gold">rischio ${bf}%</div>
            </button>
            <button type="button" aria-label="Aggressiva, costo ${aggCost} milioni" data-action="rd-run" data-pkg="${esc(p.id)}" data-strat="agg" ${S.budget < aggCost ? 'disabled' : ''}
              class="p-2.5 rounded-xl text-center transition active:scale-95 ${S.budget < aggCost ? 'bg-carbon3 text-slate-600' : 'bg-carbon3 hover:bg-slate-700'}">
              <div class="text-[11px] font-bold">Aggressiva</div>
              <div class="text-[10px] text-slate-500">${aggCost} M$</div>
              <div class="text-[9px] mt-1 text-racing">rischio ${af}%</div>
            </button>
          </div>
        </div>`;
      }).join('')}

      <button type="button" data-action="rd-close"
        class="w-full py-3.5 rounded-2xl bg-carbon2 neon-soft text-slate-300 font-bold active:scale-[.98] transition">
        Chiudi la finestra di sviluppo →
      </button>
    ` : `
      <div class="bg-carbon2 rounded-2xl p-6 neon-soft text-center">
        <div class="text-4xl mb-2">🔒</div>
        <div class="font-bold">Nessuna finestra di sviluppo attiva</div>
        <p class="text-sm text-slate-400 mt-1">Si riapre ogni ${RD_BLOCK} gare.</p>
      </div>
    `}

    ${S.rdLog.length ? `
    <div class="bg-carbon2 rounded-2xl p-4 neon-soft">
      <div class="text-[11px] uppercase tracking-wider text-slate-400 mb-3">Storico sviluppi</div>
      <div class="space-y-2.5">
        ${S.rdLog.slice(0, 8).map(l => `
          <div class="flex gap-3 items-start">
            <span class="text-lg">${esc(l.icon)}</span>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-semibold truncate">${esc(l.pkg)} <span class="text-slate-500 font-normal">(${esc(l.strat)})</span></div>
              <div class="text-[11px] text-slate-500">${l.year} • R${l.round} — ${esc(l.text)}</div>
            </div>
            <span class="font-black text-sm ${l.outcome === 'good' ? 'text-emerald-400' : l.outcome === 'neutral' ? 'text-slate-400' : 'text-racing'}">
              ${l.delta >= 0 ? '+' : ''}${l.delta}
            </span>
          </div>`).join('')}
      </div>
    </div>` : ''}
  </div>`;
}

function tabCareer() {
  const T = S.totals;
  const piloti = S.hallOfFamePiloti || [];
  const costruttori = S.hallOfFameCostruttori || [];
  const sponsors = S.sponsorHistory || [];
  const regs = S.regulationHistory || [];

  return `
  <div class="anim space-y-4">
    <div class="bg-carbon2 rounded-2xl p-5 neon-soft">
      <div class="text-center mb-4">
        <div class="text-[11px] uppercase tracking-[0.3em] text-gold">Hall of Fame</div>
        <div class="text-2xl font-black mt-1">${esc(S.player.name)}</div>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center">
        ${bigStat('🏆', T.titles, 'Titoli')}
        ${bigStat('🥇', T.wins, 'Vittorie')}
        ${bigStat('🍾', T.podiums, 'Podi')}
        ${bigStat('⏱️', T.poles, 'Pole')}
        ${bigStat('🏁', T.races, 'GP')}
        ${bigStat('📈', T.points, 'Punti')}
      </div>
      <div class="grid grid-cols-2 gap-2 mt-2 text-center">
        ${bigStat('📅', T.seasons, 'Stagioni')}
        ${bigStat('💥', T.dnf, 'Ritiri')}
      </div>
    </div>

    ${regs.length ? `
    <div class="bg-carbon2 rounded-2xl neon-soft overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800 font-black text-sm uppercase tracking-wider">⚙️ Storico Regolamenti Tecnici</div>
      <div class="divide-y divide-slate-800/60">
        ${[...regs].reverse().map(r => `
          <div class="px-4 py-2.5">
            <div class="flex items-center gap-3">
              <span class="w-12 shrink-0 font-black text-sm text-slate-400">${r.year}</span>
              <div class="flex-1 min-w-0">
                <div class="text-sm font-bold truncate">${esc(r.approachName)} ${r.flop ? '<span class="text-racing">💥</span>' : ''}</div>
                <div class="text-[11px] text-slate-500">Costo ${r.cost} M$</div>
              </div>
              <span class="text-xs font-black ${r.delta > 0 ? 'text-emerald-400' : r.delta < 0 ? 'text-racing' : 'text-slate-500'}">${r.delta >= 0 ? '+' : ''}${r.delta} pt</span>
            </div>
            ${r.aiSummary && r.aiSummary.length ? `

  askConfirm(

    { yes: 'Simula' }
  );
