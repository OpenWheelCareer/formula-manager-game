<style>
  .carbon-bg {
    background-color:#0b0d10;
    background-image:
      linear-gradient(27deg, #15181d 5px, transparent 5px),
      linear-gradient(207deg, #15181d 5px, transparent 5px),
      linear-gradient(27deg, #101317 5px, transparent 5px),
      linear-gradient(207deg, #101317 5px, transparent 5px),
      linear-gradient(90deg, #13161b 10px, transparent 10px),
      linear-gradient(#14171c 25%, #101216 25%, #101216 50%, transparent 50%, transparent 75%, #101216 75%, #101216);
    background-size: 20px 20px;
  }
  .neon { box-shadow: 0 0 0 1px rgba(225,6,0,.35), 0 0 22px -6px rgba(225,6,0,.55); }
  .neon-soft { box-shadow: 0 0 0 1px rgba(255,255,255,.07), 0 10px 30px -12px rgba(0,0,0,.9); }

  @keyframes fadeUp { from { opacity:0; transform: translateY(14px);} to {opacity:1; transform:none;} }
  .anim { animation: fadeUp .35s ease both; }
  @keyframes pulseGlow { 0%,100%{opacity:.55} 50%{opacity:1} }
  .pulse-glow { animation: pulseGlow 1.8s ease-in-out infinite; }
  @keyframes radioIn { from { opacity:0; transform: translateX(-8px); } to { opacity:1; transform:none; } }
  .radio-line { animation: radioIn .3s ease both; }

  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:#0b0d10; }
  ::-webkit-scrollbar-thumb { background:#2a323d; border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover { background:#3a4552; }

  input[type=range] { -webkit-appearance:none; appearance:none; height:8px; border-radius:99px; background:#252c36; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:#e10600; cursor:pointer; box-shadow:0 0 12px rgba(225,6,0,.8); }
  input[type=range]::-moz-range-thumb { width:24px; height:24px; border:0; border-radius:50%; background:#e10600; cursor:pointer; }

  input, select, button { font-size:16px; }
  html { -webkit-text-size-adjust:100%; }

  #app {
    padding-left: max(0.75rem, env(safe-area-inset-left, 0.75rem));
    padding-right: max(0.75rem, env(safe-area-inset-right, 0.75rem));
    padding-bottom: max(7rem, calc(env(safe-area-inset-bottom, 0px) + 7rem));
  }

  .tabbtn.active { background:#e10600; color:#fff; box-shadow:0 0 18px -4px rgba(225,6,0,.9); }

  button:focus-visible { outline: 2px solid #e10600; outline-offset: 2px; }

  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: '▸ '; display: inline-block; transition: transform .2s; }
  details[open] > summary::before { content: '▾ '; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .pulse-glow { animation: none !important; opacity: 1 !important; }
    .radio-line { animation: none !important; }
  }
</style>
</head>

function setupBonusFor(setupId, circuitType, weatherName) {
  const s = SETUPS.find(x => x.id === setupId);
  if (!s) return 0;
  if (s.weatherBonus) return s.weatherBonus[weatherName] ?? 0;
  if (s.good === null) return 1;
  if (circuitType === s.good) return 3;
  if (circuitType === s.bad) return -2;
  return 0;
}

function setupHint(s, circuitType) {
  if (s.weatherBonus) return { label: t('setup.hint_weather'), cls: 'text-slate-400' };
  const b = setupBonusFor(s.id, circuitType);
  if (b >= 3) return { label: t('setup.hint_ideal'),   cls: 'text-emerald-400' };
  if (b === 1) return { label: t('setup.hint_safe'),   cls: 'text-slate-300' };
  if (b < 0)  return { label: t('setup.hint_bad'),     cls: 'text-racing' };
  return { label: t('setup.hint_neutral'), cls: 'text-slate-400' };
}
/* Estrae la temperatura asfalto del weekend dal range del circuito corrente */
function rollAsphaltTemp() {
  const race = CALENDAR[S.round];
  if (!race || !Array.isArray(race.asphaltTemp)) return REF_ASPHALT_TEMP;
  const [min, max] = race.asphaltTemp;
  /* distribuzione triangolare leggermente centrata verso il basso,
     per non dare sempre il picco massimo del range */
  const a = rnd(min, max);
  const b = rnd(min, max);
  return Math.round((a + b) / 2);
}
/* v24: shift termico tra qualifica e gara.
   - Circuiti notturni: asfalto si raffredda in gara (sessione serale)
   - Circuiti diurni: asfalto si scalda in gara (sole + gomme + motori) */
function applySessionTempShift() {
  if (!Number.isFinite(S.asphaltTemp)) return;
  const race = CALENDAR[S.round];
  if (!race) return;
  const shift = NIGHT_GPS.has(race.gp) ? -rnd(3, 5) : +rnd(2, 4);
  S.asphaltTemp = clamp(Math.round(S.asphaltTemp + shift), 8, 60);
}
/* Effetto combinato temperatura asfalto + mescola:
   - wearMult: quanto l'asfalto amplifica/riduce l'usura
   - paceMod: quanto penalizza/bonifica il passo (mescole dure al freddo, morbide al caldo estremo) */
function asphaltTempEffect(stratId, asphaltTemp) {
  const profile = STRATEGY_COMPOUND[stratId] || { softness: 0.5 };
  const t = Number.isFinite(asphaltTemp) ? asphaltTemp : REF_ASPHALT_TEMP;
  const delta = t - REF_ASPHALT_TEMP;

  /* Usura: le morbide amplificano il caldo, le dure sono quasi indifferenti */
  const wearMult = clamp(1 + delta * 0.018 * profile.softness, 0.62, 1.55);

  /* Passo:
     - asfalto freddo → le dure faticano a scaldarsi (penalità)
     - asfalto rovente → le morbide si surriscaldano (ulteriore penalità) */
  const coldPenalty = delta < 0 ? delta * 0.030 * (1 - profile.softness) : 0;
  const hotPenalty  = delta > 14 ? -(delta - 14) * 0.022 * profile.softness : 0;
  const paceMod = coldPenalty + hotPenalty;

  return { wearMult, paceMod, profile };
}

/* Etichetta leggibile per la UI */
function asphaltTempLabel(t) {
  if (!Number.isFinite(t)) return { label: '—', cls: 'text-slate-400' };
  if (t >= 45) return { label: t('temp.blazing'), cls: 'text-racing' };
  if (t >= 38) return { label: t('temp.hot'),     cls: 'text-gold' };
  if (t >= 30) return { label: t('temp.warm'),    cls: 'text-amber-300' };
  if (t >= 22) return { label: t('temp.mild'),    cls: 'text-emerald-400' };
  if (t >= 15) return { label: t('temp.cool'),    cls: 'text-sky-300' };
  return              { label: t('temp.cold'),    cls: 'text-sky-500' };
}

/* v24: su meteo Variabile il pilota vede TUTTE le opzioni (dry + wet).
   La scelta è sua: fidarsi dell'asciutto o precauzionarsi sul bagnato. */
function pickAvailableStrategies(weatherName) {
  if (weatherName === 'Asciutto') return STRATEGIES_DRY;
  if (weatherName === 'Pioggia')  return STRATEGIES_WET;
  return [...STRATEGIES_DRY, ...STRATEGIES_WET];   /* Variabile */
}

function pickRandomStrategy(weatherName) {
  const opts = pickAvailableStrategies(weatherName);
  return opts[irnd(0, opts.length - 1)].id;
}

function pickAIStrategy(weatherName, circuitType) {
  if (weatherName !== 'Asciutto') {
    const r = rng();
    if (weatherName === 'Pioggia') return r < 0.70 ? 'wet' : 'inter';
    return r < 0.60 ? 'inter' : 'wet';
  }

  /* v23: distribuzione base per tipo circuito */
  let pHard, pSoftHard, pSoftMedSoft;
  if (circuitType === 'twisty') {
    pHard = 0.50; pSoftHard = 0.35; pSoftMedSoft = 0.15;
  } else if (circuitType === 'power') {
    pHard = 0.25; pSoftHard = 0.45; pSoftMedSoft = 0.30;
  } else {
    pHard = 0.30; pSoftHard = 0.40; pSoftMedSoft = 0.30;
  }

  /* v23: bias dalla temperatura asfalto
     - asfalto caldo → sposta verso Hard (tengono meglio)
     - asfalto freddo → sposta verso Soft (entrano prima in temperatura) */
  const t = Number.isFinite(S && S.asphaltTemp) ? S.asphaltTemp : REF_ASPHALT_TEMP;
  if (t >= 42) {
    const shift = Math.min(0.25, (t - 40) * 0.030);
    pHard += shift;
    pSoftMedSoft = Math.max(0.05, pSoftMedSoft - shift * 0.60);
    pSoftHard    = Math.max(0.05, 1 - pHard - pSoftMedSoft);
  } else if (t <= 20) {
    const shift = Math.min(0.25, (22 - t) * 0.030);
    pSoftHard    += shift;
    pSoftMedSoft += shift * 0.30;
    pHard = Math.max(0.05, 1 - pSoftHard - pSoftMedSoft);
  }

  /* normalizza */
  const sum = pHard + pSoftHard + pSoftMedSoft;
  pHard /= sum; pSoftHard /= sum; pSoftMedSoft /= sum;

  const r = rng();
  if (r < pHard) return '1stop_hard_med';
  if (r < pHard + pSoftHard) return '1stop_soft_hard';
  return '2stop_soft_med_soft';
}

function applyStrategyEffect(stratId, weatherName, circuitType, tyres) {
  let bonus = 0;
  let chaosScale = 1;

  const tyreFactor = clamp(((typeof tyres === 'number' ? tyres : 50) - 50) / 50, -0.5, 1);
  const wearMult = clamp(1 - tyreFactor * 0.7, 0.3, 1.35);

  switch (stratId) {
    case '1stop_soft_hard':
      bonus += 3.8;
      bonus -= 2.5 * wearMult;
      break;
    case '2stop_soft_med_soft':
      bonus += 4.2;
      bonus -= 2.5 * wearMult;
      if (circuitType === 'twisty') bonus -= 2.5;
      break;
    case '1stop_hard_med':
      bonus += 0.3;
      chaosScale = 0.75;
      break;
    case 'inter':
      if (weatherName === 'Variabile') bonus += 4.5;
      else if (weatherName === 'Pioggia') bonus -= 3.0;
      break;
    case 'wet':
      if (weatherName === 'Pioggia') bonus += 4.5;
      else if (weatherName === 'Variabile') bonus -= 6.5;
      break;
  }

  return { bonus, chaosScale };
}

function currentLang() {
  return (S && SUPPORTED_LANGS.includes(S.lang)) ? S.lang : UI_LANG;
}

function t(key, params) {
  const lang = currentLang();
  const dict = TRANSLATIONS[lang] || TRANSLATIONS.it;
  let str = dict[key];
  if (str == null) str = TRANSLATIONS.it[key];
  if (str == null) {
    console.warn('[i18n] missing key:', key, '@', lang);
    return key;
  }
  if (params) {
    str = str.replace(/\{(\w+)\}/g, (_, k) => {
      const v = params[k];
      return v == null ? '{' + k + '}' : String(v);
    });
  }
  return str;
}

function setLang(lang) {
  if (!SUPPORTED_LANGS.includes(lang)) return;
  UI_LANG = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
  if (S) { S.lang = lang; save(); }
  render();
}

/* =========================================================================
   ============================ CORE STATE =================================
   ========================================================================= */

let S = null;
let RNG_STATE = 0x9e3779b9;
let HAS_SAVE_CACHE = null;
let SAVE_WARNING_SHOWN = false;
let IO_SUSPENDED = false;


/* =========================================================================
   ================================ RNG ====================================
   ========================================================================= */

function seedRng(seed = Date.now()) {
  RNG_STATE = (Number(seed) >>> 0) || 0x9e3779b9;
}

/* v22: mulberry32 (stato ancora a 32 bit, compatibile con rngState nei salvataggi) */
function rng() {
  RNG_STATE = (RNG_STATE + 0x6D2B79F5) >>> 0;
  let t = RNG_STATE;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

const rnd    = (a, b) => a + rng() * (b - a);
const irnd   = (a, b) => Math.floor(rnd(a, b + 1));
const clamp  = (v, a, b) => Math.max(a, Math.min(b, v));
const round1 = v => Math.round(v * 10) / 10;
const round3 = v => Math.round(v * 1000) / 1000;

/* =========================================================================
   ============================== UTILITY ==================================
   ========================================================================= */

function sanitizeName(str, max) {
  const limit = Number.isInteger(max) && max > 0 ? max : NAME_MAX;
  return String(str == null ? '' : str)
       .replace(/[\u202A-\u202E\u2066-\u2069\u200B-\u200F\uFEFF\u0000-\u001F\u007F]/g, '')
    .replace(/[<>&"`\\/]/g, '')
    .trim()
    .slice(0, limit)
    .trim();
}

function esc(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function safeColor(c, fallback) {
  const fb = fallback || '#64748b';
  if (typeof c !== 'string') return fb;
  return /^#(?:[0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(c) ? c : fb;
}

/* v22: meteo con previsione calibrata */
function weightedPick(weights) {
  const keys = Object.keys(weights);
  const r = rng(); let acc = 0;
  for (const k of keys) { acc += weights[k]; if (r < acc) return k; }
  return keys[keys.length - 1];
}

function rollForecast() {
  const lean = weightedPick(WEATHER_CLIMATE);
  const sharp = rnd(0.10, 0.65);
  const probs = {};
  Object.keys(WEATHER_CLIMATE).forEach(k => {
    probs[k] = (1 - sharp) * WEATHER_CLIMATE[k] + (k === lean ? sharp : 0);
  });
  return { probs, lean, sharp: round3(sharp) };
}

function drawWeatherFromForecast(fc) {
  return { ...WEATHER_DEFS[weightedPick(fc ? fc.probs : WEATHER_CLIMATE)] };
}

function pickWeather() { return drawWeatherFromForecast(null); }

function forecastPercents(fc) {
  const keys = Object.keys(WEATHER_CLIMATE), out = {};
  let sum = 0;
  keys.forEach(k => { out[k] = Math.round(fc.probs[k] * 100); sum += out[k]; });
  const top = keys.reduce((a, b) => fc.probs[a] >= fc.probs[b] ? a : b);
  out[top] += 100 - sum;
  return out;
}

   ============================ PERSISTENCE ================================
   ========================================================================= */

let _saveTimer = null;
let _saveDirty = false;

function buildMeta() {
  const t = teamById(S.player.teamId);
  return {
    name: S.player.name, nat: S.player.nat, year: S.year, round: S.round,
    team: t ? t.name : '—', teamColor: t ? t.color : '#64748b',
    ovr: S.player.ovr, titles: S.totals.titles,
    difficulty: S.difficulty || 'normal', saved: Date.now()
  };
}

function save() {
  if (!S || IO_SUSPENDED) return false;
  try {
    S.version = SAVE_VERSION;
    S.rngState = RNG_STATE >>> 0;
    localStorage.setItem(slotKey(CURRENT_SLOT), JSON.stringify(S));
    try { localStorage.setItem(metaKey(CURRENT_SLOT), JSON.stringify(buildMeta())); } catch (_) {}
    HAS_SAVE_CACHE = true;
    SLOT_CACHE = null;
    _saveDirty = false;
    return true;
  } catch (e) {
    console.error('Impossibile salvare la carriera:', e);
        if (!SAVE_WARNING_SHOWN) {
      SAVE_WARNING_SHOWN = true;
      try { toast(t('toast.save_failed'), 'bad'); } catch (_) {}
    }
    return false;
  }
}

function scheduleSave(delay) {
  if (IO_SUSPENDED) return;
  _saveDirty = true;
  if (_saveTimer) return;
  _saveTimer = setTimeout(() => {
    _saveTimer = null;
    if (_saveDirty) save();
  }, typeof delay === 'number' ? delay : 200);
}

function flushSave(force) {
  if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
  if (force || _saveDirty) save();
}

function getSlotSummaries() {
  if (SLOT_CACHE) return SLOT_CACHE;
  const out = [];
  for (let n = 1; n <= SLOT_COUNT; n++) {
    let exists = false, meta = null;
    try {
      exists = !!localStorage.getItem(slotKey(n))
            || (n === 1 && LEGACY_SAVE_KEYS.some(k => localStorage.getItem(k)));
      if (exists) {
        const m = localStorage.getItem(metaKey(n));
        meta = m ? JSON.parse(m) : null;
      }
    } catch (e) { console.warn('localStorage non disponibile:', e); }
    out.push({ slot: n, exists, meta });
  }
  return (SLOT_CACHE = out);
}

function load(slot) {
  const keys = [slotKey(slot), ...(slot === 1 ? LEGACY_SAVE_KEYS : [])];
  for (const key of keys) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) continue;
      const parsed = JSON.parse(raw);
      const migrated = migrateSave(parsed);
      if (!migrated) continue;
      RNG_STATE = migrated.rngState >>> 0;
      HAS_SAVE_CACHE = true;
      if (key !== slotKey(slot)) {
        try { localStorage.setItem(slotKey(slot), JSON.stringify(migrated)); }
        catch (e) { console.error('Migrazione salvataggio non completata:', e); }
      }
      return migrated;
    } catch (e) {
      console.error('Salvataggio corrotto o illeggibile su "' + key + '":', e);
    }
  }
  HAS_SAVE_CACHE = false;
  return null;
}

function wipeSlot(n) {
  try {
    localStorage.removeItem(slotKey(n));
    localStorage.removeItem(metaKey(n));
    if (n === 1) LEGACY_SAVE_KEYS.forEach(k => localStorage.removeItem(k));
    HAS_SAVE_CACHE = false;
    SLOT_CACHE = null;
    _saveDirty = false;
    if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
    return true;
  } catch (e) {
    console.error('Impossibile eliminare il salvataggio:', e);
    return false;
  }
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportSlot(n) {
  if (S && n === CURRENT_SLOT) flushSave(true);
  let raw = null;
  try {
    raw = localStorage.getItem(slotKey(n))
       || (n === 1 ? LEGACY_SAVE_KEYS.map(k => localStorage.getItem(k)).find(Boolean) : null);
  } catch (_) {}
  if (!raw) { toast(t('toast.slot_empty'), 'bad'); return; }
  let name = 'carriera';
  try {
    name = sanitizeName(JSON.parse(raw).player.last, 16).toLowerCase().replace(/\s+/g, '_') || name;
  } catch (_) {}
  downloadText('f1career_' + name + '_slot' + n + '.json', raw);
  toast(t('toast.backup_exported'), 'good');
}

function importSaveText(text, slot) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (_) { toast(t('toast.file_invalid'), 'bad'); return; }
  const migrated = migrateSave(parsed);
  if (!migrated) { toast(t('toast.save_unknown'), 'bad'); return; }
  const doImport = () => {
    try {
      localStorage.setItem(slotKey(slot), JSON.stringify(migrated));
      const prev = S; S = migrated;
      try { localStorage.setItem(metaKey(slot), JSON.stringify(buildMeta())); }
      finally { S = prev; }
      SLOT_CACHE = null;
      toast(t('toast.imported_slot', { n: slot }), 'good');
      render();
    } catch (e) { toast(t('toast.import_full'), 'bad'); }
  };
  if (getSlotSummaries()[slot - 1].exists) {
    askConfirm(t('toast.confirm_replace', { n: slot }), doImport,
      { yes: t('toast.confirm_replace_yes'), danger: true });
  } else doImport();
}

  }));

  }
  migrated.drivers.forEach(d => {

  });

  if (!migrated.drivers.some(d => d.isPlayer)) migrated.drivers.push(p);
  else migrated.drivers = migrated.drivers.map(d => d.isPlayer ? p : d);

  if (migrated.rivalId && !migrated.drivers.some(d => d.id === migrated.rivalId)) {
    migrated.rivalId = null;
  }

  if (migrated.rivalId) {
    const rivalD = migrated.drivers.find(d => d.id === migrated.rivalId);
    if (rivalD && rivalD.teamId === migrated.player.teamId) {
      migrated.rivalId = null;
    }
  }

  const screenNeeds = {
    quali:       () => migrated.quali && typeof migrated.quali === 'object',

    raceLive:    () => migrated.raceLive && Array.isArray(migrated.raceLive.rows),
    race:        () => Array.isArray(migrated.lastRace) && migrated.lastRace.length > 0,
    strategy:    () => migrated.weather != null,
    setup:       () => migrated.round < CALENDAR.length,
    regulations: () => migrated.regulationPending === true,
    market:      () => Array.isArray(migrated.offers) && migrated.offers.length > 0,
    progress:    () => migrated.progression && typeof migrated.progression === 'object'
  };
  if (screenNeeds[migrated.screen] && !screenNeeds[migrated.screen]()) {
    if (migrated.screen === 'quali') migrated.screen = 'setup';
    else if (migrated.screen === 'sprint' || migrated.screen === 'raceLive') migrated.screen = 'hub';
    else if (migrated.screen === 'race') migrated.screen = 'hub';
    else if (migrated.screen === 'strategy') migrated.screen = 'setup';
    else { migrated.screen = 'hub'; migrated.tab = 'race'; }
  }
  if (migrated.regulationPending && migrated.screen === 'hub') {
    migrated.screen = 'regulations';
  }

  if (!migrated.regulationPending) migrated.regulationSnapshot = null;

  const rngState = Number.isFinite(migrated.rngState) ? migrated.rngState >>> 0 : 0x9e3779b9;
  migrated.rngState = rngState;
  return migrated;
}

function defaultTelemetry() {
  return {
    seasonsSimulated: 0,
    constructorTitles: {},
    driverTitles: {},
    rookieTitles: 0,
    championOvrSum: 0,
    championOvrCount: 0,

    rdSuccessCount: 0,
    rdFailCount: 0,
    transfersCount: 0,
    retirementsCount: 0,
    budgetSumByTeam: {},
    budgetSamplesByTeam: {}
  };
}

function trackSeasonTelemetry(standings, tStandings) {
  if (!S.telemetry) S.telemetry = defaultTelemetry();
  const T = S.telemetry;
  T.seasonsSimulated++;
  const champ = standings[0];
  const ctorChamp = tStandings[0];
  if (champ) {
    T.driverTitles[champ.id] = (T.driverTitles[champ.id] || 0) + 1;
    T.championOvrSum += champ.ovr || 0;
    T.championOvrCount++;
    if (champ.id && champ.id.startsWith('rookie_')) T.rookieTitles++;
  }
  if (ctorChamp) {
    T.constructorTitles[ctorChamp.id] = (T.constructorTitles[ctorChamp.id] || 0) + 1;
  }
  S.teams.forEach(t => {
    const b = Number.isFinite(t.budgetNow) ? t.budgetNow : t.budget;
    T.budgetSumByTeam[t.id] = (T.budgetSumByTeam[t.id] || 0) + b;
    T.budgetSamplesByTeam[t.id] = (T.budgetSamplesByTeam[t.id] || 0) + 1;
  });
}

function recordRaceTelemetry(weatherName, safetyCar) {
  if (!S.telemetry) S.telemetry = defaultTelemetry();
  const T = S.telemetry;
  if (T.weatherCounts && weatherName in T.weatherCounts) T.weatherCounts[weatherName]++;
  else if (T.weatherCounts) T.weatherCounts[weatherName] = 1;
  if (safetyCar) T.scCount++;
}

function selectRivalForCareer(career) {
  const player = career.player;
  const myTeam = TEAM_DB.find(t => t.id === player.teamId);
  const candidates = career.drivers.filter(d => !d.isPlayer && d.teamId !== player.teamId);
  if (!candidates.length) return null;

  const filterFn = (d, carDelta) => {
    const t = TEAM_DB.find(x => x.id === d.teamId);
    if (!t) return false;
    if (myTeam && Math.abs(t.car - myTeam.car) > carDelta) return false;
    return true;
  };

  let pool = candidates.filter(d => filterFn(d, 10));
  if (pool.length < 2) pool = candidates.filter(d => filterFn(d, 15));
  if (pool.length < 2) pool = candidates;

  let best = null, bestScore = Infinity;
  pool.forEach(d => {
    const ageDiff = Math.abs(d.age - player.age);
    const ovrDiff = Math.abs(d.ovr - player.ovr);
    const score = ageDiff * 2 + ovrDiff;
    if (score < bestScore) { bestScore = score; best = d; }
  });
  return best ? best.id : null;
}

function computeOVR(speed, cons, tyres) {
  return Math.round(speed * 0.45 + cons * 0.3 + tyres * 0.25);
}

function getRivalCandidatesForCreate(teamId, playerAge, playerOvr) {
  const myTeam = TEAM_DB.find(t => t.id === teamId);
  if (!myTeam) return [];

  const build = (d) => {
    const t = TEAM_DB.find(x => x.id === d.team);
    return {
      id: d.id, name: d.name, nat: d.nat, age: d.age, ovr: d.ovr,
      teamId: d.team,
      teamName: t ? t.name : '—', teamShort: t ? t.short : '',
      teamColor: t ? t.color : '#64748b', teamCar: t ? t.car : 70
    };
  };

  const baseFilter = (d, carDelta, ageDelta) => {
    if (d.team === teamId) return false;
    const t = TEAM_DB.find(x => x.id === d.team);
    if (!t) return false;
    if (Math.abs(t.car - myTeam.car) > carDelta) return false;
    if (ageDelta != null && Math.abs(d.age - playerAge) > ageDelta) return false;
    return true;
  };

  let list = AI_DRIVERS.filter(d => baseFilter(d, 8, 6));
  if (list.length < 2) list = AI_DRIVERS.filter(d => baseFilter(d, 12, null));
  if (list.length < 2) list = AI_DRIVERS.filter(d => d.team !== teamId);

  const scored = list.map(d => {
    const ageDiff = Math.abs(d.age - playerAge);
    const ovrDiff = Math.abs(d.ovr - playerOvr);
    return { raw: d, score: ageDiff * 2 + ovrDiff };
  }).sort((a, b) => a.score - b.score);

  return scored.slice(0, 4).map(s => build(s.raw));
}

function rivalAffinityHint(candidate, myTeamCar, playerAge) {
  const carDiff = candidate.teamCar - myTeamCar;
  const ageDiff = candidate.age - playerAge;
  if (Math.abs(carDiff) <= 2 && Math.abs(ageDiff) <= 2) return t('rival.hint.equal');
  if (carDiff >= 4) return t('rival.hint.better_car');
  if (carDiff <= -4) return t('rival.hint.worse_car');
  if (ageDiff >= 4) return t('rival.hint.older');
  if (ageDiff <= -4) return t('rival.hint.younger');
  return t('rival.hint.same_band');
}

/* =========================================================================
   ============================== ECONOMY =================================
   ========================================================================= */

function rdOverCapMultiplier(budgetNow) {
  if (typeof budgetNow !== 'number' || budgetNow <= BUDGET_CAP) return 1;
  const overRatio = (budgetNow - BUDGET_CAP) / BUDGET_CAP;
  return 1 + (RD_OVER_CAP_MAX_MULT - 1) * Math.min(1, overRatio);
}

function applyLuxuryTax(rawBudget) {
  if (rawBudget <= BUDGET_CAP) return rawBudget;
  const excess = rawBudget - BUDGET_CAP;
  return BUDGET_CAP + excess * (1 - LUXURY_TAX_RATE);
}

function computeSeasonBudgetForTeam(team, standingPos, numTeams) {
  const base = team.budget;
  const posRatio = numTeams > 1 ? 1 - standingPos / (numTeams - 1) : 1;
  const posBonus = 0.7 + 0.7 * Math.pow(Math.max(0, posRatio), 0.8);
  const prestigeFactor = 0.9 + ((team.prestige || 70) - 65) * 0.006;
  const noise = rnd(0.92, 1.08);
   const raw = Math.max(85, base * posBonus * prestigeFactor * noise);
  const taxed = applyLuxuryTax(raw);
  return Math.round(taxed);
}

function updateTeamBudgetsForNextSeason(tStandings) {
  const numTeams = tStandings.length;
  tStandings.forEach((tStanding, i) => {
    const team = teamById(tStanding.id);
    if (!team) return;
    team.budgetNow = computeSeasonBudgetForTeam(team, i, numTeams);
  });
}

function assignTeamRoles(st = S) {
  st.teams.forEach(t => {
    const ds = st.drivers.filter(d => d.teamId === t.id);
    const pl = ds.find(d => d.isPlayer);
    if (pl) {
      const mate = ds.find(d => !d.isPlayer);
      if (mate) {
        mate.role = pl.role === ROLE_FIRST ? ROLE_SECOND
                  : pl.role === ROLE_SECOND ? ROLE_FIRST
                  : ROLE_STD;
      }
      return;
    }
    if (ds.length !== 2) return;
    const [a, b] = ds[0].ovr >= ds[1].ovr ? [ds[0], ds[1]] : [ds[1], ds[0]];
    if (a.ovr - b.ovr >= 3) { a.role = ROLE_FIRST; b.role = ROLE_SECOND; }
    else                    { a.role = ROLE_STD;   b.role = ROLE_STD;   }
  });
}

function tickAIContracts() {
  S.drivers.forEach(d => {
    if (!d.isPlayer) d.contract = (Number.isInteger(d.contract) ? d.contract : 2) - 1;
  });
}

function renewAIContracts() {
  S.drivers.forEach(d => {
    if (d.isPlayer || d.contract > 0) return;
    d.contract = d.age >= 36 ? 1 : irnd(1, 3);
  });
}

function updateMateTension(order) {
  const mate = teammate();
  if (!mate) return;
  const me = order.find(r => r.id === 'PLAYER'), m = order.find(r => r.id === mate.id);
  if (!me || !m || me.dnf || m.dnf) return;
  const ahead = me.pos < m.pos;
  const p = S.player;
  if (p.role === ROLE_SECOND && ahead && mate.role === ROLE_FIRST) {
    S.mateTension = clamp(S.mateTension + 5, 0, 100);
  } else if (p.role === ROLE_FIRST && !ahead) {
    S.mateTension = clamp(S.mateTension + 3, 0, 100);
  } else {
    S.mateTension = clamp(S.mateTension - 2, 0, 100);
  }
}

function updateReputation(pos, wonTitle) {
  const p = S.player;
    const log = raceOnlySeasonLog();
  const races = log.length || 1;
  const dnfRate = log.filter(l => l.dnf).length / races;
  let d = wonTitle ? 12 : pos <= 3 ? 6 : pos <= 10 ? 2 : -2;
  d += Math.min(4, p.wins * 0.5) + Math.min(2, p.podiums * 0.15);
  if (dnfRate > 0.3) d -= 3;
  const before = S.reputation;
  S.reputation = clamp(Math.round(S.reputation + d), 0, 100);
  return S.reputation - before;
}

function rdRoleGainMult() {
  let m = S.player.role === ROLE_FIRST ? 1.08
        : S.player.role === ROLE_SECOND ? 0.92
        : 1;
  if (S.mateTension >= 70) m *= 0.9;
  return m;
}

/* =========================================================================
   ============================== R&D SYSTEM ===============================
   ========================================================================= */

function rdEffectiveCost(stratId, teamCar, budgetNow) {
  const s = RD_STRATEGIES[stratId];
  const carFactor = 1 + Math.max(0, teamCar - 65) * 0.02;
  const smallTeamDiscount = teamCar < 72 ? 0.60 : 1;
  const capMult = rdOverCapMultiplier(budgetNow);
  return Math.round(s.cost * carFactor * capMult * smallTeamDiscount);
}
function rdEffectiveFail(stratId, teamCar, teamRdSkill, pkgId, simCharges) {
  const s = RD_STRATEGIES[stratId];
  const pkg = rdPackageById(pkgId);
  const carFactor = Math.max(0, teamCar - 70) * 0.008;
  const skillFactor = (0.7 - (teamRdSkill || 0.6)) * 0.15;
  const buff = (pkg.id !== 'sim' && (simCharges || 0) > 0) ? SIM_BUFF_FAIL_REDUCTION : 0;
  const smallTeamRelief = teamCar < 75 ? 0.70 : 1;
  return clamp((s.failChance + carFactor + skillFactor + pkg.failAdd - buff) * smallTeamRelief, 0.03, 0.65);
}

function rdEffectiveGain(stratId, teamCar, teamRdSkill, pkgId) {
  const s = RD_STRATEGIES[stratId];
  const pkg = rdPackageById(pkgId);
  const carDiminish = clamp(1 - Math.max(0, teamCar - 65) * 0.012, 0.6, 1);
  const skillMult = 0.85 + (teamRdSkill || 0.6) * 0.35;
  return {
    min: s.gainMin * carDiminish * skillMult * pkg.gainMult,
    max: s.gainMax * carDiminish * skillMult * pkg.gainMult
  };
}

function applyRD(team, stratId, pkgId, { budgetRef = null, logTarget = null, logSuffix = '' } = {}) {
  const strat = RD_STRATEGIES[stratId];
  const currentBudget = budgetRef ? budgetRef.value : (team.budgetNow || 0);
  const actualCost = rdEffectiveCost(stratId, team.car, currentBudget);

  if (currentBudget < actualCost) {
    return { ok: false, reason: 'budget', cost: actualCost };
  }

  const gains = rdEffectiveGain(stratId, team.car, team.rdSkill, pkgId);
  /* v22: moltiplicatore di ruolo per il team del giocatore */
  if (team.id === S.player.teamId) {
    const m = rdRoleGainMult();
    gains.min *= m; gains.max *= m;
  }
  const failChance = rdEffectiveFail(stratId, team.car, team.rdSkill, pkgId, team.simCharges || 0);

  if (budgetRef) budgetRef.value = Math.max(0, budgetRef.value - actualCost);
  else team.budgetNow = Math.max(0, (team.budgetNow || 0) - actualCost);

  if (pkgId === 'sim') team.simCharges = SIM_BUFF_CHARGES;
  else if ((team.simCharges || 0) > 0) team.simCharges--;

  const roll = rng();
  let outcome, delta, text;
  if (roll < failChance) {
    outcome = 'fail';
    delta = -round1(rnd(strat.failMag * 0.3, strat.failMag));
    text = t('rd.outcome.fail');
  } else if (roll < failChance + 0.35) {
    outcome = 'neutral';
    delta = round1(rnd(0, gains.min));
    text = t('rd.outcome.neutral');
  } else {
    outcome = 'good';
    delta = round1(rnd(gains.min, gains.max));
    text = t('rd.outcome.good');
  }

  if (pkgId === 'sim' && outcome === 'fail') {
    delta = round1(delta / 2);
    text += t('rd.outcome.sim_saved');
  }

  const upperBound = (team.isSatellite && typeof team.maxCar === 'number') ? team.maxCar : 99;
  team.car = round1(clamp(team.car + delta, team.minCar || 40, upperBound));

  if (S.telemetry) {
    S.telemetry.rdSpendTotal += actualCost;
    if (outcome === 'good') S.telemetry.rdSuccessCount++;
    else if (outcome === 'fail') S.telemetry.rdFailCount++;
  }

  const finalText = text + logSuffix;

  if (logTarget === 'player') {
    const pkg = RD_PACKAGES.find(p => p.id === pkgId);
    if (pkg) {
    S.rdLog.unshift({
  year: S.year, round: S.round,
  pkgId: pkg.id, pkg: pkg.name, icon: pkg.icon,
  stratId: stratId, strat: strat.name, outcome, delta, text: finalText
});
      if (S.rdLog.length > RD_LOG_CAP) S.rdLog.length = RD_LOG_CAP;
    }
  } else if (logTarget === 'team') {
    if (!team.rdHistory) team.rdHistory = [];
    team.rdHistory.unshift({ year: S.year, round: S.round, delta, outcome, strat: strat.name });
    if (team.rdHistory.length > 20) team.rdHistory.length = 20;
  }

  return { ok: true, outcome, delta, cost: actualCost, text: finalText, stratName: strat.name };
}

function executeRDAction(team, stratId, pkgId) {
  const res = applyRD(team, stratId, pkgId, { logTarget: 'team' });
  return res.ok
    ? { outcome: res.outcome, delta: res.delta, cost: res.cost, stratName: res.stratName }
    : { outcome: 'skip', delta: 0, cost: 0, stratName: RD_STRATEGIES[stratId].name };
}

function doRD(pkgId, stratId, silent) {
  const team = playerTeam();
  const budgetRef = { value: S.budget };
  const logSuffix = silent ? t('rd.auto_suffix') : '';
  const res = applyRD(team, stratId, pkgId, { budgetRef, logTarget: 'player', logSuffix });

  if (!res.ok) {
    if (!silent) toast(t('toast.rd_budget', { n: res.cost }), 'bad');
    return false;
  }

  S.budget = budgetRef.value;
  S.rdDone++;
  if (S.rdDone >= 2) S.rdOpen = false;
  if (silent) return true;

  save();
  render({ resetScroll: false });

  const outcome = res.outcome;
  let msg;
  if (outcome === 'good')         msg = t('toast.rd_good',    { d: (res.delta >= 0 ? '+' : '') + res.delta, c: res.cost });
  else if (outcome === 'neutral') msg = t('toast.rd_neutral', { d: (res.delta >= 0 ? '+' : '') + res.delta, c: res.cost });
  else                            msg = t('toast.rd_fail',    { d: res.delta,                                   c: res.cost });
  toast(msg, outcome === 'good' ? 'good' : outcome === 'neutral' ? 'neutral' : 'bad');
  return true;
}

function autoRD() {
  let guard = 0;
  while (S.rdOpen && S.rdDone < 2 && guard++ < 4) {
    const team = playerTeam();
    const consCost = rdEffectiveCost('cons', team.car, S.budget);
    const balCost  = rdEffectiveCost('bal',  team.car, S.budget);
    const aggCost  = rdEffectiveCost('agg',  team.car, S.budget);

    let stratId = null;
    if (S.budget >= aggCost * 1.2) stratId = 'agg';
    else if (S.budget >= balCost) stratId = 'bal';
    else if (S.budget >= consCost) stratId = 'cons';
    if (!stratId) break;

    const floor = team.minCar || 50;
    let pkgId;
    if (S.rdDone === 0 && (team.simCharges || 0) === 0 && S.budget >= balCost * 2) pkgId = 'sim';
    else if (S.budget < balCost * 1.6 || team.car <= floor + 6) pkgId = 'chass';
    else pkgId = (S.rdDone % 2 === 0) ? 'aero' : 'power';

    const ok = doRD(pkgId, stratId, true);
    if (!ok) break;
  }
  S.rdOpen = false;
  S.rdDone = 0;
}

/* =========================================================================
   ==================== PLAYER PROGRESSION =================================
   ========================================================================= */
   function raceOnlySeasonLog() {
  return (S.seasonLog || []).filter(l => !l.isSprint);
}

function calculatePlayerProgression(p, mate, pos, wonTitle) {
    const seasonLog = raceOnlySeasonLog();
  const seasonRaces = seasonLog.length || 1;
  const seasonDnfs  = seasonLog.filter(l => l.dnf).length;
  const dnfRate     = seasonDnfs / seasonRaces;

  const aggressiveIds = new Set(['1stop_soft_hard','2stop_soft_med_soft','inter','wet']);
  const aggressiveUse = seasonLog.filter(l => l.strat && aggressiveIds.has(l.strat)).length;
  const aggRatio      = aggressiveUse / seasonRaces;

  let speedDelta = 0;
  const speedReasons = [];

  if (wonTitle)         { speedDelta += 1.6; speedReasons.push(['prog.reason.champion', '+1.6']); }
  else if (pos <= 3)    { speedDelta += 1.0; speedReasons.push(['prog.reason.podium', '+1.0']); }
  else if (pos <= 8)    { speedDelta += 0.6; speedReasons.push(['prog.reason.high', '+0.6']); }
  else if (pos <= 14)   { speedDelta += 0.3; speedReasons.push(['prog.reason.mid', '+0.3']); }
  else if (pos <= 18)   { speedDelta += 0;   speedReasons.push(['prog.reason.low', '0']); }
  else                  { speedDelta -= 0.1; speedReasons.push(['prog.reason.very_low', '-0.1']); }
  if (mate) {
    const diff0 = p.pts - mate.pts;
    let mult = 1;
    if (mate.ovr < 75) mult = 0.5;
    else if (mate.ovr < 80) mult = 0.75;
    else if (mate.ovr >= 85) mult = 1.4;
    else if (mate.ovr >= 80) mult = 1.1;

      // Il veterano che ti batte non ti fa regredire: ti fa crescere.
    // Il malus "compagno perso" è attenuato per i primi anni di carriera
    // e quando il gap di OVR è dovuto all'esperienza, non al talento.
    const careerYears = S.totals.seasons || 0;
    const ovrGap = Math.max(0, mate.ovr - p.ovr);
    const graceByOvr = Math.max(0.10, 1 - ovrGap / 30);
      const graceByAge = careerYears < 6 ? 0.35 : 1;
    const rookieGrace = Math.min(graceByOvr, graceByAge);

       if (diff0 > 30)       { const v = round1(1.8 * mult); speedDelta += v; speedReasons.push(['prog.reason.mate_dom', '+' + v]); }
    else if (diff0 > 0)   { const v = round1(1.0 * mult); speedDelta += v; speedReasons.push(['prog.reason.mate_won', '+' + v]); }
    else if (diff0 > -25) { speedDelta += 0.3; speedReasons.push(['prog.reason.team_growth', '+0.3']); }
    else {
      const v = round1(0.4 * rookieGrace);
      speedDelta -= v;
      speedReasons.push([careerYears < 4 ? 'prog.reason.mate_rookie' : 'prog.reason.mate_lost', '-' + v]);
    }
 } 
    const rival = rivalDriver();
  if (rival) {
    const rivalDiff = p.pts - rival.pts;
    // Handicap: se il rivale è molto più forte di te (gap OVR), la penalità è ridotta
    const rivalOvrGap = Math.max(0, rival.ovr - p.ovr);
    const rivalHandicap = rivalOvrGap > 12 ? 0.25 : rivalOvrGap > 6 ? 0.5 : 1;
       if (rivalDiff > 40)       { speedDelta += 0.9; speedReasons.push(['prog.reason.rival_dom', '+0.9']); }
    else if (rivalDiff > 0)   { speedDelta += 0.4; speedReasons.push(['prog.reason.rival_won', '+0.4']); }
    else if (rivalDiff > -40) { const v = round1(0.2 * rivalHandicap); speedDelta -= v; speedReasons.push(['prog.reason.rival_ahead', '-' + v]); }
    else                      { const v = round1(0.6 * rivalHandicap); speedDelta -= v; speedReasons.push(['prog.reason.rival_dominant', '-' + v]); }
  }
     // Talent-based growth: piloti veloci crescono anche con macchine scarse
  let consDelta = 0;
  const consReasons = [];
  if (dnfRate < 0.01)       { consDelta += 2.0;  consReasons.push(['prog.reason.zero_dnf', '+2.0']); }
  else if (dnfRate < 0.15)  { consDelta += 1.2;  consReasons.push(['prog.reason.low_dnf', '+1.2']); }
  else if (dnfRate < 0.30)  { consDelta += 0.2;  consReasons.push(['prog.reason.avg_dnf', '+0.2']); }
  else if (dnfRate < 0.50)  { consDelta -= 0.8;  consReasons.push(['prog.reason.high_dnf', '-0.8']); }
  else                      { consDelta -= 1.8;  consReasons.push(['prog.reason.full_dnf', '-1.8']); }

  if (pos <= 10 && dnfRate < 0.10 && seasonRaces >= 10) {
    consDelta += 0.6;
    consReasons.push(['prog.reason.points_rate', '+0.6']);
  }

  let tyreDelta = 0;
  const tyreReasons = [];

  if (aggRatio >= 0.55)      { tyreDelta += 1.0; tyreReasons.push(['prog.reason.aggr_good', '+1.0']); }
  else if (aggRatio >= 0.30) { tyreDelta += 0.5; tyreReasons.push(['prog.reason.tyres_strat', '+0.5']); }
  else                       { tyreDelta += 0.2; tyreReasons.push(['prog.reason.safe', '+0.2']); }

  if (pos <= 10 && seasonRaces >= 10) {
    tyreDelta += 0.4;
    tyreReasons.push(['prog.reason.final_cons', '+0.4']);
  }

  /* Talent-based growth: usa la media delle 3 stat, distribuita sui pesi OVR */
  const avgTop = (p.speed + p.consistency + p.tyres) / 3;
  const talentBonus = Math.max(0, (avgTop - 60) * 0.05);
  if (talentBonus > 0) {
    speedDelta += talentBonus * 0.45;
    consDelta  += talentBonus * 0.30;
    tyreDelta  += talentBonus * 0.25;
    speedReasons.push(['prog.reason.talent', '+' + round1(talentBonus * 0.45)]);
  }

      let resistance = 1;
  if (p.ovr >= 75) {
    const agePenalty = p.age >= 34 ? (p.age - 33) * 0.15 : 0;
    resistance = 1 + (p.ovr - 75) * 0.06 + agePenalty;
    // Soft cap: oltre OVR 88 la crescita rallenta drasticamente
    if (p.ovr >= 88) resistance *= 1.4;
    if (p.ovr >= 92) resistance *= 1.4;
    const soften = v => (v > 0 ? v / resistance : v);
    speedDelta = soften(speedDelta);
    consDelta  = soften(consDelta);
    tyreDelta  = soften(tyreDelta);
  }
// Soft cap per singola statistica: sopra 85 le stat rallentano fortemente
const attrSoften = (current, delta) => {
  if (delta <= 0) return delta;
  if (current >= 95) return delta * 0.10;
  if (current >= 90) return delta * 0.30;
  if (current >= 85) return delta * 0.55;
  return delta;
};
speedDelta = attrSoften(p.speed, speedDelta);
consDelta  = attrSoften(p.consistency, consDelta);
tyreDelta  = attrSoften(p.tyres, tyreDelta);
    let ageMod = 0, ageLabel = null;
     if (p.age <= 21)      { ageMod =  2.0; ageLabel = ['prog.reason.age_19', '+2.0']; }
    else if (p.age <= 24) { ageMod =  1.5; ageLabel = ['prog.reason.age_22', '+1.5']; }
    else if (p.age <= 27) { ageMod =  0.9; ageLabel = ['prog.reason.age_25', '+0.9']; }
    else if (p.age <= 31) { ageMod =  0.4; ageLabel = ['prog.reason.age_28', '+0.4']; }
    else if (p.age <= 33) { ageMod = -0.2; ageLabel = ['prog.reason.age_32', '-0.2']; }
    else if (p.age <= 36) { ageMod = -0.9; ageLabel = ['prog.reason.age_35', '-0.9']; }
    else if (p.age <= 39) { ageMod = -1.8; ageLabel = ['prog.reason.age_38', '-1.8']; }
    else                  { ageMod = -3.0; ageLabel = ['prog.reason.age_39', '-3.0']; }
  speedDelta += ageMod * 0.45;
consDelta  += ageMod * 0.30;
tyreDelta  += ageMod * 0.25;

  const luck = round1(rnd(-0.2, 0.7));
  speedDelta += luck;

  /* v22: difficoltà modula la progressione */
  const pm = diff().progMult;
  const boost = v => v > 0 ? v * pm : v;
  speedDelta = boost(speedDelta);
  consDelta  = boost(consDelta);
  tyreDelta  = boost(tyreDelta);

  const reasons = [];
  reasons.push(...speedReasons);
  reasons.push(...consReasons);
  reasons.push(...tyreReasons);
   if (resistance > 1) reasons.push(['prog.reason.high_lvl', '×' + (1 / resistance).toFixed(2)]);
  if (ageLabel) reasons.push(ageLabel);
  reasons.push(['prog.reason.form', (luck >= 0 ? '+' : '') + luck]);

  return {
    speedDelta: round1(speedDelta),
    consDelta:  round1(consDelta),
    tyreDelta:  round1(tyreDelta),
    delta:      round1((speedDelta + consDelta + tyreDelta) / 3),
    reasons
  };
}

function applyAttr(current, frac, delta) {
  const total = clamp(current + (frac || 0) + delta, 30, 99);
  const value = Math.round(total);
  return { value, frac: round3(total - value) };
}

function applyPlayerProgression(p, progression) {
  const oldOVR = p.ovr;
  const s = applyAttr(p.speed,       p.speedFrac, progression.speedDelta);
  const c = applyAttr(p.consistency, p.consFrac,  progression.consDelta);
  const t = applyAttr(p.tyres,       p.tyresFrac, progression.tyreDelta);
  p.speed = s.value;       p.speedFrac = s.frac;
  p.consistency = c.value; p.consFrac  = c.frac;
  p.tyres = t.value;       p.tyresFrac = t.frac;
  p.ovr = computeOVR(p.speed, p.consistency, p.tyres);
  return { oldOVR, newOVR: p.ovr };
}

function applyRivalryBonus(p) {
  if (!S.rivalryPoints || S.rivalryPoints < RIVALRY_BONUS_THRESHOLD) {
    return { applied: 0, deltas: { speed: 0, consistency: 0, tyres: 0 } };
  }
  const bonuses = Math.floor(S.rivalryPoints / RIVALRY_BONUS_THRESHOLD);
  const deltas = { speed: 0, consistency: 0, tyres: 0 };
  for (let i = 0; i < bonuses; i++) {
    const pick = irnd(0, 2);
    if (pick === 0) deltas.speed += RIVALRY_BONUS_DELTA;
    else if (pick === 1) deltas.consistency += RIVALRY_BONUS_DELTA;
    else deltas.tyres += RIVALRY_BONUS_DELTA;
  }
  const s = applyAttr(p.speed,       p.speedFrac, deltas.speed);
  const c = applyAttr(p.consistency, p.consFrac,  deltas.consistency);
  const t = applyAttr(p.tyres,       p.tyresFrac, deltas.tyres);
  p.speed = s.value;       p.speedFrac = s.frac;
  p.consistency = c.value; p.consFrac  = c.frac;
  p.tyres = t.value;       p.tyresFrac = t.frac;
  p.ovr = computeOVR(p.speed, p.consistency, p.tyres);
  return { applied: bonuses, deltas };
}

/* =========================================================================
   ==================== TEAM PERFORMANCE EVOLUTION =========================
   ========================================================================= */
function updateTeamPerformance(tStandings) {
  const numTeams = tStandings.length;

  S.teams.forEach(t => {
    const targetMin = t.minCar || 50;
    const upperBound = (t.isSatellite && typeof t.maxCar === 'number') ? t.maxCar : 99;
    const carFactor = clamp(1 - Math.max(0, t.car - 70) * 0.03, 0.4, 1);
    const drift = rnd(-3.0, 3.5) * carFactor;
    const anchorPull = (targetMin - t.car) * 0.07;

    let rubberBand = 0;
    if (!t.isSatellite) {
      const standingPos = tStandings.findIndex(st => st.id === t.id);
      if (standingPos >= 0) {
        const normalizedRank = numTeams > 1 ? standingPos / (numTeams - 1) : 0;
        if (normalizedRank > 0.4) {
          const rubberStrength = (normalizedRank - 0.4) / 0.6;
          rubberBand = rubberStrength * rnd(0.8, 2.4);
          if (rng() < 0.15 * rubberStrength) rubberBand += rnd(1.0, 2.5);
        }
      }
    }

    let regression = 0;
    if (t.car > 88 && !t.isSatellite) regression = -(t.car - 88) * 0.20;

    t.car = round1(clamp(t.car + drift + anchorPull + rubberBand + regression, targetMin, upperBound));
  });
}

/* =========================================================================
   ========================= AI R&D ========================================
   ========================================================================= */
function processAIRDActivity(tStandings, light) {
  const numTeams = tStandings.length;

  S.teams.forEach(team => {
    if (team.id === S.player.teamId) return;

    const standingPos = tStandings.findIndex(st => st.id === team.id);
    const normRank = numTeams > 1 ? standingPos / (numTeams - 1) : 0;

    let actions = 0;
    if (light) {
      actions = rng() < 0.5 ? 1 : 0;
    } else {
      if (team.budgetNow >= 90)       actions = 2 + (rng() < 0.4 ? 1 : 0);
      else if (team.budgetNow >= 60)  actions = 1 + (rng() < 0.6 ? 1 : 0);
      else if (team.budgetNow >= 35)  actions = 1;
      else                            actions = rng() < 0.5 ? 1 : 0;

      if (team.car >= 88 && normRank < 0.25) actions = Math.max(1, actions - 1);
      if (normRank > 0.7) actions += 1;
    }

    for (let i = 0; i < actions; i++) {
      let stratId;
      const r = rng();

      if (normRank > 0.7 && team.budgetNow >= 50) stratId = r < 0.55 ? 'agg' : 'bal';
      else if (normRank < 0.25 && team.car > 86) stratId = r < 0.7 ? 'cons' : 'bal';
      else if (team.budgetNow >= 50) stratId = r < 0.4 ? 'bal' : r < 0.7 ? 'agg' : 'cons';
      else if (team.budgetNow >= 25) stratId = r < 0.6 ? 'cons' : 'bal';
      else stratId = 'cons';

      const cost = rdEffectiveCost(stratId, team.car, team.budgetNow);
      if (team.budgetNow < cost) continue;

      const balCost = rdEffectiveCost('bal', team.car, team.budgetNow);
      let pkgId;
      if (i === 0 && actions >= 2 && rng() < 0.25) pkgId = 'sim';
      else if (team.car <= (team.minCar || 50) + 5 || team.budgetNow < balCost * 1.6) pkgId = 'chass';
      else pkgId = rng() < 0.5 ? 'aero' : 'power';

      executeRDAction(team, stratId, pkgId);
    }
  });
}

/* =========================================================================
   ==================== AI EVOLUTION / TRANSFERS ===========================
   ========================================================================= */
function processAIEvolutionAndRetirements() {
  const survivingDrivers = [];
  const retirements = [];

  S.drivers.forEach(d => {
    if (d.isPlayer) { d.age++; survivingDrivers.push(d); return; }
    d.age++;

    const retirementChance = d.age >= RETIRE_AGE
      ? 1
      : d.age >= 37
        ? (d.age - 36) * 0.15
        : 0;

    if (rng() < retirementChance) {
      if (S.telemetry) S.telemetry.retirementsCount++;
      retirements.push(d.id);
      const newRookie = generateRandomRookie(d.teamId);
      survivingDrivers.push(newRookie);
    } else {
      let driverDelta = 0;
      if (d.age <= 24 && d.ovr >= 87)     driverDelta = rnd(-0.2, 0.8);
      else if (d.age <= 24)               driverDelta = rnd(0.8, 2.5);
      else if (d.age <= 32)               driverDelta = rnd(-0.3, 0.9);
      else                                driverDelta = rnd(-1.2, 0.2);

      d.ovr = Math.round(clamp(d.ovr + driverDelta, 62, 97));
      survivingDrivers.push(d);
    }
  });

  S.drivers = survivingDrivers;

  if (S.rivalId && retirements.includes(S.rivalId)) {
    S.rivalId = selectRivalFromDriverList(S.player);
    S.rivalryPoints = 0;
  }
}

const RIVAL_SWITCH_AFTER_SEASONS = 3;

function shouldOfferRivalSwitch() {
  return (S.rivalSeasons || 0) >= RIVAL_SWITCH_AFTER_SEASONS && !!S.rivalId;
}

function getRivalSwitchCandidates() {
  const p = S.player;
  const myTeam = teamById(p.teamId);
  if (!myTeam) return [];

  const base = S.drivers.filter(d =>
    !d.isPlayer &&
    d.teamId !== p.teamId &&
    d.id !== S.rivalId
  );

  const inBand = base.filter(d => {
    const t = teamById(d.teamId);
    if (!t) return false;
    return Math.abs(t.car - myTeam.car) <= 10;
  });

  const pool = inBand.length >= 2 ? inBand : base;

  const scored = pool.map(d => {
    const t = teamById(d.teamId);
    const score = Math.abs(d.ovr - p.ovr) + Math.abs(d.age - p.age) * 0.5;
    return { d, t, score };
  }).sort((a, b) => a.score - b.score);

  return scored.slice(0, 4).map(s => ({
    id: s.d.id,
    name: s.d.name,
    nat: s.d.nat,
    age: s.d.age,
    ovr: s.d.ovr,
    teamId: s.d.teamId,
    teamName: s.t ? s.t.name : '—',
    teamColor: safeColor(s.t ? s.t.color : null),
    teamCar: s.t ? s.t.car : 70
  }));
}

function switchRivalTo(newRivalId) {

function selectRivalFromDriverList(player) {
  const myTeam = teamById(player.teamId);
  if (!myTeam) return null;

  const filterFn = (d, carDelta) => {
    if (d.isPlayer) return false;
    if (d.teamId === player.teamId) return false;
    const t = teamById(d.teamId);
    if (!t) return false;
    return Math.abs(t.car - myTeam.car) <= carDelta;
  };

  let candidates = S.drivers.filter(d => filterFn(d, 10));
  if (candidates.length < 2) candidates = S.drivers.filter(d => filterFn(d, 15));
  if (candidates.length < 2) candidates = S.drivers.filter(d => !d.isPlayer && d.teamId !== player.teamId);
  if (!candidates.length) return null;

  let best = null, bestScore = Infinity;
  candidates.forEach(d => {
    const score = Math.abs(d.age - player.age) * 2 + Math.abs(d.ovr - player.ovr);
    if (score < bestScore) { bestScore = score; best = d; }
  });
  return best ? best.id : null;
}

function processAITransfers() {
  const aiDrivers = S.drivers.filter(d => !d.isPlayer);
  let transfersCount = 0;
  const maxTransfers = irnd(3, 4);
  const moved = new Set();

  aiDrivers.forEach(d => {
    if (moved.has(d.id)) return;
    if (transfersCount >= maxTransfers) return;
    if ((d.contract || 0) > 0) return;          /* v22: solo contratti scaduti */

    const currentTeam = teamById(d.teamId);
    if (!currentTeam) return;
    const strandedInFallenTopTeam = d.ovr >= 84 && currentTeam.car < 78;
    const strandedInWeakTeam      = d.ovr >= 83 && currentTeam.car < 75;

    const wantsMove = (strandedInFallenTopTeam && rng() < 0.65)
                   || (!strandedInFallenTopTeam && strandedInWeakTeam && rng() < 0.5);

    if (wantsMove) {
      const topTeams = S.teams.filter(t => t.car >= 84 && t.id !== d.teamId);
      if (topTeams.length > 0) {
        const targetTeam = topTeams[Math.floor(rng() * topTeams.length)];
        const targetTeamDrivers = aiDrivers.filter(td => td.teamId === targetTeam.id && !moved.has(td.id));
        if (targetTeamDrivers.length > 0) {
          const weakestTarget = targetTeamDrivers.slice().sort((a, b) => a.ovr - b.ovr)[0];
          if (weakestTarget && d.ovr > weakestTarget.ovr) {
            moved.add(d.id);
            moved.add(weakestTarget.id);
            const tempTeam = d.teamId;
            d.teamId = targetTeam.id;
            weakestTarget.teamId = tempTeam;
            d.contract = irnd(1, 3);
            weakestTarget.contract = irnd(1, 3);
            transfersCount++;
          }
        }
      }
    }
  });

  if (S.telemetry) S.telemetry.transfersCount += transfersCount;
}

function generateRandomRookie(teamId) {
  const baseRookieOvr = irnd(74, 80);
  if (!S.rookiePoolUsed) S.rookiePoolUsed = [];

  const availableIdx = F2_ROOKIE_POOL
    .map((_, idx) => idx)
    .filter(idx => !S.rookiePoolUsed.includes(idx));

  let name, nat;
  if (availableIdx.length > 0) {
    const pick = availableIdx[Math.floor(rng() * availableIdx.length)];
    S.rookiePoolUsed.push(pick);
    name = F2_ROOKIE_POOL[pick].name;
    nat  = F2_ROOKIE_POOL[pick].nat;
  } else {
    const fName = RANDOM_NAMES_FIRST[Math.floor(rng() * RANDOM_NAMES_FIRST.length)];
    const lName = RANDOM_NAMES_LAST[Math.floor(rng() * RANDOM_NAMES_LAST.length)];
    const natPair = NATIONS[Math.floor(rng() * NATIONS.length)];
    name = fName + ' ' + lName;
    nat  = natPair[0];
  }

  return {
    id: 'rookie_' + rng().toString(36).substring(2, 7),
    name: sanitizeName(name, FULLNAME_MAX),
    nat: nat,
    teamId: teamId,
    ovr: baseRookieOvr,
    age: irnd(18, 22),
    isPlayer: false,
    pts: 0, wins: 0, podiums: 0, poles: 0, dnf: 0,
    contract: irnd(2, 3), role: null, trait: null,
    fin: newFin(), fl: 0
  };
}

/* =========================================================================
   ============================ RIVALRY ====================================
   ========================================================================= */

function updateRivalryAfterRace(raceResults) {
  if (!S.rivalId) return null;
  const me = raceResults.find(r => r.id === 'PLAYER');
  const rival = raceResults.find(r => r.id === S.rivalId);
  if (!me || !rival) return null;

  let delta = 0;
  let reason = '';

     if (me.dnf && rival.dnf)      { delta = 0;  reason = t('rival.reason.both_dnf'); }
  else if (me.dnf)              { delta = -1; reason = t('rival.reason.me_dnf'); }
  else if (rival.dnf)           { delta = 1;  reason = t('rival.reason.rival_dnf'); }
  else if (me.pos < rival.pos)  { delta = 1;  reason = t('rival.reason.vs', { me: me.pos, rival: rival.pos }); }
  else if (me.pos > rival.pos)  { delta = -1; reason = t('rival.reason.vs', { me: me.pos, rival: rival.pos }); }
  else                          { delta = 0;  reason = t('rival.reason.same', { n: me.pos }); }

  S.rivalryPoints += delta;
  S.rivalryTotal  += delta;

  const race = CALENDAR[S.round];
  if (race) {
    S.rivalryHistory.push({
      year: S.year, round: S.round,
      gp: race.gp, flag: race.flag,
      rivalId: S.rivalId, rivalName: rival.name,
      mePos: me.pos, rivalPos: rival.pos,
      meDnf: me.dnf, rivalDnf: rival.dnf,
      delta, reason
    });
    if (S.rivalryHistory.length > RIVALRY_HISTORY_CAP) {
      S.rivalryHistory = S.rivalryHistory.slice(-RIVALRY_HISTORY_CAP);
    }
  }
  return { delta, reason };
}

   ============================ SEASON RECORD ==============================

function recordSeasonAndHallOfFame(standings, tStandings, pos, wonTitle, mate, progressionResult) {
  const p = S.player;
  const champion = standings[0];
  const championTeam = teamById(champion.teamId);
  const constructorChamp = tStandings[0];
  const constructorColor = safeColor(teamById(constructorChamp.id)?.color);

  S.hallOfFamePiloti.push({
    year: S.year, driverName: champion.name, driverNat: champion.nat,
    teamName: championTeam?.name || '—', teamColor: safeColor(championTeam?.color),
    playerWon: wonTitle
  });
  if (S.hallOfFamePiloti.length > HOF_CAP) S.hallOfFamePiloti = S.hallOfFamePiloti.slice(-HOF_CAP);

  S.hallOfFameCostruttori.push({
    year: S.year, teamName: constructorChamp.name, teamColor: constructorColor,
    playerTeamWon: constructorChamp.id === p.teamId
  });
  if (S.hallOfFameCostruttori.length > HOF_CAP) S.hallOfFameCostruttori = S.hallOfFameCostruttori.slice(-HOF_CAP);

  const rival = rivalDriver();
  S.history.push({
    year: S.year,
    team: playerTeam()?.name || '—',
    teamColor: safeColor(playerTeam()?.color),
    pos, points: p.pts, wins: p.wins, podiums: p.podiums, poles: p.poles, dnf: p.dnf,
    ovrStart: progressionResult.oldOVR, ovrEnd: progressionResult.newOVR,
    title: wonTitle, matePts: mate ? mate.pts : 0, mateName: mate ? mate.name : '—',
    champion: champion.name,
    rivalPts: rival ? rival.pts : null,
    rivalName: rival ? rival.name : null,
    rivalryPoints: S.rivalryPoints
  });
  if (S.history.length > HISTORY_CAP) S.history = S.history.slice(-HISTORY_CAP);

  S.totals.seasons++;
  if (wonTitle) S.totals.titles++;

  trackSeasonTelemetry(standings, tStandings);
}

/* =========================================================================
   ============================ SEASON FLOW ================================
   ========================================================================= */
function resolveSeasonCareerState(pos) {
  const p = S.player;
  p.contract--;
  S.fired = p.ovr < diff().fireOvr;
  if (S.fired) p.contract = 0;

  S.screen = 'progress';

  if (p.age >= RETIRE_AGE) {
    S.retired = true;
    S.pendingScreenAfterProgress = 'retire';
    return;
  }

  if (p.contract <= 0) {
    S.offers = generateOffers(pos);
    if (S.offers.length === 0) {
      S.gameOver = true;
      S.pendingScreenAfterProgress = 'gameover';
      return;
    }
    S.pendingScreenAfterProgress = 'market';
  } else {
    S.pendingScreenAfterProgress = null;
  }
}

function advanceFromProgress() {
  const target = S.pendingScreenAfterProgress;
  S.pendingScreenAfterProgress = null;
  if (target === 'market') { S.screen = 'market'; save(); render(); return; }
  if (target === 'retire') { S.screen = 'retire'; save(); render(); return; }
  if (target === 'gameover') { S.screen = 'gameover'; save(); render(); return; }
  if (shouldOfferRivalSwitch()) { goRivalSwitch(); return; }
  startNewSeason();
}

function endSeason() {
  const p = S.player;
  const standings = driverStandings();
  const pos = standings.findIndex(d => d.isPlayer) + 1;
  const mate = teammate();
  const champion = standings[0];
  const wonTitle = champion?.isPlayer === true;

  if (!champion) {
    S.gameOver = true;
    S.screen = 'gameover';
    save(); render();
    return;
  }

  if (S.sponsor && !S.sponsor.completed && S.sponsor.type === 'title' && wonTitle) {
    S.sponsor.completed = true;
    S.pendingBonus = (S.pendingBonus || 0) + S.sponsor.reward;
   toast(t('toast.sponsor_completed') + ' ' + t('toast.sponsor_next_season', { n: S.sponsor.reward }), 'good');
  }

  const tStandings = teamStandings();
  const progression = calculatePlayerProgression(p, mate, pos, wonTitle);
  const progressionResult = applyPlayerProgression(p, progression);
  const rivalryBonus = applyRivalryBonus(p);
  progressionResult.newOVR = p.ovr;

  const repDelta = updateReputation(pos, wonTitle);
  S.totals.earnings = (S.totals.earnings || 0) + (p.salary || 0);
   progression.reasons.push(['prog.reason.rep', (repDelta >= 0 ? '+' : '') + repDelta]);

  recordSeasonAndHallOfFame(standings, tStandings, pos, wonTitle, mate, progressionResult);
    S.rivalSeasons = (S.rivalSeasons || 0) + 1;
  processAIEvolutionAndRetirements();
  tickAIContracts();
  processAITransfers();
  renewAIContracts();
  assignTeamRoles();
  S.mateTension = Math.round(S.mateTension * 0.5);

  processAIRDActivity(tStandings, false);
  updateTeamBudgetsForNextSeason(tStandings);
  updateTeamPerformance(tStandings);

  S.progression = {
    delta: progression.delta,
    speedDelta: progression.speedDelta,
    consDelta:  progression.consDelta,
    tyreDelta:  progression.tyreDelta,
    reasons: progression.reasons,
    oldOVR: progressionResult.oldOVR,
    newOVR: progressionResult.newOVR,
    pos, wonTitle,
    rivalryBonus: rivalryBonus.applied > 0 ? rivalryBonus : null
  };

  S.rivalryPoints = 0;
  resolveSeasonCareerState(pos);
  save();
  render();
}

/* =========================================================================
   ============================== MARKET ===================================
   ========================================================================= */
function generateOffers(lastSeasonPos) {
  const p = S.player;
  const offers = [];
  const myTeam = playerTeam();
  const myCar = myTeam ? myTeam.car : 0;

  S.teams.forEach(t => {
    if (S.fired && t.id === p.teamId) return;

    // Calcola "fit": quanto il pilota è adatto a questo team
      const ovrFit = p.ovr - t.car;
    if (ovrFit < -14) return;   // allargato da -8 a -14
    if (ovrFit > 22) return;    // allargato da 18 a 22

    // Filtro "sale se puoi, resta se sei arrivato"
    const isUpgrade = t.car > myCar + 2;
    const isLateral = Math.abs(t.car - myCar) <= 2;
    const isDowngrade = t.car < myCar - 3;

    // Downgrade bloccati (tranne se sei licenziato)
    if (isDowngrade && !S.fired) return;

    // Interesse base
    let interest = 10;

    // Bonus per team di alto prestigio (Mercedes/Ferrari attirano)
    interest += (t.prestige - 60) * 0.3;

    // Bonus titoli e reputazione
    interest += S.totals.titles * 3;
    interest += Math.max(0, S.reputation - 40) * 0.5;

    // Posizione in campionato
    if (Number.isFinite(lastSeasonPos)) {
      if (lastSeasonPos <= 3)       interest += 10;
      else if (lastSeasonPos <= 8)  interest += 5;
      else if (lastSeasonPos <= 14) interest += 0;
      else                          interest -= 5;
    }

    // Bonus current team (ti tiene se sei adatto)
      if (t.id === p.teamId) {
      if (ovrFit >= -5 && ovrFit <= 10) interest += 8;
      else interest += 0;
    }

    // Malus current team se tensione alta
    if (S.mateTension >= 70 && t.id === p.teamId) interest -= 15;

    // Noise per varietà
    interest += rnd(0, 8);

    if (interest > 0) {
      // Ruolo in base a quanto sei più forte della macchina
      const role = ovrFit > 6 ? ROLE_FIRST
                 : ovrFit > -3 ? ROLE_STD
                 : ROLE_SECOND;
           const years  = isUpgrade ? irnd(2, 3) : irnd(1, 2);
      const salary = Math.round(clamp(
        (p.ovr - 55) * 0.35
        + t.prestige * 0.08
        + interest * 0.15
        + S.reputation * 0.05,
        1, 40
      ));
      offers.push({ teamId: t.id, role, years, salary, interest: round1(interest) });
    }
  });

  return offers.sort((a, b) => b.interest - a.interest).slice(0, 5);
}

function confirmAcceptOffer(offerIndex) {
  if (!S || !S.offers) return;
  const offer = S.offers[offerIndex];
  if (!offer) return;
  const team = teamById(offer.teamId);
const msg = t('market.confirm_title', { team: team.name }) + '\n\n'
          + t('market.confirm_desc', { role: roleLabel(offer.role), years: offer.years, sal: offer.salary });
  askConfirm(msg, () => acceptOffer(offer), { yes: t('market.sign_btn') });
}

function acceptOffer(offer) {
  const p = S.player;
  const oldTeam = p.teamId;
  const newTeam = offer.teamId;

  if (oldTeam !== newTeam) {
    const targets = S.drivers.filter(d => d.teamId === newTeam && !d.isPlayer);
    const weakest = targets.slice().sort((a, b) => a.ovr - b.ovr)[0];
    if (weakest) weakest.teamId = oldTeam;
    p.teamId = newTeam;
  }

  const rivalStillValid = S.rivalId && S.drivers.some(d => d.id === S.rivalId && d.teamId !== newTeam);
  if (!rivalStillValid) {
    S.rivalId = selectRivalFromDriverList(p);
    S.rivalryPoints = 0;
  }

  p.contract = offer.years;
  p.salary = offer.salary;
  p.role = offer.role;

  S.regulationSnapshot = null;
  S.regulationPending = false;
  S.pendingScreenAfterProgress = null;

  assignTeamRoles();
  if (shouldOfferRivalSwitch()) { goRivalSwitch(); return; }
  startNewSeason();
}

function startNewSeason() {
  if (S.sponsor) {
    if (!S.sponsorHistory) S.sponsorHistory = [];
    S.sponsorHistory.unshift({
      year: S.year,
	   id: S.sponsor.id,
      name: S.sponsor.name,
      completed: S.sponsor.completed,
      reward: S.sponsor.completed ? S.sponsor.reward : 0
    });
    if (S.sponsorHistory.length > SPONSOR_HISTORY_CAP) {
      S.sponsorHistory = S.sponsorHistory.slice(0, SPONSOR_HISTORY_CAP);
    }
  }

  S.year++;
  S.round = 0;
  S.grid = null;
  S.lastRace = null;
  S.seasonLog = [];
  S.weather = null;
  S.rdOpen = true;
  S.rdDone = 0;
  S.offers = null;
  S.fired = false;
  S.setupBonus = 0;
  S.setupLabel = null;
  S.playerStrategy = null;
  S.strategyLabel = null;
  S.lastSafetyCar = false;
  S.sponsor = null;
  S.sponsorOffers = generateSponsorOffers();
  S.quali = null;
  S.radioLog = [];
  S.reviewingFromStrategy = false;
  S.pendingScreenAfterProgress = null;
  S._snowballActive = 0;
  S.forecast = null;
  S.raceLive = null;
  S.lastSprint = null;
  S.lastFastestLap = null;
  S.sprintDone = false;
    S.asphaltTemp = null;

  S.regulationSnapshot = null;
  S.teams.forEach(t => { t.simCharges = 0; });

  const pt = playerTeam();
  const carryOver = Math.min(S.budget * BUDGET_CARRYOVER_RATE, BUDGET_CARRYOVER_CAP);
  const bonus = S.pendingBonus || 0;
  S.pendingBonus = 0;
   S.budget = Math.max(0, Math.round(((pt.budgetNow || pt.budget) + irnd(-5, 15)) * diff().budgetMult + carryOver + bonus));
  S.budget = Math.max(S.budget, 40);
  S.drivers.forEach(d => {
    d.pts = 0; d.wins = 0; d.podiums = 0; d.poles = 0; d.dnf = 0;
    d.fin = newFin();
    d.fl = 0;
  });

  if (S.year % REGULATION_PERIOD === 0) {
    S.regulationPending = true;
    S.regulationSnapshot = null;
    applyRegulationCompression();
    S.screen = 'regulations';
    S.tab = 'race';
    save(); render();
    return;
  }

  S.screen = 'hub';
  S.tab = 'race';
  save(); render();
}

/* =========================================================================
   ====================== REGOLAMENTO TECNICO ==============================
   ========================================================================= */

function applyRegulationCompression() {
  S.regulationSnapshot = {};
  S.teams.forEach(t => {
    const oldCar = t.car;
    const compressed = REGULATION_MEDIAN + (oldCar - REGULATION_MEDIAN) * REGULATION_COMPRESSION;
    const noise = rnd(-REGULATION_NOISE, REGULATION_NOISE);
    const upperBound = (t.isSatellite && typeof t.maxCar === 'number') ? t.maxCar : 99;
    t.car = round1(clamp(compressed + noise, REG_FLOOR, upperBound));
    if (t.minCar > t.car + 2) t.minCar = Math.max(45, t.car - 2);
    S.regulationSnapshot[t.id] = { old: round1(oldCar), compressed: t.car };
  });
}

function pickAIRegulationApproach(team) {
  const b = team.budgetNow || 0;
  const r = rng();
  if (b < 30) {
    if (r < 0.30) return 'scommessa';
    return 'cons';
  }
  if (b >= 100) {
    if (r < 0.50) return 'rev';
    if (r < 0.92) return 'bal';
    return 'cons';
  }
  if (b >= 60) {
    if (r < 0.30) return 'rev';
    if (r < 0.80) return 'bal';
    return 'cons';
  }
  if (r < 0.12) return 'rev';
  if (r < 0.40) return 'scommessa';
  if (r < 0.80) return 'bal';
  return 'cons';
}

function rollRegulationDelta(approachId, team) {
  const strat = REGULATION_STRATEGIES[approachId];
  let delta = rnd(strat.deltaMin, strat.deltaMax);
  let flop = false;
  if (approachId === 'rev' && team.car > REG_FLOP_CAR_THRESHOLD && rng() < REG_FLOP_CHANCE) {
    delta -= rnd(4, 9);
    flop = true;
  }
  return { delta, flop };
}

function processAIRegulationChoices() {
  const summary = [];

  S.teams.forEach(team => {
    if (team.id === S.player.teamId) return;
    let approachId = pickAIRegulationApproach(team);
    let strat = REGULATION_STRATEGIES[approachId];

    if ((team.budgetNow || 0) < strat.cost) {
      approachId = 'cons';
      strat = REGULATION_STRATEGIES.cons;
    }
    const actualCost = Math.min(strat.cost, team.budgetNow || 0);
    team.budgetNow = Math.max(0, (team.budgetNow || 0) - actualCost);

    const { delta, flop } = rollRegulationDelta(approachId, team);
    const upperBound = (team.isSatellite && typeof team.maxCar === 'number') ? team.maxCar : 99;
    team.car = round1(clamp(team.car + delta, REG_FLOOR, upperBound));
    if (team.car < team.minCar) team.minCar = Math.max(45, team.car - 2);

    if (!team.rdHistory) team.rdHistory = [];
    team.rdHistory.unshift({
      year: S.year, round: 0,
      delta: round1(delta),
      outcome: delta > 0.5 ? 'good' : delta < -0.5 ? 'fail' : 'neutral',
      strat: '⚙️ Regolamento ' + strat.name,
      regulation: true,
      flop
    });
    if (team.rdHistory.length > 20) team.rdHistory.length = 20;

    summary.push({
      teamId: team.id,
      teamName: team.name,
      teamColor: safeColor(team.color),
      approach: approachId,
      approachName: strat.name,
      cost: actualCost,
      delta: round1(delta),
      flop
    });
  });

  return summary;
}

function applyPlayerRegulationChoice(approachId) {
  if (!S || !S.regulationPending) return;
  const strat = REGULATION_STRATEGIES[approachId];
  if (!strat) return;

  let actualCost = strat.cost;
   // (riga ~dove c'è il check budget)
  if (S.budget < strat.cost) {
    if (approachId === 'cons') actualCost = Math.min(strat.cost, S.budget);
    else { toast(t('reg.budget_short'), 'bad'); return; }         // ← patch
  }
  S.budget = Math.max(0, S.budget - actualCost);

  const team = playerTeam();
  const { delta, flop } = rollRegulationDelta(approachId, team);
  const upperBound = (team.isSatellite && typeof team.maxCar === 'number') ? team.maxCar : 99;
  team.car = round1(clamp(team.car + delta, REG_FLOOR, upperBound));
  if (team.car < team.minCar) team.minCar = Math.max(45, team.car - 2);

  const aiSummary = processAIRegulationChoices();

  if (!S.regulationHistory) S.regulationHistory = [];
   S.regulationHistory.push({
    year: S.year, approach: approachId, approachName: strat.name,
    cost: actualCost, delta: round1(delta), flop, aiSummary
  });
  if (S.regulationHistory.length > REG_HISTORY_CAP) {
    S.regulationHistory = S.regulationHistory.slice(-REG_HISTORY_CAP);
  }

     S.lastRegulationInfo = {
    year: S.year, approach: approachId, approachName: strat.name, delta: round1(delta),
    cost: actualCost, flop, aiSummary
  };

  S.regulationPending = false;
  S.regulationSnapshot = null;
  S.screen = 'hub';
  S.tab = 'race';

  save(); render();

 toast(
  (flop ? '💥 ' : delta >= 3 ? '✅ ' : delta >= 0 ? '➖ ' : '⚠️ ') +
  t('reg.toast', { name: t('reg.strat.' + approachId + '.name'), delta: (delta >= 0 ? '+' : '') + round1(delta) }),
  delta >= 3 ? 'good' : delta < 0 || flop ? 'bad' : 'neutral'
);
}

const app = document.getElementById('app');

function toast(msg, kind) {
  if (IO_SUSPENDED) return;
  const t = document.getElementById('toast');
  const b = document.getElementById('toastBox');
  b.textContent = msg;
  b.className = 'px-4 py-3 rounded-xl neon-soft text-sm font-semibold ' +
    (kind === 'good' ? 'bg-emerald-600 text-white'
    : kind === 'bad' ? 'bg-racing text-white'
    : 'bg-carbon3 text-slate-100');
  t.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), 2600);
}

let _modalCleanup = null;

function closeModal() {
  if (_modalCleanup) {
    const fn = _modalCleanup;
    _modalCleanup = null;
    fn();
  }
}

function askConfirm(message, onYes, opts) {
  opts = opts || {};
  closeModal();
  const prevFocus = document.activeElement;

  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/70';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-labelledby', 'modalMsg');
  overlay.innerHTML = `
    <div class="anim w-full max-w-sm rounded-2xl bg-carbon2 neon-soft p-5">
      <p id="modalMsg" class="text-sm text-slate-200 whitespace-pre-line">${esc(message)}</p>
      <div class="flex gap-3 mt-5">
        <button type="button" data-modal="no"  class="flex-1 py-3 rounded-xl bg-carbon3 text-slate-300 font-semibold">${esc(opts.no || t('common.cancel'))}</button>
<button type="button" data-modal="yes" class="flex-1 py-3 rounded-xl bg-racing neon font-black">${esc(opts.yes || t('common.confirm'))}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const yesBtn = overlay.querySelector('[data-modal="yes"]');
  const noBtn  = overlay.querySelector('[data-modal="no"]');

    const finish = (result) => {
    closeModal();
    if (!result) return;
    try { onYes(); }
    catch (e) {
      console.error('Errore nell\'azione di conferma:', e);
      try { toast(t('toast.action_failed', { err: e && e.message ? e.message : 'error' }), 'bad'); } catch (_) {}
    }
  };
  const onKey = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); finish(false); return; }
    if (e.key === 'Tab') {
      e.preventDefault();
      const items = [noBtn, yesBtn];
      const idx = items.indexOf(document.activeElement);
      let next;
      if (idx === -1) next = e.shiftKey ? items.length - 1 : 0;
      else next = (idx + (e.shiftKey ? -1 : 1) + items.length) % items.length;
      items[next].focus();
    }
  };

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) { finish(false); return; }
    const btn = e.target.closest('[data-modal]');
    if (btn) finish(btn.dataset.modal === 'yes');
  });
  document.addEventListener('keydown', onKey, true);

  _modalCleanup = () => {
    document.removeEventListener('keydown', onKey, true);
    overlay.remove();
    if (prevFocus && document.contains(prevFocus) && typeof prevFocus.focus === 'function') {
      try { prevFocus.focus({ preventScroll: true }); } catch (_) {}
    }
  };

  (opts.danger ? noBtn : yesBtn).focus();
}

  if (!draft.first || !draft.last) { toast(t('toast.name_invalid'), 'bad'); return; }
  draft.nat = document.getElementById('fNat').value;
  draft.age = +document.getElementById('fAge').value;
  draft.step = 2;
  renderCreate();
}

function createStep2() {
  const used = draft.speed + draft.consistency + draft.tyres;
  if (used > draftPool()) { toast(t('toast.points_exceeded'), 'bad'); return; }
  draft.step = 3;
  renderCreate();
}

function createStep3() {
  if (!draft.teamId) return;

  if (draft.rivalId) {
    const rivalData = AI_DRIVERS.find(d => d.id === draft.rivalId);
    if (!rivalData || rivalData.team === draft.teamId) draft.rivalId = null;
  }
  if (!draft.rivalId) {
    const cands = getRivalCandidatesForCreate(
      draft.teamId, draft.age,
      computeOVR(draft.speed, draft.consistency, draft.tyres)
    );
    if (cands.length) draft.rivalId = cands[0].id;
  }
  draft.step = 4;
  renderCreate();
}

function createFinish() {
  if (!draft.teamId) return;
  CURRENT_SLOT = draft.slot || 1;
  S = newCareer(draft);
  S.rdOpen = true;
  save();
  render();
  toast(t('toast.welcome_f1', { name: S.player.last }), 'good');
}

function continueCareer() {
  S = load(CURRENT_SLOT);
  if (!S) { toast(t('toast.save_corrupt'), 'bad'); return; }
  RNG_STATE = S.rngState >>> 0;
  if (!S.sponsor && (!S.sponsorOffers || !S.sponsorOffers.length) && S.round < CALENDAR.length) {
    S.sponsorOffers = generateSponsorOffers();
  }
  if (!S.rivalId) S.rivalId = selectRivalFromDriverList(S.player);
  if (S.drivers.some(d => !d.role)) assignTeamRoles(S);
  save();
  render();
}
