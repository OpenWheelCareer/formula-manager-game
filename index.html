/* =========================================================================
   ========================= STANDINGS HELPERS =============================
   ========================================================================= */

function countback(a, b) {
  const fa = a.fin || [], fb = b.fin || [];
  for (let i = 0; i < 10; i++) {
    const d0 = (fb[i] || 0) - (fa[i] || 0);
    if (d0) return d0;
  }
  return 0;
}

function driverStandings() {
  return [...S.drivers].sort((a, b) => b.pts - a.pts || countback(a, b));
}

function teamStandings() {
  return S.teams.map(t => {
    const ds = S.drivers.filter(d => d.teamId === t.id);
    const fin = newFin().map((_, i) => ds.reduce((s, d) => s + ((d.fin && d.fin[i]) || 0), 0));
    return { ...t, pts: ds.reduce((s, d) => s + d.pts, 0), drivers: ds, fin };
  }).sort((a, b) => b.pts - a.pts || countback(a, b));
}

function playerPos() {
  if (!S || !S.drivers || !S.drivers.length) return '—';
  const idx = driverStandings().findIndex(d => d.isPlayer);
  return idx < 0 ? '—' : idx + 1;
}

/* =========================================================================
   ============================= TRAIT ====================================
   ========================================================================= */

function traitBonus(trait, phase, weatherName, circuitType) {
  switch (trait) {
    case 'rain':   return phase === 'race' ? (weatherName === 'Asciutto' ? -0.5 : 2.0) : 0;
    case 'quali':  return phase === 'quali' ? 1.5 : -0.4;
    case 'racer':  return phase === 'race' ? 1.0 : -1.0;
    case 'street': return circuitType === 'twisty' ? 1.5 : circuitType === 'power' ? -0.5 : 0;
    case 'power':  return circuitType === 'power' ? 1.5 : circuitType === 'twisty' ? -0.5 : 0;
    default:       return 0;
  }
}

function basePace(d) {
  const car = teamById(d.teamId).car;
  const circuit = CALENDAR[S.round];
  let pace = car * SIM_TUNING.qualiCarWeight + d.ovr * SIM_TUNING.qualiOvrWeight;
  pace += traitBonus(d.trait, 'quali', S.weather ? S.weather.name : 'Asciutto', circuit ? circuit.type : 'balanced');
  pace += ROLE_PACE[d.role] || 0;
  if (d.isPlayer) pace += (S.setupBonus || 0) + diff().paceBonus;
  return pace;
}

/* =========================================================================
   ============================= DEBUG ====================================
   ========================================================================= */

function debugInvariants() {
  const issues = [];
  const check = (cond, msg) => { if (!cond) issues.push(msg); };
  if (!S) { console.warn('No active state'); return []; }

  check(S.player.ovr >= 30 && S.player.ovr <= 99, 'Player OVR out of range: ' + S.player.ovr);
  check(S.player.age >= 18 && S.player.age <= 60, 'Player age out of range: ' + S.player.age);
  check(S.player.speed >= 30 && S.player.speed <= 99, 'Player speed out of range');
  check(S.player.consistency >= 30 && S.player.consistency <= 99, 'Player consistency out of range');
  check(S.player.tyres >= 30 && S.player.tyres <= 99, 'Player tyres out of range');

  const teamIds = new Set();
  S.teams.forEach(t => {
    check(!teamIds.has(t.id), 'Duplicate team ID: ' + t.id);
    teamIds.add(t.id);
    check(t.car >= 30 && t.car <= 99, 'Team ' + t.id + ' car out of range: ' + t.car);
    check(t.budgetNow >= 0, 'Team ' + t.id + ' budgetNow negative: ' + t.budgetNow);
    const drivers = S.drivers.filter(d => d.teamId === t.id);
    check(drivers.length === 2, 'Team ' + t.id + ' has ' + drivers.length + ' drivers (expected 2)');
  });

  const driverIds = new Set();
  S.drivers.forEach(d => {
    check(!driverIds.has(d.id), 'Duplicate driver ID: ' + d.id);
    driverIds.add(d.id);
    check(d.ovr >= 30 && d.ovr <= 99, 'Driver ' + d.name + ' OVR out of range: ' + d.ovr);
    check(d.age >= 18 && d.age <= 60, 'Driver ' + d.name + ' age out of range: ' + d.age);
    check(teamIds.has(d.teamId), 'Driver ' + d.name + ' has invalid teamId: ' + d.teamId);
    check(d.pts >= 0, 'Driver ' + d.name + ' has negative points');
  });

  check(Number.isInteger(S.round) && S.round >= 0 && S.round <= CALENDAR.length, 'Invalid round: ' + S.round);
  check(S.budget >= 0, 'Player budget negative: ' + S.budget);
  check(Number.isInteger(S.rngState) && S.rngState >= 0 && S.rngState <= 0xFFFFFFFF, 'Invalid RNG state');

  if (S.rivalId) {
    check(S.drivers.some(d => d.id === S.rivalId), 'rivalId punta a pilota inesistente: ' + S.rivalId);
    const r = S.drivers.find(d => d.id === S.rivalId);
    check(r && r.teamId !== S.player.teamId, 'rivalId è nel team del player');
  }

  try { JSON.stringify(S); } catch (e) { issues.push('State not serializable: ' + e.message); }

  if (issues.length === 0) console.log('✅ Tutti gli invarianti OK');
  else {
    console.warn('❌ ' + issues.length + ' violazioni:');
    issues.forEach(i => console.warn('  • ' + i));
  }
  return issues;
}

      overCap: b > BUDGET_CAP ? 'YES' : 'no',
      excess: Math.max(0, Math.round(b - BUDGET_CAP)),
      rdPenaltyPct: Math.round((rdOverCapMultiplier(b) - 1) * 100) + '%'
    };
  });
  console.table(rows);
  return rows;
}

const TESTS = [];

function assert(c, m) { if (!c) throw new Error(m || 'asserzione fallita'); }
function assertEq(a, b, m) {
  if (a !== b) throw new Error((m || 'uguaglianza') + ': ' + JSON.stringify(a) + ' !== ' + JSON.stringify(b));

}

test('computePitLossSc: usa il pitLoss della pista corrente (Monaco vs Monza)', () => {
  const team = { pitCrewBias: 0, pitCrewSigma: 0 };   // crew neutra → isola la pista
  const monaco = CALENDAR.find(c => c.gp === 'Montecarlo');
  const monza  = CALENDAR.find(c => c.gp === 'Italia');

  seedRng(42);
  const rMonaco = computePitLossSc(team, monaco, {});
  seedRng(42);
  const rMonza  = computePitLossSc(team, monza, {});

  /* Monaco: pitLoss 23.5–26.0s → sec entro quel range (senza stack/traffico/fumble) */
  assert(rMonaco.sec >= 22.5 && rMonaco.sec <= 27.0,
    'sec Monaco fuori range: ' + rMonaco.sec.toFixed(2));
  /* Monza: pitLoss 19.5–21.0s → più corto di Monaco */
  assert(rMonza.sec >= 18.5 && rMonza.sec <= 22.0,
    'sec Monza fuori range: ' + rMonza.sec.toFixed(2));
  assert(rMonza.sec < rMonaco.sec,
    'Monza deve essere più corto di Monaco: ' + rMonza.sec.toFixed(2) + ' vs ' + rMonaco.sec.toFixed(2));

  /* sc = sec / gapFactor, sempre */
  assertClose(rMonaco.sc, rMonaco.sec / SIM_TUNING.gapFactor, 0.001, 'sc Monaco incoerente');
  assertClose(rMonza.sc,  rMonza.sec  / SIM_TUNING.gapFactor, 0.001, 'sc Monza incoerente');
});

test('applyPitStop: il pit riduce lo sc e incrementa pitStops', () => {
  withTestState(() => {
    S.round = CALENDAR.findIndex(c => c.gp === 'Montecarlo');
    S.weather = WEATHER_DEFS.Asciutto;
    S.grid = S.drivers.map(d => d.id);
    seedRng(42);

    const L = buildRaceLive();

    /* v32: prima di pitare serve un half-stint per generare wear > 0.
       stepStint() simula il primo half e apre la pit window (pending='pit'). */
    stepStint(L, 'normal');
    assertEq(L.pending, 'pit', 'la pit window deve aprirsi dopo il primo half');

    const me = L.rows.find(r => r.id === 'PLAYER');
    const scBefore = me.sc;
    const stopsBefore = me.pitStops || 0;
    const wearBefore = me.wear;
    assert(wearBefore > 0, 'wear deve essere > 0 dopo un half-stint: ' + wearBefore);

    /* Ora applichiamo il pit (senza doppio stack: prima sosta della gara) */
    applyPitStop(L, L.stint);

    /* Effetti strutturali del pit */
    assert(me.sc < scBefore, 'sc deve calare dopo il pit: ' + scBefore + ' → ' + me.sc);
    assertEq(me.pitStops, stopsBefore + 1, 'pitStops deve incrementarsi di 1');
    assert(me.wear < wearBefore, 'wear deve calare dopo il pit (gomme fresche)');
    assertEq(me.wear, Math.max(0, wearBefore * PIT_WEAR_RESET),
      'wear post-pit atteso = ' + (wearBefore * PIT_WEAR_RESET).toFixed(3));
    assert(me.lastPitBreakdown && Number.isFinite(me.lastPitBreakdown.entry),
      'lastPitBreakdown deve essere popolato');
  });
});

test('v34 pit: undercut è monotono crescente in wearDelta', () => {
  withTestState(() => {
    simQualifying();
    S.raceLive = buildRaceLive();
    const L = S.raceLive;
    const order = liveStandings(L);
    const me = L.rows.find(r => r.id === 'PLAYER');
    const myIdx = order.findIndex(r => r.id === 'PLAYER');
    if (myIdx <= 0) return;   // player già leader: skip

    const ahead = order[myIdx - 1];
    ahead.sc = me.sc + 3;     // gap fisso di ~1.65s
    seedRng(7);

    const bonuses = [];
    for (const delta of [0, 20, 40, 60, 80]) {
      me.wear = 30;
      ahead.wear = 30 + delta;
      seedRng(7);
      bonuses.push(evaluatePitMove(L, 'pit').bonus);
    }

    for (let i = 1; i < bonuses.length; i++) {
      assert(bonuses[i] >= bonuses[i - 1],
        `bonus non monotono: delta ${[0,20,40,60,80][i-1]}→${[0,20,40,60,80][i]} ` +
        `= ${bonuses[i-1]} → ${bonuses[i]}`);
    }
  });
});

test('meteo: la previsione è calibrata (media probs ≈ clima, frequenze ≈ clima)', () => {

      freq[drawWeatherFromForecast(fc).name] += 1 / N;

      assertClose(avg[k], WEATHER_CLIMATE[k], 0.03, 'probs ' + k);

  });
});

function runAllTests() {
  const results = [];
  const t0 = performance.now();
  IO_SUSPENDED = true;
  try {
    for (const t of TESTS) {
      try { t.fn(); results.push({ name: t.name, ok: true }); }
      catch (e) { results.push({ name: t.name, ok: false, err: (e && e.message) || String(e) }); }
    }
  } finally {
    IO_SUSPENDED = false;
  }
  const dur = Math.round(performance.now() - t0);
  return { results, dur, passed: results.filter(r => r.ok).length, total: results.length };
}

function renderTestResults(results, passed, total, dur) {
  const allOk = passed === total;
  app.innerHTML = `
    <div class="anim max-w-3xl mx-auto">
      <h1 class="text-3xl font-black mb-2">${esc(t('test.title'))}</h1>
      <p class="text-slate-400 text-sm mb-5">${total} test • ${dur}ms</p>

      <div class="mb-5 p-4 rounded-2xl border ${allOk ? 'bg-emerald-600/15 border-emerald-600/40' : 'bg-racing/15 border-racing/40'}">
        <div class="text-3xl font-black ${allOk ? 'text-emerald-400' : 'text-racing'}">${passed} / ${total}</div>
        <div class="text-sm text-slate-300 mt-1">${allOk ? esc(t('test.passed')) : esc(t('test.failed'))}</div>
  </div> 
      <div class="space-y-1 max-h-[60vh] overflow-y-auto pr-1">
        ${results.map(r => `
          <div class="flex items-start gap-3 p-3 rounded-xl bg-carbon2">
            <span class="text-lg shrink-0">${r.ok ? '✅' : '❌'}</span>
            <div class="flex-1 min-w-0">
              <div class="text-sm break-words ${r.ok ? 'text-slate-200' : 'text-white font-semibold'}">${esc(r.name)}</div>
              ${r.ok ? '' : `<div class="text-xs text-racing mt-1 break-words font-mono">${esc(r.err || '')}</div>`}
            </div>
          </div>`).join('')}
      </div>

      <button type="button" data-action="menu-back"
        class="mt-5 w-full py-4 rounded-2xl bg-racing neon font-black active:scale-[.98] transition">
                ${esc(t('test.back'))}
      </button>
    </div>`;
}

let _actionLock = false;
function _dispatchAction(name, dataset, el, event) {
  if (_actionLock) return;
  const fn = ACTIONS[name];
  if (!fn) { console.warn('Azione sconosciuta:', name); return; }
  _actionLock = true;
  try { fn(dataset, el, event); }
  finally { setTimeout(() => { _actionLock = false; }, 120); }
}

'facility-upgrade': (d) => {
  const team = playerTeam();
  const fac = d.facId;

  const lv = facilityLevel(team, fac);
  const facName = t('fac.' + fac + '.name');

  if (cost == null) { toast(t('hq.already_max'), 'bad'); return; }
  if (S.budget < cost) { toast(t('toast.rd_budget', { n: cost }), 'bad'); return; }

  askConfirm(
    t('hq.upgrade_confirm', { name: facName, lv: lv + 1, cost }),
    () => {
      S.budget -= cost;
      team.facilities[fac] = lv + 1;
      save(); render();
      toast(t('hq.upgrade_done', { name: facName, lv: team.facilities[fac] }), 'good');

    { yes: t('hq.upgrade_yes') }

const LOCKED_ACTIONS = new Set([
  'go-setup','pick-setup','quali-advance','quali-skip-q3','sprint-continue','pick-strategy',
  'live-pace','live-pit','live-sc','live-orders','live-auto','after-race','season-end','season-eval',
  'progress-next','market-pick','regulation-pick',
  'live-weather'                                       // ← nuova riga separata
]);
let _uiLockUntil = 0;

app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !app.contains(el) || el.disabled) return;
  if (LOCKED_ACTIONS.has(el.dataset.action)) {
    const now = performance.now();
    if (now < _uiLockUntil) return;
    _uiLockUntil = now + 350;
  }
  _dispatchAction(el.dataset.action, el.dataset, el, e);
});

app.addEventListener('input', e => {
  const el = e.target.closest('[data-action-input]');
  if (!el || !app.contains(el)) return;
  _dispatchAction(el.dataset.actionInput, el.dataset, el, e);
});

function activateTab(btn) {
  const id = btn.id;
  btn.click();
  const fresh = id ? document.getElementById(id) : null;
  if (fresh) fresh.focus({ preventScroll: true });
}

app.addEventListener('keydown', e => {
  const tabBtn = e.target.closest('[role="tab"]');
  if (!tabBtn) return;
  const tablist = tabBtn.closest('[data-tablist]');
  if (!tablist) return;
  const tabs = [...tablist.querySelectorAll('[role="tab"]')];
  const idx = tabs.indexOf(tabBtn);
  if (idx < 0) return;

  let next = -1;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (idx + 1) % tabs.length;
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (idx - 1 + tabs.length) % tabs.length;
  else if (e.key === 'Home') next = 0;
  else if (e.key === 'End') next = tabs.length - 1;
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activateTab(tabBtn); return; }
  else return;

  e.preventDefault();
  activateTab(tabs[next]);
});

/* file import */
document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
 if (file.size > 5 * 1024 * 1024) { toast(t('toast.file_too_large'), 'bad'); return; }
  const reader = new FileReader();
  reader.onload  = () => importSaveText(String(reader.result), IMPORT_TARGET);
 reader.onerror = () => toast(t('toast.file_read_failed'), 'bad');
  reader.readAsText(file);
});
